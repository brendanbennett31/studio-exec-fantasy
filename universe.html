<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Universe of Films — Studio Exec Fantasy</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#0d0d14">
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d0d14;
  --bg2:#12121c;
  --bg3:#1a1a28;
  --border:#222233;
  --text:#e8e8f0;
  --muted:#6a6a7e;
  --gold:#f5c842;
  --green:#34d399;
  --red:#ef4444;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:50;height:60px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:rgba(13,13,20,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-logo{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.12em;color:var(--gold);text-decoration:none}
.header-right{display:flex;align-items:center;gap:16px}

/* ── LAYOUT ── */
.page{max-width:1100px;margin:0 auto;padding:48px 32px}
.page-title{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:0.06em;margin-bottom:4px}
.page-sub{font-size:14px;color:var(--muted);margin-bottom:8px}
.back-link{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:20px;transition:color 0.15s}
.back-link:hover{color:var(--text)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 18px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;border:none;font-family:'Inter',sans-serif;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--gold);color:#0d0d14;font-weight:600}
.btn-primary:hover{background:#f7d060}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:#3a3a50;background:#1e1e30}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text)}
.btn-danger{background:rgba(239,68,68,0.1);color:var(--red);border:1px solid rgba(239,68,68,0.2)}
.btn-danger:hover{background:rgba(239,68,68,0.18)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn:disabled{opacity:0.5;cursor:not-allowed}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:220px;max-width:340px}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-input{width:100%;padding:9px 13px 9px 36px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.15s}
.search-input:focus{border-color:rgba(245,200,66,0.4)}
.search-input::placeholder{color:var(--muted)}

/* ── TABLE ── */
.table-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:820px}
thead th{text-align:left;padding:12px 14px;font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg2)}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--text)}
.sort-arrow{margin-left:4px;opacity:0.6;font-size:9px}
tbody tr{border-bottom:1px solid rgba(34,34,51,0.6)}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,0.015)}
td{padding:6px 14px;vertical-align:middle}
.cell-input{width:100%;padding:7px 8px;background:transparent;border:1px solid transparent;border-radius:5px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:all 0.15s}
.cell-input:hover{background:var(--bg3)}
.cell-input:focus{background:var(--bg3);border-color:rgba(245,200,66,0.4)}
.cell-input::placeholder{color:var(--muted);opacity:0.6}
.cell-static{padding:7px 8px;color:var(--text);font-size:13px}
.cell-static.muted{color:var(--muted);font-style:italic}
.col-title{min-width:200px}
.col-notes{min-width:200px}
.col-imdb{min-width:120px;font-family:'JetBrains Mono',monospace;font-size:12px}
.col-actions{width:44px;text-align:center}
.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;transition:all 0.15s}
.icon-btn:hover{color:var(--red);background:rgba(239,68,68,0.1)}
.save-flash{animation:flashGreen 0.6s ease-out}
@keyframes flashGreen{0%{box-shadow:0 0 0 1px var(--green)}100%{box-shadow:0 0 0 1px transparent}}

/* ── EMPTY STATE ── */
.empty-state{background:var(--bg2);border:1px dashed var(--border);border-radius:12px;padding:48px 32px;text-align:center}
.empty-state h3{font-size:18px;font-weight:600;margin-bottom:8px}
.empty-state p{font-size:14px;color:var(--muted);max-width:360px;margin:0 auto 24px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(8px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:480px;position:relative;transform:translateY(16px);transition:transform 0.2s;max-height:90vh;overflow-y:auto}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:5px 9px;border-radius:5px;line-height:1}
.modal-close:hover{color:var(--text);background:var(--bg3)}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.06em;margin-bottom:4px}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:28px}

/* ── FORM ── */
.form-group{margin-bottom:18px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-label{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:7px}
.form-input{width:100%;padding:10px 13px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;transition:border-color 0.15s;outline:none}
.form-input:focus{border-color:rgba(245,200,66,0.4)}
.form-input::placeholder{color:var(--muted)}
textarea.form-input{resize:vertical;min-height:70px}
.form-toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.form-toggle-info label{font-size:13px;font-weight:500;display:block;cursor:pointer}
.toggle{position:relative;width:36px;height:20px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:20px;cursor:pointer;transition:background 0.2s}
.toggle-slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:var(--muted);border-radius:50%;transition:transform 0.2s,background 0.2s}
.toggle input:checked+.toggle-slider{background:rgba(245,200,66,0.2);border:1px solid rgba(245,200,66,0.4)}
.toggle input:checked+.toggle-slider::before{transform:translateX(16px);background:var(--gold)}
.form-error{font-size:12px;color:var(--red);margin-top:14px;padding:10px 13px;background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.2);border-radius:6px;display:none}
.form-error.show{display:block}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}

/* ── LOADING ── */
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px}
.loading-logo{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:0.12em;color:var(--gold);opacity:0.5}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.7s linear infinite}
.spinner-sm{display:inline-block;width:13px;height:13px;border:2px solid rgba(13,13,20,0.3);border-top-color:#0d0d14;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── READ-ONLY BADGE ── */
.readonly-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;background:rgba(106,106,126,0.12);color:var(--muted);border:1px solid var(--border)}

@media(max-width:700px){
  .page{padding:32px 16px}
  header{padding:0 16px}
  .form-row{grid-template-columns:1fr}
  .toolbar{flex-direction:column;align-items:stretch}
  .search-box{max-width:none}
}
</style>
</head>
<body>

<header>
  <a class="header-logo" href="/?home=1" style="text-decoration:none">SEF</a>
  <div class="header-right" style="position:relative">
    <div id="dashProfileIcon" onclick="toggleProfileMenu()" style="width:34px;height:34px;border-radius:50%;background:rgba(212,168,67,0.15);border:1.5px solid rgba(212,168,67,0.4);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px;font-weight:700;color:#d4a843;letter-spacing:0.05em;transition:all 0.15s;flex-shrink:0" onmouseover="this.style.background='rgba(212,168,67,0.25)'" onmouseout="this.style.background='rgba(212,168,67,0.15)'">?</div>
    <div id="dashProfileMenu" style="display:none;position:absolute;right:0;top:calc(100% + 8px);background:#1a1a28;border:1px solid #222233;border-radius:10px;padding:6px;min-width:180px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.4)">
      <div style="padding:8px 12px 10px;border-bottom:1px solid #222233;margin-bottom:4px">
        <div id="menuDisplayName" style="font-size:13px;font-weight:700;color:#e8e8f0">—</div>
        <div id="menuEmail" style="font-size:10px;color:#6a6a7e;margin-top:2px">—</div>
      </div>
      <a href="/dashboard" style="width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;background:transparent;color:#e8e8f0;font-size:13px;cursor:pointer;border-radius:6px;text-decoration:none" onmouseover="this.style.background='#222233'" onmouseout="this.style.background='transparent'">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 6l5-4 5 4v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        My Dashboard
      </a>
      <a href="/about" style="width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;background:transparent;color:#e8e8f0;font-size:13px;cursor:pointer;border-radius:6px;text-decoration:none" onmouseover="this.style.background='#222233'" onmouseout="this.style.background='transparent'">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M7 6.5v4M7 4.5v.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        Help & About
      </a>
      <div style="height:1px;background:#222233;margin:4px 0"></div>
      <button onclick="signOut()" style="width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;background:transparent;border:none;color:#6a6a7e;font-size:13px;cursor:pointer;border-radius:6px;text-align:left;font-family:inherit" onmouseover="this.style.color='#e8e8f0';this.style.background='#222233'" onmouseout="this.style.color='#6a6a7e';this.style.background='transparent'">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M5 2H2v10h3M9 10l3-3-3-3M12 7H5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Sign out
      </button>
    </div>
  </div>
</header>

<div class="page" id="pageContent">
  <div class="loading-screen">
    <div class="loading-logo">SEF</div>
    <div class="spinner"></div>
  </div>
</div>

<!-- ADD FILM MODAL -->
<div class="modal-overlay" id="filmModal" onclick="handleOverlayClick(event,'filmModal')">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('filmModal')">✕</button>
    <div class="modal-title" id="filmModalTitle">ADD FILM</div>

    <div class="form-group">
      <label class="form-label">IMDb ID <span style="text-transform:none;letter-spacing:normal;opacity:0.7">(e.g. tt1234567)</span></label>
      <input class="form-input" type="text" id="fm-imdb" placeholder="tt1234567"/>

      <div class="form-toggle-info">
        <label for="fm-eligible">Oscar Eligible</label>

      <button class="btn btn-secondary" onclick="closeModal('filmModal')">Cancel</button>
      <button class="btn btn-primary" id="filmSaveBtn" onclick="handleSaveFilm()">Add Film</button>

</div>

<!-- DELETE CONFIRM MODAL -->
<div class="modal-overlay" id="deleteModal" onclick="handleOverlayClick(event,'deleteModal')">
  <div class="modal" style="max-width:400px;text-align:center">
    <button class="modal-close" onclick="closeModal('deleteModal')">✕</button>
    <div style="margin-bottom:16px;display:flex;justify-content:center"><svg width="32" height="32" viewBox="0 0 14 14" fill="none"><path d="M7 2L1.5 12h11L7 2z" stroke="#ef4444" stroke-width="1.3" stroke-linejoin="round"/><path d="M7 6v3M7 10.5v.5" stroke="#ef4444" stroke-width="1.3" stroke-linecap="round"/></svg></div>
    <div class="modal-title">Delete Film?</div>
    <div class="modal-sub" id="deleteModalBody">This will permanently remove this film. This cannot be undone.</div>
    <div class="form-actions" style="justify-content:center">
      <button class="btn btn-secondary" onclick="closeModal('deleteModal')">Cancel</button>
      <button class="btn btn-danger" id="deleteConfirmBtn" onclick="handleConfirmDelete()">Delete Permanently</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://fymkwkbatklfynnhxrsf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5bWt3a2JhdGtsZnlubmh4cnNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3OTIzOTksImV4cCI6MjA5NjM2ODM5OX0.XjO1xIS2WLF8JNIwIAKqjCL65ISkSu2u7VaeG8gzaew";

let currentSession = null;
let currentProfile = null;
let isAdmin = false;
let films = [];
let searchQuery = '';
let sortKey = 'release_date';
let sortDir = 'asc';
let _deleteTargetId = null;

// ── AUTH (same pattern as dashboard.html / league.html) ────────────────────────
async function refreshSession(s) {
  if (!s.refresh_token) return null;
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    });
    if (!res.ok) return null;
    const data = await res.json();
    if (!data.access_token) return null;
    const newSession = {
      access_token: data.access_token,
      refresh_token: data.refresh_token || s.refresh_token,
      expires_at: data.expires_at || Math.floor(Date.now()/1000) + 3600,
      user: data.user || s.user
    };
    localStorage.setItem('sef_session', JSON.stringify(newSession));
    return newSession;
  } catch(e) { return null; }
}

function getSession() {
  try {
    const raw = localStorage.getItem('sef_session');
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s.access_token) return null;
    if (s.expires_at && new Date(s.expires_at * 1000) < new Date()) return null;
    return s;
  } catch(e) { return null; }
}

async function getSessionWithRefresh() {
  try {
    const raw = localStorage.getItem('sef_session');
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s.access_token) return null;
    const expiresAt = s.expires_at ? new Date(s.expires_at * 1000) : null;
    const soonExpired = expiresAt && expiresAt < new Date(Date.now() + 5 * 60 * 1000);
    if (soonExpired) {
      const refreshed = await refreshSession(s);
      return refreshed || s;
    }
    return s;
  } catch(e) { return null; }
}

function signOut() {
  localStorage.removeItem('sef_session');
  window.location.href = '/';
}

async function sbFetch(path, options = {}) {
  const session = getSession();
  const headers = {
    'apikey': SUPABASE_ANON_KEY,
    'Content-Type': 'application/json',
    ...(session ? { 'Authorization': `Bearer ${session.access_token}` } : {}),
    ...(options.headers || {})
  };
  const res = await fetch(`${SUPABASE_URL}${path}`, { ...options, headers });
  const text = await res.text();
  let data;
  try { data = JSON.parse(text); } catch(e) { data = text; }
  return { ok: res.ok, status: res.status, data };
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function toggleProfileMenu() {
  const menu = document.getElementById('dashProfileMenu');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', function(e) {
  const btn = document.getElementById('dashProfileIcon');
  const menu = document.getElementById('dashProfileMenu');
  if (menu && btn && !btn.contains(e.target) && !menu.contains(e.target)) menu.style.display = 'none';
});

async function init() {
  currentSession = await getSessionWithRefresh();
  if (!currentSession) { window.location.href = '/'; return; }

  const userId = currentSession.user?.id;
  if (!userId) { signOut(); return; }

  const { ok, data } = await sbFetch(`/rest/v1/profiles?id=eq.${userId}&select=*`);
  if (!ok || !data?.length) { signOut(); return; }

  currentProfile = data[0];
  isAdmin = !!currentProfile.is_admin;

  const name = currentProfile.display_name || currentSession.user?.email || '?';
  const initials = name.includes('@') ? name[0].toUpperCase() : name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase() || '?';
  const icon = document.getElementById('dashProfileIcon');
  if (icon) icon.textContent = initials;
  const dname = document.getElementById('menuDisplayName');
  const demail = document.getElementById('menuEmail');
  if (dname) dname.textContent = currentProfile.display_name || '—';
  if (demail) demail.textContent = currentSession.user?.email || '—';

  await loadFilms();
  render();
}

async function loadFilms() {
  const { ok, data } = await sbFetch(`/rest/v1/universe_films?select=*&order=release_date.asc.nullslast`);
  films = (ok && Array.isArray(data)) ? data : [];
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  const page = document.getElementById('pageContent');
  page.innerHTML = `
    <a class="back-link" href="/dashboard">
      <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      My Dashboard
    </a>
    <div class="page-title">UNIVERSE OF FILMS</div>
    <div class="page-sub">${isAdmin ? 'The full slate of eligible releases — add, edit, and retire films here.' : 'The full slate of eligible releases for this season.'}</div>

    <div class="toolbar">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/><path d="M12.5 12.5L9.5 9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <input class="search-input" id="searchInput" type="text" placeholder="Search by title…" value="${escHtml(searchQuery)}" oninput="handleSearch(this.value)"/>
      </div>
      ${isAdmin
        ? `<button class="btn btn-primary btn-sm" onclick="openAddFilmModal()">
             <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M7 2v10M2 7h10" stroke="#0d0d14" stroke-width="1.5" stroke-linecap="round"/></svg>
             Add Film
           </button>`
        : `<span class="readonly-badge">
             <svg width="11" height="11" viewBox="0 0 14 14" fill="none"><rect x="2" y="6" width="10" height="6.5" rx="1" stroke="currentColor" stroke-width="1.2"/><path d="M4.5 6V4a2.5 2.5 0 0 1 5 0v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
             Read Only
           </span>`
      }
    </div>

    <div id="tableContainer"></div>
  `;
  renderTable();
}

function getVisibleFilms() {
  let list = films;
  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    list = list.filter(f => (f.title||'').toLowerCase().includes(q));
  }
  list = [...list].sort((a, b) => {
    if (sortKey === 'release_date') {
      // Missing release dates always sort last, in either direction —
      // treating them as +Infinity flips them to the front on a descending
      // sort, which reads as "no date yet" jumping ahead of dated films.
      const av = a.release_date, bv = b.release_date;
      if (!av && !bv) return 0;
      if (!av) return 1;
      if (!bv) return -1;
      const cmp = new Date(av).getTime() - new Date(bv).getTime();
      return sortDir === 'asc' ? cmp : -cmp;
    }
    const av = (a[sortKey]||'').toString().toLowerCase();
    const bv = (b[sortKey]||'').toString().toLowerCase();
    if (av < bv) return sortDir === 'asc' ? -1 : 1;
    if (av > bv) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });
  return list;
}

function sortArrow(key) {
  if (sortKey !== key) return '';
  return `<span class="sort-arrow">${sortDir === 'asc' ? '▲' : '▼'}</span>`;
}

function renderTable() {
  const container = document.getElementById('tableContainer');
  const visible = getVisibleFilms();

  if (films.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <h3>No films yet</h3>
        <p>${isAdmin ? 'Add the first film to start building out the universe.' : 'Check back once the admin has added films.'}</p>
        ${isAdmin ? `<button class="btn btn-primary" onclick="openAddFilmModal()">Add Film</button>` : ''}
      </div>
    `;
    return;
  }

  if (visible.length === 0) {
    container.innerHTML = `<div class="empty-state"><h3>No matches</h3><p>No films match "${escHtml(searchQuery)}".</p></div>`;
    return;
  }

  container.innerHTML = `
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th class="sortable col-title" onclick="handleSort('title')">Title${sortArrow('title')}</th>
              <th class="sortable" onclick="handleSort('release_date')">Release Date${sortArrow('release_date')}</th>
              <th>Studio</th>
              <th class="col-imdb">IMDb ID</th>
              <th>Eligible</th>
              <th class="col-notes">Notes</th>
              ${isAdmin ? '<th class="col-actions"></th>' : ''}
            </tr>
          </thead>
          <tbody>
            ${visible.map(f => renderRow(f)).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderRow(f) {
  if (!isAdmin) {
    return `
      <tr>
        <td class="col-title"><div class="cell-static">${escHtml(f.title)||'—'}</div></td>
        <td><div class="cell-static">${formatDate(f.release_date)}</div></td>
        <td><div class="cell-static">${escHtml(f.studio)||'—'}</div></td>
        <td class="col-imdb"><div class="cell-static">${escHtml(f.imdb_id)||'—'}</div></td>
        <td><div class="cell-static ${f.eligible?'':'muted'}">${f.eligible?'Yes':'No'}</div></td>
        <td class="col-notes"><div class="cell-static ${f.notes?'':'muted'}">${escHtml(f.notes)||'—'}</div></td>
      </tr>
    `;
  }
  return `
    <tr data-film-id="${f.id}">
      <td class="col-title"><input class="cell-input" value="${escHtml(f.title)}" placeholder="Title"
        onblur="saveField(${f.id},'title',this.value,this)" onkeydown="if(event.key==='Enter')this.blur()"/></td>
      <td><input class="cell-input" type="date" value="${f.release_date||''}"
        onchange="saveField(${f.id},'release_date',this.value||null,this)"/></td>
      <td><input class="cell-input" value="${escHtml(f.studio)||''}" placeholder="—"
        onblur="saveField(${f.id},'studio',this.value,this)" onkeydown="if(event.key==='Enter')this.blur()"/></td>
      <td class="col-imdb"><input class="cell-input" value="${escHtml(f.imdb_id)||''}" placeholder="tt…"
        onblur="saveField(${f.id},'imdb_id',this.value,this)" onkeydown="if(event.key==='Enter')this.blur()"/></td>
      <td>
        <label class="toggle" style="width:34px;height:19px">
          <input type="checkbox" ${f.eligible?'checked':''} onchange="saveField(${f.id},'eligible',this.checked,this)"/>
          <span class="toggle-slider"></span>
        </label>
      </td>
      <td class="col-notes"><input class="cell-input" value="${escHtml(f.notes)||''}" placeholder="—"
        onblur="saveField(${f.id},'notes',this.value,this)" onkeydown="if(event.key==='Enter')this.blur()"/></td>
      <td class="col-actions">
        <button class="icon-btn" title="Delete film" onclick="openDeleteModal(${f.id},'${escHtml(f.title).replace(/'/g,"\\'")}')">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2.5 3.5h9M5.5 3.5V2a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.5M11 3.5l-.6 8.1a1 1 0 0 1-1 .9H4.6a1 1 0 0 1-1-.9L3 3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </td>
    </tr>
  `;
}

function formatDate(d) {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if (isNaN(dt)) return '—';
  return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

// ── SEARCH / SORT ─────────────────────────────────────────────────────────────
function handleSearch(value) {
  searchQuery = value;
  renderTable();
}

function handleSort(key) {
  if (sortKey === key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  else { sortKey = key; sortDir = 'asc'; }
  renderTable();
}

// ── INLINE EDIT ───────────────────────────────────────────────────────────────
async function saveField(filmId, column, value, inputEl) {
  if (!isAdmin) return;
  const film = films.find(f => f.id === filmId);
  if (film && film[column] === value) return; // no change, skip the request

  const { ok } = await sbFetch(`/rest/v1/universe_films?id=eq.${filmId}`, {
    method: 'PATCH',
    headers: { 'Prefer': 'return=minimal' },
    body: JSON.stringify({ [column]: value })
  });

  if (ok) {
    if (film) film[column] = value;
    if (inputEl) {
      inputEl.parentElement.classList.remove('save-flash');
      void inputEl.parentElement.offsetWidth; // restart animation
      inputEl.parentElement.classList.add('save-flash');
    }
  } else {
    showToast('Failed to save — try again', true);
  }
}

// ── ADD FILM ──────────────────────────────────────────────────────────────────
function openAddFilmModal() {
  if (!isAdmin) return;
  document.getElementById('filmModalTitle').textContent = 'ADD FILM';
  document.getElementById('fm-title').value = '';
  document.getElementById('fm-release').value = '';
  document.getElementById('fm-studio').value = '';
  document.getElementById('fm-imdb').value = '';
  document.getElementById('fm-eligible').checked = true;
  document.getElementById('fm-notes').value = '';
  document.getElementById('filmError').classList.remove('show');
  openModal('filmModal');
}

async function handleSaveFilm() {
  const errEl = document.getElementById('filmError');
  errEl.classList.remove('show');

  const title = document.getElementById('fm-title').value.trim();
  if (!title) {
    errEl.textContent = 'Please give the film a title.';
    errEl.classList.add('show');
    return;
  }

  const payload = {
    title,
    release_date: document.getElementById('fm-release').value || null,
    studio: document.getElementById('fm-studio').value.trim() || null,
    imdb_id: document.getElementById('fm-imdb').value.trim() || null,
    eligible: document.getElementById('fm-eligible').checked,
    notes: document.getElementById('fm-notes').value.trim() || null,
  };

  setLoading('filmSaveBtn', true, 'Add Film');
  const { ok, data } = await sbFetch('/rest/v1/universe_films?select=*', {
    method: 'POST',
    headers: { 'Prefer': 'return=representation' },
    body: JSON.stringify(payload)
  });
  setLoading('filmSaveBtn', false, 'Add Film');

  if (!ok || !data?.length) {
    errEl.textContent = data?.message || 'Failed to add film. Try again.';
    errEl.classList.add('show');
    return;
  }

  films.push(data[0]);
  closeModal('filmModal');
  renderTable();
  showToast('Film added');
}

// ── DELETE ────────────────────────────────────────────────────────────────────
function openDeleteModal(filmId, title) {
  if (!isAdmin) return;
  _deleteTargetId = filmId;
  document.getElementById('deleteModalBody').textContent = `This will permanently remove "${title}". This cannot be undone.`;
  openModal('deleteModal');
}

async function handleConfirmDelete() {
  if (!_deleteTargetId) return;
  const btn = document.getElementById('deleteConfirmBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-sm"></span>Deleting…';

  const { ok } = await sbFetch(`/rest/v1/universe_films?id=eq.${_deleteTargetId}`, { method: 'DELETE' });

  btn.disabled = false;
  btn.textContent = 'Delete Permanently';
  closeModal('deleteModal');

  if (ok) {
    films = films.filter(f => f.id !== _deleteTargetId);
    renderTable();
    showToast('Film deleted');
  } else {
    showToast('Failed to delete film', true);
  }
  _deleteTargetId = null;
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function openModal(id) {
  document.getElementById(id).classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  document.body.style.overflow = '';
}
function handleOverlayClick(e, id) {
  if (e.target === document.getElementById(id)) closeModal(id);
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') ['filmModal','deleteModal'].forEach(id => closeModal(id));
});

function setLoading(btnId, loading, label) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.disabled = loading;
  btn.innerHTML = loading ? '<span class="spinner-sm"></span>Please wait…' : label;
}

function escHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg, isError) {
  let toast = document.getElementById('sef-toast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'sef-toast';
    toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a28;border:1px solid #222233;color:#e8e8f0;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;transition:opacity 0.3s;pointer-events:none';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.borderColor = isError ? '#ef4444' : '#34d399';
  toast.style.opacity = '1';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.style.opacity = '0', 2500);
}

// ── BOOT ──────────────────────────────────────────────────────────────────────
init();
</script>
</body>
