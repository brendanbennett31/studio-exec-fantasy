// ── Released tile with slot-machine digit animation on release days ───────────
function ReleasedTile({released,totalFilms,todayCount,theme}){
  const isToday=todayCount>0;
  const t=theme||{cardBg:"#111119",border:"#222233",gold:"#d4a843",textMuted:"#6a6a7e"};
  // Animate from (released - todayCount) up to released using slot digits
  const startVal=isToday?released-todayCount:released;
  const[display,setDisplay]=useState(startVal);
  const rafRef=useRef(null);
  const startRef=useRef(null);
  const duration=1400;

  useEffect(()=>{
    if(!isToday){setDisplay(released);return;}
    setDisplay(startVal);
    startRef.current=null;
    // Step in integer increments so SlotDigit triggers on each whole number
    function step(ts){
      if(!startRef.current)startRef.current=ts;
      const t=Math.min((ts-startRef.current)/duration,1);
      const eased=1-Math.pow(1-t,3);
      setDisplay(Math.round(startVal+(released-startVal)*eased));
      if(t<1)rafRef.current=requestAnimationFrame(step);
    }
    const delay=setTimeout(()=>{rafRef.current=requestAnimationFrame(step);},500);
    return()=>{clearTimeout(delay);cancelAnimationFrame(rafRef.current);};
  },[released,todayCount]);

  // Format as "X/Y" and render each character through SlotDigit when today
  const str=`${display}/${totalFilms}`;

  return(
    <div style={{background:t.cardBg,border:`1px solid ${isToday?"#d4a843":t.border}`,borderRadius:8,padding:"12px 6px",textAlign:"center",position:"relative",overflow:"hidden",animation:isToday?"releaseGlow 2.5s ease-in-out infinite":undefined}}>
      {isToday&&<Sparkler particleCount={10} intervalMs={3200}/>}
      <div style={{fontFamily:"monospace",fontSize:"clamp(0.85rem,2.8vw,1.15rem)",color:t.gold,fontWeight:700,position:"relative",zIndex:1,display:"flex",justifyContent:"center",alignItems:"baseline",lineHeight:1.2}}>
        {isToday
          ? str.split('').map((ch,i)=>
              /[0-9]/.test(ch)
                ? <SlotDigit key={i} digit={ch} delay={i*60}/>
                : <span key={i}>{ch}</span>
            )
          : str
        }
      </div>
      <div style={{fontSize:9,color:t.textMuted,textTransform:"uppercase",letterSpacing:"0.1em",marginTop:3,position:"relative",zIndex:1}}>Released</div>
    </div>
  );
}

// ─── SLOT MACHINE TICKER ─────────────────────────────────────────────────────
// Each digit slides up from below into position like a slot machine reel
function SlotDigit({digit, delay=0}){
  const[key,setKey]=useState(0);
  const[prev,setPrev]=useState(digit);
  const[curr,setCurr]=useState(digit);
  useEffect(()=>{
    if(digit!==prev){
      setPrev(curr);
      setCurr(digit);
      setKey(k=>k+1);
    }
  },[digit]);
  return(
    <span style={{display:'inline-block',position:'relative',overflow:'hidden',lineHeight:'inherit',verticalAlign:'bottom'}}>
      {/* Outgoing digit slides up and out */}
      {key>0&&<span key={`out-${key}`} style={{
        position:'absolute',top:0,left:0,right:0,textAlign:'center',
        animation:`slotOut 0.32s ease-in ${delay}ms forwards`,
        pointerEvents:'none',
      }}>{prev}</span>}
      {/* Incoming digit slides up from below */}
      <span key={`in-${key}`} style={{
        display:'block',textAlign:'center',
        animation:key>0?`slotUp 0.42s cubic-bezier(0.22,1,0.36,1) ${delay}ms both`:undefined,
      }}>{curr}</span>
    </span>
  );
}

function TickerNumber({value, duration=1800, formatter=v=>v}){
  const[display,setDisplay]=useState(value*0.90);
  const startRef=useRef(null);
  const rafRef=useRef(null);
  useEffect(()=>{
    const target=typeof value==='number'?value:0;
    const startVal=target*0.90;
    setDisplay(startVal);
    startRef.current=null;
    function step(ts){
      if(!startRef.current)startRef.current=ts;
      const elapsed=ts-startRef.current;
      const t=Math.min(elapsed/duration,1);
      const eased=Math.log(1+t*9)/Math.log(10);
      setDisplay(startVal+(target-startVal)*eased);
      if(t<1)rafRef.current=requestAnimationFrame(step);
    }
    rafRef.current=requestAnimationFrame(step);
    return()=>cancelAnimationFrame(rafRef.current);
  },[value,duration]);

  // Format the value then split into individual characters for per-char slot animation.
  // Key digits from the RIGHT so that when string length changes (e.g. $22M → $143M),
  // each digit position is stable and doesn't animate incorrectly across incompatible values.
  const formatted=formatter(display);
  const str=String(formatted);
  const chars=str.split('');
  const total=chars.length;

  return(
    <span style={{display:'inline-flex',alignItems:'baseline',letterSpacing:'inherit'}}>
      {chars.map((ch,i)=>{
        if(/[0-9]/.test(ch)){
          // Key from the right — rightmost digit is always key "r0", next is "r1" etc.
          const rightKey=`r${total-1-i}`;
          return <SlotDigit key={rightKey} digit={ch} delay={(total-1-i)*18}/>;
        }
        return <span key={`s${i}`}>{ch}</span>;
      })}
    </span>
  );
}

// ─── STANDINGS with BO/POI toggle + inline slate dropdowns ──────────────────
// Stores previous day's ranks in localStorage to detect position changes.
// BO and ROI are separate rankings (grand total vs. POI%), so each gets its
// own pair of storage keys -- a BO rank change and a ROI rank change are
// unrelated events and need independent 24h windows.
const RANK_KEYS_BO={stable:'sef_ranks_stable',prev:'sef_ranks_prev'};
const RANK_KEYS_POI={stable:'sef_ranks_stable_poi',prev:'sef_ranks_prev_poi'};
const RANK_WINDOW_MS=24*60*60*1000; // 24 hours
// Bump this whenever a change to how standings/totals (or this tracking
// logic itself) could make an old browser's cached snapshot incompatible or
// stuck in a bad state (e.g. the 2026-08-01 box-office-centralization
// migration, which rewrote every league's underlying totals at once and
// made every stored snapshot look like a full-board reshuffle happened,
// even though nothing "moved" day-over-day in the sense this feature is
// meant to track). A version mismatch is treated the same as no snapshot at
// all -- silently re-baseline, no badges, no animation.
const RANK_SCHEMA_VERSION=3;

// Pure read — computes changes from localStorage, no side effects.
// rankField is "rank" for Box Office or "poiRank" for ROI; keys picks which
// pair of storage keys (RANK_KEYS_BO/RANK_KEYS_POI) to read.
function getRankChanges(ranked,rankField,keys){
  const current={};
  ranked.forEach(e=>{current[e.name]=e[rankField];});
  let stable=null,prev=null;
  try{
    const s=localStorage.getItem(keys.stable);
    const p=localStorage.getItem(keys.prev);
    if(s) stable=JSON.parse(s);
    if(p) prev=JSON.parse(p);
  }catch(e){}
  if(stable&&stable.v!==RANK_SCHEMA_VERSION) stable=null;
  if(prev&&prev.v!==RANK_SCHEMA_VERSION) prev=null;
  if(!stable) return {};
  const stableRanks=stable.ranks||{};
  const hasChanged=ranked.some(e=>stableRanks[e.name]!==undefined&&stableRanks[e.name]!==e[rankField]);
  const withinWindow=Date.now()-(stable.timestamp||0)<RANK_WINDOW_MS;
  if(!hasChanged&&!withinWindow) return {};
  const refRanks=hasChanged?stableRanks:(prev&&prev.ranks)||stableRanks;
  const changes={};
  ranked.forEach(e=>{
    if(refRanks[e.name]!==undefined&&refRanks[e.name]!==e[rankField]){
      changes[e.name]=refRanks[e.name]-e[rankField];
    }
  });
  console.log("[ranks] changes detected:",JSON.stringify(changes),"hasChanged:",hasChanged,"withinWindow:",withinWindow);
  return changes;
}

// Write only — commits current ranks to localStorage (call once per session after live data)
function commitRankStorage(ranked,rankField,keys){
  const current={};
  ranked.forEach(e=>{current[e.name]=e[rankField];});
  let stable=null;
  try{const s=localStorage.getItem(keys.stable);if(s)stable=JSON.parse(s);}catch(e){}
  if(stable&&stable.v!==RANK_SCHEMA_VERSION) stable=null;
  if(!stable){
    // First ever load (or an old-schema snapshot we're discarding) —
    // initialize with old timestamp so no animation on first visit
    try{localStorage.setItem(keys.stable,JSON.stringify({ranks:current,timestamp:Date.now()-RANK_WINDOW_MS-1,v:RANK_SCHEMA_VERSION}));}catch(e){}
    console.log("[ranks] initialized stable storage");
    return;
  }
  const stableRanks=stable.ranks||{};
  const hasChanged=ranked.some(e=>stableRanks[e.name]!==undefined&&stableRanks[e.name]!==e[rankField]);
  if(hasChanged){
    try{
      localStorage.setItem(keys.prev,JSON.stringify({ranks:stableRanks,v:RANK_SCHEMA_VERSION}));
      localStorage.setItem(keys.stable,JSON.stringify({ranks:current,timestamp:Date.now(),v:RANK_SCHEMA_VERSION}));
    }catch(e){}
    console.log("[ranks] committed new stable — ranks changed:",JSON.stringify(stableRanks),"→",JSON.stringify(current));
  }
}

// Shared FLIP-style reorder animation for both standings views (BO and
// ROI). Handles: computing+committing rank changes once real data is in,
// and sliding each card from its old position to its new one when a
// change is detected.
//
// History: this used to live duplicated/inline in StandingsBO only, with a
// useEffect with an empty [] dependency array that ran once at mount --
// before real rankChanges had ever been computed (that happens in a
// SEPARATE effect gated on liveStatus, after the async data fetch
// resolves). So it always saw hasAnyChange=false, set its "already played"
// ref, and never ran again -- the slide animation silently never fired
// after the very first sessions where the timing happened to line up.
// This version reacts to rankChanges actually changing instead of running
// once blindly.
//
// The "before" phase render (oldOrder, no transform) happens inside a
// useLayoutEffect specifically so it lands in the SAME commit as the state
// update that revealed the change -- otherwise the browser would paint one
// frame of the final reshuffled order, then jump back to the old order to
// start the slide, which is exactly the jump/flicker this used to have.
function useRankFlipAnimation(ranked,liveStatus,rankField,keys){
  const[rankChanges,setRankChanges]=useState({});
  const committedRef=useRef(false);
  useEffect(()=>{
    if(committedRef.current||liveStatus==="loading"||ranked.length===0) return;
    committedRef.current=true;
    setRankChanges(getRankChanges(ranked,rankField,keys));
    commitRankStorage(ranked,rankField,keys);
  },[liveStatus,ranked,rankField,keys]);

  const hasAnyChange=Object.keys(rankChanges).length>0;
  const sig=hasAnyChange?JSON.stringify(rankChanges):null;

  const[phase,setPhase]=useState("done"); // "before" | "animate" | "done"
  const cardRefs=useRef({});
  const deltaRef=useRef({});
  const animatedSigRef=useRef(null);

  // Old order: undo each exec's known rank delta to get where it sat
  // before the change, so cards can start there and slide into today's spot.
  // rankChanges[name] = oldRank - newRank (positive = rose), so
  // oldRank = newRank + rankChanges[name] -- this used to subtract instead
  // of add, which for a simple two-team swap produces the exact same order
  // as the final ranking (the sign flip cancels itself out for a swap),
  // so there was nothing left to visibly animate even though phase still
  // transitioned and the arrow badges (driven by rankChanges directly, not
  // this) showed correctly. That's why the swap-two-teams test showed
  // arrows but no slide.
  const oldOrder=useMemo(()=>[...ranked].sort((a,b)=>{
    const oa=a[rankField]+(rankChanges[a.name]||0);
    const ob=b[rankField]+(rankChanges[b.name]||0);
    return oa-ob;
  }),[ranked,rankChanges,rankField]);

  useLayoutEffect(()=>{
    if(!sig||animatedSigRef.current===sig) return;
    animatedSigRef.current=sig;
    setPhase("before");
  },[sig]);

  useEffect(()=>{
    if(phase!=="before") return;
    const raf=requestAnimationFrame(()=>{
      const tops={};
      Object.entries(cardRefs.current).forEach(([name,el])=>{
        if(el) tops[name]=el.getBoundingClientRect().top;
      });
      // Cards are currently laid out in oldOrder (no transform yet), so the
      // slot for this exec's NEW rank is simply oldOrder[rank-1]'s current
      // position -- the delta is just that slot's top minus this card's own.
      const deltas={};
      ranked.forEach(exec=>{
        const slotExec=oldOrder[exec[rankField]-1];
        const targetTop=slotExec?tops[slotExec.name]:undefined;
        const myTop=tops[exec.name];
        deltas[exec.name]=(targetTop!=null&&myTop!=null)?targetTop-myTop:0;
      });
      deltaRef.current=deltas;
      setPhase("animate");
    });
    return()=>cancelAnimationFrame(raf);
  },[phase,ranked,oldOrder,rankField]);

  useEffect(()=>{
    if(phase!=="animate") return;
    const t=setTimeout(()=>setPhase("done"),720);
    return()=>clearTimeout(t);
  },[phase]);

  const isAnimating=phase==="before"||phase==="animate";
  return {displayOrder:isAnimating?oldOrder:ranked,phase,rankChanges,cardRefs,deltaRef};
}
function StandingsTab({data,studioNames,expandedExecs,setExpandedExecs,liveStatus,myTeam}){
  const[mode,setMode]=useState("bo");
  function toggleExec(name){
    setExpandedExecs(prev=>{const next=new Set(prev);next.has(name)?next.delete(name):next.add(name);return next;});
  }
  const ranked=data.ranked;
  return(
    <div>
      <div style={{display:"flex",gap:6,marginBottom:12,alignItems:"center"}}>
        {[["bo","Box Office"],["roi","ROI Rankings"]].map(([k,l])=>(
          <button key={k} onClick={()=>setMode(k)} style={{fontSize:11,padding:"6px 14px",borderRadius:6,border:`1px solid ${mode===k?"#d4a843":"#222233"}`,background:mode===k?"#d4a84318":"#111119",color:mode===k?"#d4a843":"#6a6a7e",cursor:"pointer",fontWeight:700}}>{l}</button>
        ))}
      </div>
      {mode==="bo"
        ?<StandingsBO data={data} studioNames={studioNames} expandedExecs={expandedExecs} toggleExec={toggleExec} liveStatus={liveStatus} myTeam={myTeam}/>
        :<StandingsPOI data={data} studioNames={studioNames} expandedExecs={expandedExecs} toggleExec={toggleExec} liveStatus={liveStatus} myTeam={myTeam}/>
      }
    </div>
  );
}

function SlateDrawer({exec,studioNames,myTeam}){
  const[sortMode,setSortMode]=useState("release");
  const[confirmingId,setConfirmingId]=useState(null);
  const[refunding,setRefunding]=useState(false);
  const[refundMsg,setRefundMsg]=useState(null);
  const[refundHistory,setRefundHistory]=useState([]);
  const films=[...exec.films].sort((a,b)=>sortMode==="bid"?b.bid-a.bid:(!a.release?1:!b.release?-1:new Date(a.release)-new Date(b.release)));
  const rem=getTeamRemainder(exec.name);
  // Refund action only makes sense on your own slate; refund HISTORY is
  // shown to everyone (rules say refunds "must be publicly declared"),
  // both gated on the league having opted into Acquisitions (LEAGUE_CONTEXT
  // read directly rather than threaded as a prop, matching how
  // EXEC_COLORS/DISPLAY are already read in nested components elsewhere).
  const acqOn = !!LEAGUE_CONTEXT?.acquisitions_enabled;
  const isMine = !!myTeam && myTeam===exec.name && acqOn;
  const gridCols = isMine ? "1fr 50px 50px 80px 26px" : "1fr 50px 50px 80px";

  // Refunded picks are deleted from league_picks (so the film is
  // immediately available for someone else to acquire), so history for
  // display comes from the refunds audit table instead.
  useEffect(()=>{
    if(!acqOn) return;
    supabaseFetch("refunds",`league_id=eq.${LEAGUE_UUID}&team_name=eq.${encodeURIComponent(exec.name)}&order=refunded_at.desc`)
      .then(rows=>setRefundHistory(rows||[]))
      .catch(()=>{});
  },[acqOn,exec.name]);

  // Server-side (refund_my_film) is the real enforcement -- this client
  // check is just for a responsive-feeling UI. Deliberately not checking
  // the Wednesday-if-declared rule here (would need this drawer to fetch
  // the current week/declaration independently); the RPC's error message
  // surfaces that case clearly if it applies.
  async function confirmRefund(f){
    setRefunding(true);
    const session=getSession();
    const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/refund_my_film`,{
      method:"POST",
      headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${session?.access_token||SUPABASE_ANON_KEY}`,"Content-Type":"application/json"},
      body:JSON.stringify({p_league_id:LEAGUE_UUID,p_league_pick_id:f.id})
    });
    const data=await res.json().catch(()=>({}));
    setRefunding(false);
    if(res.ok){
      window.location.reload(); // simplest way to reflect the removed pick + credited budget everywhere
    } else {
      setRefundMsg(data.message||"Refund failed");
      setConfirmingId(null);
    }
  }

  return(
    <div style={{background:"#0a0a12",border:"1px solid #222233",borderTop:"none",borderRadius:"0 0 10px 10px",marginBottom:6}}>
      <div style={{display:"flex",gap:8,padding:"8px 14px",borderBottom:"1px solid #1a1a28",alignItems:"center"}}>
        <span style={{fontSize:10,color:"#6a6a7e",textTransform:"uppercase",letterSpacing:"0.08em"}}>Sort:</span>
        {[["release","Date"],["bid","Price"]].map(([k,l])=>(<button key={k} onClick={()=>setSortMode(k)} style={{fontSize:10,padding:"3px 8px",borderRadius:4,border:`1px solid ${sortMode===k?"#d4a843":"#2a2a3a"}`,background:sortMode===k?"#d4a84320":"transparent",color:sortMode===k?"#d4a843":"#6a6a7e",cursor:"pointer",fontWeight:600}}>{l}</button>))}
      </div>
      {refundMsg&&<div style={{padding:"6px 14px",fontSize:11,color:"#ef4444"}}>{refundMsg}</div>}
      <div style={{display:"grid",gridTemplateColumns:gridCols,gap:4,padding:"6px 14px",fontSize:9,color:"#6a6a7e",textTransform:"uppercase",letterSpacing:"0.08em",borderBottom:"1px solid #1a1a28"}}><div>Film</div><div style={{textAlign:"right"}}>Bid</div><div style={{textAlign:"center"}}>Date</div><div style={{textAlign:"right"}}>Dom. BO</div>{isMine&&<div/>}</div>
      {films.map((f,i)=>{
        const roi=f.bo>0?((f.bo/(f.bid*1e6))*100).toFixed(0):null;
        const rd=f.release?parseReleaseDate(f.release):null;
        const rs=rd?`${rd.getMonth()+1}/${rd.getDate()}`:"—";
        const daysToRelease=f.release?Math.ceil((parseReleaseDate(f.release)-new Date())/864e5):null;
        const refundBlockedReason = !f.imdb_id ? "A blind Festival Futures pick can't be refunded until it resolves to a real film"
          : f.voided ? "Voided picks can't be refunded"
          : (daysToRelease!==null&&daysToRelease<0) ? "This film has already released"
          : (daysToRelease!==null&&daysToRelease<14) ? "Must be refunded at least 14 days before release"
          : null;
        const refundable=isMine&&!refundBlockedReason;
        return(
          <div key={i} style={{display:"grid",gridTemplateColumns:gridCols,gap:4,padding:"7px 14px",fontSize:12,alignItems:"center",borderBottom:"1px solid #0e0e16",background:f.voided?"rgba(239,68,68,0.04)":isReleaseDay(f.release)?"rgba(212,168,67,0.04)":"transparent",opacity:f.locked?0.65:f.voided?0.75:1}}>
            <div style={{minWidth:0}}>
              <ReleaseDayBadge releaseDate={f.release}>
                {bomUrl(f.title)
                  ? <a href={bomUrl(f.title)} target="_blank" rel="noopener noreferrer" style={{fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",display:"block",color:f.voided?"#ef4444":f.locked?"#6a6a7e":"inherit",textDecoration:f.voided?"line-through":"none"}}
                      onMouseEnter={e=>e.currentTarget.style.color="#d4a843"}
                      onMouseLeave={e=>e.currentTarget.style.color=f.voided?"#ef4444":f.locked?"#6a6a7e":"inherit"}>
                      {f.locked&&<span style={{marginRight:4,display:"inline-flex",alignItems:"center"}}><svg width="10" height="10" viewBox="0 0 12 12" fill="none"><rect x="2" y="5.5" width="8" height="5.5" rx="1" stroke="#6a6a7e" strokeWidth="1.2"/><path d="M4 5.5V4a2 2 0 0 1 4 0v1.5" stroke="#6a6a7e" strokeWidth="1.2" strokeLinecap="round"/></svg></span>}{f.title} <span style={{fontSize:9,opacity:0.4,letterSpacing:0}}>↗</span>
                    </a>
                  : <span style={{fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",display:"block",color:f.voided?"#ef4444":f.locked?"#6a6a7e":"inherit",textDecoration:f.voided?"line-through":"none"}}>{f.locked&&<span style={{marginRight:4,display:'inline-flex',alignItems:'center'}}><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="2" y="5.5" width="8" height="5.5" rx="1" stroke="currentColor" strokeWidth="1.2"/><path d="M4 5.5V4a2 2 0 0 1 4 0v1.5" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg></span>}{f.title}</span>
                }
              </ReleaseDayBadge>
              <span style={{display:"inline-flex",gap:4,marginTop:2}}>
                {f.voided
                  ? <span style={{fontSize:8,background:"rgba(239,68,68,0.12)",color:"#ef4444",padding:"1px 5px",borderRadius:3}}>0% ROI</span>
                  : f.locked
                    ? <span style={{fontSize:8,background:"rgba(100,100,120,0.15)",color:"#6a6a7e",padding:"1px 5px",borderRadius:3}}>Final</span>
                    : f.status==="released"&&<span style={{fontSize:8,background:"rgba(52,211,153,0.12)",color:"#34d399",padding:"1px 5px",borderRadius:3}}>✓</span>
                }
                {!f.voided&&<CountdownBadge release={f.release} status={f.status}/>}
                {f.status==="tba"&&!f.voided&&<span style={{fontSize:8,background:"rgba(100,100,120,0.12)",color:"#6a6a7e",padding:"1px 5px",borderRadius:3}}>TBA</span>}
                {roi&&<span style={{fontSize:9,color:Number(roi)>=100?"#34d399":"#f87171",fontFamily:"monospace"}}>{roi}%</span>}
              </span>
            </div>
            <div style={{fontFamily:"monospace",fontSize:11,color:"#6a6a7e",textAlign:"right"}}>${f.bid}M</div>
            <div style={{fontFamily:"monospace",fontSize:10,color:"#4a4a5e",textAlign:"center"}}>{rs}</div>
            <div style={{fontFamily:"monospace",fontSize:11,color:f.bo>0?"#34d399":"#3a3a4e",textAlign:"right"}}>{f.bo>0?fmt(f.bo):"—"}</div>
            {isMine&&(
              <div style={{textAlign:"center"}}>
                {confirmingId===f.id ? (
                  <div style={{display:"flex",gap:4,justifyContent:"center"}}>
                    <button onClick={()=>confirmRefund(f)} disabled={refunding} title={`Confirm: refund for 25% of $${f.bid}M`} style={{background:"rgba(52,211,153,0.1)",border:"1px solid rgba(52,211,153,0.3)",borderRadius:4,color:"#34d399",cursor:"pointer",fontSize:14,lineHeight:1,padding:"3px 5px"}}>✓</button>
                    <button onClick={()=>setConfirmingId(null)} title="Cancel" style={{background:"rgba(106,106,126,0.1)",border:"1px solid #2a2a3a",borderRadius:4,color:"#6a6a7e",cursor:"pointer",fontSize:14,lineHeight:1,padding:"3px 5px"}}>✕</button>
                  </div>
                ) : (
                  <button onClick={()=>{if(refundable){setConfirmingId(f.id);setRefundMsg(null);}}} disabled={!refundable}
                    title={refundable?"Refund this film for 25% of its bid — cannot be undone":refundBlockedReason}
                    style={{background:refundable?"rgba(106,106,126,0.1)":"transparent",border:`1px solid ${refundable?"#3a3a4e":"transparent"}`,borderRadius:4,color:refundable?"#9a9aae":"#3a3a4e",cursor:refundable?"pointer":"not-allowed",fontSize:15,lineHeight:1,padding:"3px 6px"}}>↺</button>
                )}
              </div>
            )}
          </div>
        );
      })}
      {refundHistory.length>0&&refundHistory.map(r=>(
        <div key={r.id} style={{display:"grid",gridTemplateColumns:gridCols,gap:4,padding:"7px 14px",fontSize:12,alignItems:"center",borderBottom:"1px solid #0e0e16",background:"rgba(251,191,36,0.05)"}}>
          <div style={{minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"#fbbf24",textDecoration:"line-through",fontWeight:600}} title={`Refunded ${new Date(r.refunded_at).toLocaleDateString()} for $${r.credit_amount}M (${Math.round(r.refund_rate_applied*100)}% of $${r.original_bid}M)`}>
            {r.film_title}
          </div>
          <div style={{fontFamily:"monospace",fontSize:11,color:"#fbbf24",textAlign:"right"}}>+${r.credit_amount}M</div>
          <div style={{fontFamily:"monospace",fontSize:9,color:"#8a6a3e",textAlign:"center",textTransform:"uppercase"}}>Refunded</div>
          <div style={{fontFamily:"monospace",fontSize:11,color:"#3a3a4e",textAlign:"right"}}>—</div>{isMine&&<div/>}
        </div>
      ))}
      {rem&&rem.remaining>0&&(<div style={{display:"grid",gridTemplateColumns:gridCols,gap:4,padding:"7px 14px",fontSize:12,borderTop:"1px solid #1a1a28"}}>
        <div style={{color:"#6a6a7e",fontStyle:"italic"}} title={LEAGUE_CONTEXT?.acquisitions_enabled&&rem.remainderCredit!=null?`$${rem.budgetDefault}M base + $${rem.remainderCredit}M converted from draft leftover${rem.refundCredits?` + $${rem.refundCredits}M from refunds`:""} − $${rem.spent}M spent`:undefined}>
          {LEAGUE_CONTEXT?.acquisitions_enabled?"Acquisitions Budget":"Unspent Budget"}
        </div>
        <div style={{fontFamily:"monospace",fontSize:11,color:"#6a6a7e",textAlign:"right"}}>${rem.remaining}M</div><div/><div style={{fontFamily:"monospace",fontSize:11,color:"#3a3a4e",textAlign:"right"}}>—</div>{isMine&&<div/>}
      </div>)}
    </div>
  );
}

function StandingsBO({data,studioNames,expandedExecs,toggleExec,liveStatus,myTeam}){
  const{ranked}=data;
  const maxGT=Math.max(...ranked.map(e=>e.grandTotal));
  const[myCardFlash,setMyCardFlash]=useState(false);

  // Flash the current user's card once data is ready (no scroll)
  useEffect(()=>{
    if(!myTeam||!ranked.length) return;
    const timer=setTimeout(()=>{
      setMyCardFlash(true);
      setTimeout(()=>setMyCardFlash(false),1800);
    },600);
    return()=>clearTimeout(timer);
  },[myTeam,ranked.length]);

  const{displayOrder,phase,rankChanges,cardRefs,deltaRef}=useRankFlipAnimation(ranked,liveStatus,"rank",RANK_KEYS_BO);
  const isAnimating=phase!=="done";

  return(
    <div>
      <div>
        {displayOrder.map(exec=>{
          const isOpen=phase==="done"&&expandedExecs&&expandedExecs.has(exec.name);
          const change=rankChanges[exec.name]||0;
          const hasChange=change!==0;
          const rose=change>0;
          const dy=phase==="animate"?(deltaRef.current[exec.name]||0):0;

          const isMyCard=myTeam&&exec.name===myTeam;
          const borderColor=myCardFlash&&isMyCard
            ?"rgba(245,200,66,0.8)"
            :hasChange
            ?(rose?"rgba(52,211,153,0.5)":"rgba(248,113,113,0.4)")
            :(exec.rank===1?"rgba(212,168,67,0.35)":isMyCard?"rgba(245,200,66,0.25)":"#222233");

          return(
            <div
              key={exec.name}
              ref={el=>cardRefs.current[exec.name]=el}
              style={{
                marginBottom:6,
                position:"relative",
                zIndex:rose&&isAnimating?10:1,
                transform:phase==="animate"?`translateY(${dy}px)`:"none",
                transition:phase==="animate"?"transform 0.72s ease-in-out":"none",
                willChange:phase==="animate"?"transform":"auto",
              }}
            >
              <div
                onClick={()=>phase==="done"&&toggleExec(exec.name)}
                style={{
                  display:"grid",
                  gridTemplateColumns:"52px 1fr auto auto",
                  gap:12,alignItems:"center",
                  padding:"14px 16px",
                  background:"#111119",
                  border:`1px solid ${borderColor}`,
                  borderRadius:isOpen?"10px 10px 0 0":10,
                  borderLeft:`3px solid ${exec.rank<=3?["#d4a843","#9ca3af","#cd7f32"][exec.rank-1]:"#222233"}`,
                  cursor:phase==="done"?"pointer":"default",
                  userSelect:"none",
                }}
              >
                <div style={{textAlign:"center",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                  <div style={{fontSize:28,fontWeight:900,color:exec.rank===1?"#d4a843":"#4a4a5e",lineHeight:1}}>
                    {exec.rank}
                  </div>
                  {hasChange&&(
                    <div style={{
                      fontSize:9,fontWeight:700,fontFamily:"monospace",
                      color:rose?"#34d399":"#f87171",
                      background:rose?"rgba(52,211,153,0.12)":"rgba(248,113,113,0.12)",
                      border:`1px solid ${rose?"rgba(52,211,153,0.35)":"rgba(248,113,113,0.35)"}`,
                      borderRadius:4,padding:"1px 5px",
                      display:"flex",alignItems:"center",gap:2,lineHeight:1.4,
                    }}>
                      {rose?"▲":"▼"}{Math.abs(change)}
                    </div>
                  )}
                </div>
                <div style={{minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"nowrap",minWidth:0}}>
                    <div style={{width:10,height:10,borderRadius:"50%",background:EXEC_COLORS[exec.name],flexShrink:0}}/>
                    <span style={{fontWeight:800,fontSize:16,flexShrink:0}}>{PLAYER_NAMES[exec.name]}</span>
                    {myTeam&&exec.name===myTeam&&<span style={{fontSize:9,fontWeight:700,letterSpacing:"0.1em",padding:"2px 6px",borderRadius:4,background:"rgba(245,200,66,0.12)",color:"#d4a843",border:"1px solid rgba(245,200,66,0.3)"}}>YOU</span>}
                    <span style={{fontSize:11,color:"#6a6a7e",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",minWidth:0}}>{IS_LEGACY?studioNames[exec.name]:DISPLAY[exec.name]}</span>
                    <span style={{fontSize:10,color:"#4a4a5e",fontFamily:"monospace",flexShrink:0,whiteSpace:"nowrap"}}>· {exec.filmCount}</span>
                  </div>
                  <div style={{display:"flex",gap:12,marginTop:5,fontSize:11,color:"#6a6a7e",fontFamily:"monospace",flexWrap:"wrap"}}>
                    {(()=>{
                      const spent=exec.films.filter(f=>f.status==="released"||f.bo>0||f.voided).reduce((s,f)=>s+f.bid,0);
                      const pending=exec.films.filter(f=>f.status!=="released"&&f.bo===0&&!f.voided).reduce((s,f)=>s+f.bid,0);
                      return(<>
                        <span>Spent: <span style={{color:"#34d399"}}>${spent}M</span></span>
                        <span>Pending: <span style={{color:"#f87171"}}>${pending}M</span></span>
                        <span>Total: <span style={{color:"#60a5fa"}}>${exec.totalSpent}M</span></span>
                        {exec.remaining>0&&<span>Remainder: <span style={{color:"#d4a843"}}>${exec.remaining}M</span></span>}
                      </>);
                    })()}
                  </div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontFamily:"monospace",fontSize:18,fontWeight:700}}>
                    <TickerNumber value={exec.grandTotal} formatter={v=>fmt(Math.round(v))}/>
                  </div>
                  <div style={{fontSize:9,color:"#6a6a7e",textTransform:"uppercase",letterSpacing:"0.1em"}}>Total</div>
                </div>
                <div style={{color:"#6a6a7e",fontSize:12,flexShrink:0,width:20,textAlign:"center"}}>{isOpen?"▲":"▼"}</div>
              </div>
              {isOpen&&<SlateDrawer exec={exec} studioNames={studioNames} myTeam={myTeam}/>}
            </div>
          );
        })}
      </div>
      <div style={{background:"#111119",border:"1px solid #222233",borderRadius:10,padding:20,marginTop:16}}>
        <div style={{fontSize:12,fontWeight:700,color:"#6a6a7e",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:16}}>Grand Total Breakdown</div>
        {ranked.map(exec=>{const boPct=maxGT>0?(exec.totalBO/maxGT)*100:0;const budPct=maxGT>0?((exec.remaining*1e6)/maxGT)*100:0;return(
          <div key={exec.name} style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <div style={{width:55,fontSize:12,fontWeight:700,color:EXEC_COLORS[exec.name],textAlign:"right"}}>{PLAYER_NAMES[exec.name]}</div>
            <div style={{flex:1,position:"relative",height:26,background:"#1a1a28",borderRadius:4,overflow:"hidden"}}>
              <div style={{position:"absolute",left:0,top:0,bottom:0,width:boPct+"%",background:EXEC_COLORS[exec.name],opacity:0.7,borderRadius:"4px 0 0 4px"}}/>
              <div style={{position:"absolute",left:boPct+"%",top:0,bottom:0,width:budPct+"%",background:EXEC_COLORS[exec.name],opacity:0.25}}/>
              <div style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",fontFamily:"monospace",fontSize:10}}>{fmt(exec.grandTotal)}</div>
            </div>
          </div>)})}
        <div style={{display:"flex",gap:14,justifyContent:"center",marginTop:10,fontSize:10,color:"#6a6a7e"}}><span><span style={{display:"inline-block",width:12,height:8,background:"#888",opacity:0.7,borderRadius:2,marginRight:4}}/>Box Office</span><span><span style={{display:"inline-block",width:12,height:8,background:"#888",opacity:0.25,borderRadius:2,marginRight:4}}/>Remaining Budget</span></div>
      </div>
    </div>
  );
}

              <div style={{display:"flex",gap:12,marginTop:5,fontSize:11,color:"#6a6a7e",fontFamily:"monospace",flexWrap:"wrap"}}>

                  const pending=exec.films.filter(f=>f.status!=="released"&&f.bo===0&&!f.voided).reduce((s,f)=>s+f.bid,0);

                    <span>Pending: <span style={{color:"#f87171"}}>${pending}M</span></span>
                    <span>Total: <span style={{color:"#60a5fa"}}>${exec.totalSpent}M</span></span>
                    {exec.remaining>0&&<span>Remainder: <span style={{color:"#d4a843"}}>${exec.remaining}M</span></span>}
                  </>);
                })()}
              </div>
            </div>
            <div style={{textAlign:"right"}}><div style={{fontFamily:"monospace",fontSize:18,fontWeight:700,color:exec.poi>=100?"#34d399":exec.poi>0?"#f87171":"#4a4a5e"}}>{exec.poi>0?<><TickerNumber value={exec.poi} formatter={v=>Math.round(v)}/>%</>:"0%"}</div><div style={{fontSize:9,color:"#6a6a7e",textTransform:"uppercase",letterSpacing:"0.1em"}}>ROI</div></div>
            <div style={{color:"#6a6a7e",fontSize:12,flexShrink:0,width:20,textAlign:"center"}}>{isOpen?"▲":"▼"}</div>

        );
      })}
      <div style={{background:"#111119",border:"1px solid #222233",borderRadius:10,padding:16,marginTop:12,fontSize:12,color:"#6a6a7e"}}>
        <strong style={{color:"#9a9ab0"}}>How POI works:</strong> Total domestic box office ÷ total auction spend across your entire slate. Matches the % Return on Investment chart in Trends. 100% means you've earned back exactly what you spent. Above 100% = profit territory.
      </div>
    </div>
  );
}

// ─── SLATES ──────────────────
function Slates({data,studioNames,expandedExecs,setExpandedExecs}){
  const[sortMode,setSortMode]=useState({});
  function toggle(name){
    setExpandedExecs(prev=>{
      const next=new Set(prev);
      next.has(name)?next.delete(name):next.add(name);
      return next;
    });
  }
  return(<div>{data.ranked.map(exec=>{
    const isOpen=expandedExecs.has(exec.name);const mode=sortMode[exec.name]||"release";
    const films=[...exec.films].sort((a,b)=>mode==="bid"?b.bid-a.bid:mode==="release"?(!a.release?1:!b.release?-1:new Date(a.release)-new Date(b.release)):0);
    const rem=getTeamRemainder(exec.name);
    return(<div key={exec.name} style={{marginBottom:6}}>
      <button onClick={()=>toggle(exec.name)} style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,padding:"12px 14px",background:"#111119",border:"1px solid #222233",borderRadius:isOpen?"10px 10px 0 0":10,cursor:"pointer",color:"#e8e8f0",textAlign:"left"}}>
        <div style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",gap:3}}>
          <div style={{display:"flex",alignItems:"center",gap:8,minWidth:0}}>
            <div style={{width:10,height:10,borderRadius:"50%",background:EXEC_COLORS[exec.name],flexShrink:0}}/>
            <span style={{fontWeight:800,fontSize:14,flexShrink:0}}>{DISPLAY[exec.name]}</span>
            <span style={{fontSize:11,color:"#6a6a7e",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",minWidth:0}}>{studioNames[exec.name]}</span>
          </div>
          <div style={{fontFamily:"monospace",fontSize:11,color:"#6a6a7e"}}>${exec.totalSpent}M spent &bull; ${exec.remaining}M left</div>
        </div>
        <div style={{fontSize:14,color:"#6a6a7e",flexShrink:0}}>{isOpen?"▲":"▼"}</div>
      </button>
      {isOpen&&(<div style={{background:"#0e0e16",border:"1px solid #222233",borderTop:"none",borderRadius:"0 0 10px 10px"}}>
        <div style={{display:"flex",gap:8,padding:"8px 14px",borderBottom:"1px solid #222233",alignItems:"center"}}>
          <span style={{fontSize:10,color:"#6a6a7e",textTransform:"uppercase",letterSpacing:"0.08em"}}>Sort:</span>
          {[["bid","Price"],["release","Date"]].map(([k,l])=>(<button key={k} onClick={()=>setSortMode(s=>({...s,[exec.name]:k}))} style={{fontSize:10,padding:"3px 8px",borderRadius:4,border:`1px solid ${mode===k?"#d4a843":"#2a2a3a"}`,background:mode===k?"#d4a84320":"transparent",color:mode===k?"#d4a843":"#6a6a7e",cursor:"pointer",fontWeight:600}}>{l}</button>))}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 50px 50px 80px",gap:4,padding:"6px 14px",fontSize:9,color:"#6a6a7e",textTransform:"uppercase",letterSpacing:"0.08em",borderBottom:"1px solid #1a1a28"}}><div>Film</div><div style={{textAlign:"right"}}>Bid</div><div style={{textAlign:"center"}}>Date</div><div style={{textAlign:"right"}}>Dom. BO</div></div>
        {films.map((f,i)=>{const roi=f.bo>0?((f.bo/(f.bid*1e6))*100).toFixed(0):null;const rd=f.release?new Date(f.release):null;const rs=rd?`${rd.getMonth()+1}/${rd.getDate()}`:"—";return(
          <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 50px 50px 80px",gap:4,padding:"7px 14px",fontSize:13,alignItems:"center",borderBottom:"1px solid #14141e"}}>
            <div><span style={{fontWeight:600}}>{f.title}</span>

              {roi&&<span style={{fontSize:9,color:Number(roi)>=100?"#34d399":"#f87171",marginLeft:4,fontFamily:"monospace"}}>{roi}%</span>}
            </div>

            <div style={{fontFamily:"monospace",fontSize:10,color:"#4a4a5e",textAlign:"center"}}>{rs}</div>

      </div>)}

// ─── CALENDAR ──────────────────
function CalendarView({films}){
  const[mode,setMode]=useState("list");
  const weekendMap={};films.forEach(f=>{if(!f.release)return;const key=f.release.split("T")[0]||f.release;if(!weekendMap[key])weekendMap[key]=[];weekendMap[key].push(f)});
  const h2hDates=new Set();Object.entries(weekendMap).forEach(([d,fs])=>{if(new Set(fs.map(x=>x.team)).size>1)h2hDates.add(d)});
  const months={};const tbas=[];
  films.forEach(f=>{if(!f.release){tbas.push(f);return}const d=parseReleaseDate(f.release);if(!d||isNaN(d)){tbas.push(f);return}const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;if(!months[key])months[key]=[];months[key].push({...f,date:d,dateStr:f.release.split("T")[0]||f.release})});
  const mNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const today=new Date();

  return(<div>
    <div style={{display:"flex",gap:6,marginBottom:12}}>{[["list","List View"],["grid","Calendar Grid"]].map(([k,l])=>(<button key={k} onClick={()=>setMode(k)} style={{fontSize:11,padding:"6px 14px",borderRadius:6,border:`1px solid ${mode===k?"#d4a843":"#222233"}`,background:mode===k?"#d4a84318":"#111119",color:mode===k?"#d4a843":"#6a6a7e",cursor:"pointer",fontWeight:700}}>{l}</button>))}</div>
    {mode==="list"?(
      <div style={{background:"#111119",border:"1px solid #222233",borderRadius:10,padding:"16px 14px"}}>
        {Object.keys(months).sort().map(key=>{const[y,m]=key.split("-");const mFilms=months[key].sort((a,b)=>a.date-b.date);return(
          <div key={key} style={{marginBottom:18}}>
            <div style={{fontWeight:800,fontSize:13,color:"#a07c2e",letterSpacing:"0.06em",marginBottom:6}}>{mNames[parseInt(m)-1]} {y}</div>
            {mFilms.map((f,i)=>{const isH2H=h2hDates.has(f.dateStr);const releaseDay=isReleaseDay(f.dateStr);return(
              <div key={i} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 4px",fontSize:13,opacity:f.date<today?1:0.6,borderLeft:isH2H?"2px solid #f87171":releaseDay?"2px solid #d4a843":"2px solid transparent",paddingLeft:isH2H||releaseDay?6:4,maxWidth:600,margin:"0 auto",background:releaseDay?"rgba(212,168,67,0.04)":"transparent",borderRadius:releaseDay?4:0}}>
                <span style={{fontFamily:"monospace",color:"#4a4a5e",minWidth:20,fontSize:11}}>{f.date.getDate()}</span>
                <div style={{width:7,height:7,borderRadius:"50%",background:EXEC_COLORS[f.team],flexShrink:0}}/>
                <ReleaseDayBadge releaseDate={f.dateStr} style={{flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.title}</span>
                </ReleaseDayBadge>
                {isH2H&&<span style={{fontSize:7,background:"rgba(248,113,113,0.12)",color:"#f87171",padding:"1px 4px",borderRadius:3,flexShrink:0}}>H2H</span>}
                <span style={{fontSize:10,color:EXEC_COLORS[f.team],fontFamily:"monospace",flexShrink:0}}>{DISPLAY[f.team]}</span>
                <span style={{fontSize:10,color:"#4a4a5e",fontFamily:"monospace",flexShrink:0}}>${f.bid}M</span>
                {f.bo>0&&<span style={{fontFamily:"monospace",fontSize:11,color:"#34d399",flexShrink:0}}>{fmt(f.bo)}</span>}
              </div>)})}
          </div>)})}
        {tbas.length>0&&(<div><div style={{fontWeight:800,fontSize:13,color:"#4a4a5e",marginBottom:6}}>TBA</div>{tbas.map((f,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:6,padding:"4px 4px",fontSize:13,opacity:0.4,maxWidth:600,margin:"0 auto"}}><span style={{minWidth:20,color:"#4a4a5e",fontFamily:"monospace"}}>—</span><div style={{width:7,height:7,borderRadius:"50%",background:EXEC_COLORS[f.team],flexShrink:0}}/><span style={{flex:1}}>{f.title}</span><span style={{fontSize:10,color:EXEC_COLORS[f.team],fontFamily:"monospace"}}>{DISPLAY[f.team]}</span></div>))}</div>)}
      </div>
    ):<CalendarGrid films={films} months={months} h2hDates={h2hDates}/>}
  </div>);
}

function CalendarGrid({films,months,h2hDates}){
  const mNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];const dayNames=["S","M","T","W","T","F","S"];const today=new Date();today.setHours(0,0,0,0);
  const allMonths=[];for(let y=2026;y<=2027;y++){const s=y===2026?2:0;const e=y===2027?3:11;for(let m=s;m<=e;m++)allMonths.push({y,m})}
  const filmsByDate={};films.forEach(f=>{if(!f.release)return;const d=parseReleaseDate(f.release);if(!d||isNaN(d))return;const key=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;if(!filmsByDate[key])filmsByDate[key]=[];filmsByDate[key].push(f)});
  return(<div style={{display:"flex",flexDirection:"column",gap:16}}>
    {allMonths.map(({y,m})=>{const firstDay=new Date(y,m,1).getDay();const dim=new Date(y,m+1,0).getDate();const cells=[];for(let i=0;i<firstDay;i++)cells.push(null);for(let d=1;d<=dim;d++)cells.push(d);return(
      <div key={`${y}-${m}`} style={{background:"#111119",border:"1px solid #222233",borderRadius:10,padding:12}}>
        <div style={{fontWeight:800,fontSize:13,color:"#a07c2e",marginBottom:8}}>{mNames[m]} {y}</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
          {dayNames.map((d,i)=>(<div key={i} style={{fontSize:9,color:"#4a4a5e",textAlign:"center",padding:2}}>{d}</div>))}
          {cells.map((day,i)=>{if(day===null)return<div key={`e-${i}`}/>;const key=`${y}-${m}-${day}`;const df=filmsByDate[key]||[];const isT=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===day;const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;const isH=h2hDates.has(ds);return(
            <div key={day} style={{minHeight:36,padding:2,borderRadius:4,background:isT?"#d4a84315":df.length>0?"#0e0e16":"transparent",border:isT?"1px solid #d4a84340":isH&&df.length>0?"1px solid #f8717140":"1px solid transparent"}}>
              <div style={{fontSize:9,color:isT?"#d4a843":"#4a4a5e",fontFamily:"monospace"}}>{day}</div>
              {df.map((f,fi)=>(<div key={fi} style={{fontSize:7,lineHeight:1.3,padding:"1px 2px",borderRadius:2,background:EXEC_COLORS[f.team]+"25",color:EXEC_COLORS[f.team],overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginTop:1}} title={`${f.title} (${DISPLAY[f.team]}) - $${f.bid}M`}>{f.title.length>12?f.title.slice(0,11)+"...":f.title}</div>))}
            </div>)})}
        </div>
      </div>)})}
  </div>);
}

// Used to build Box Office Mojo links: https://www.boxofficemojo.com/title/{imdbid}/
const IMDB_MAP=(()=>{
  const map={};

  for(const line of lines){
    const cols=line.split(',');
    const title=(cols[0]||'').trim();

    if(title&&imdb&&imdb.startsWith('tt')) map[title.toLowerCase()]=imdb;

  // Manual overrides for titles that differ between the slate and UNIVERSE_DATA
  const overrides={
    "lee cronin's the mummy":                    "tt32612507",  // apostrophe stripped in CSV

    "angry birds 3":                              "tt32557122",  // UNIVERSE_DATA: "The Angry Birds Movie 3"
    "wild horse nine":                            "tt15799564",  // not in UNIVERSE_DATA
    "godzilla minus zero":                        "tt34384661",  // not in UNIVERSE_DATA
    "end of oak street":                          "tt27165187",  // UNIVERSE_DATA: "Flowervale Street"
    "fjord":                                      "tt35410859",  // not in UNIVERSE_DATA

function BiggestMisses({films}){
  const [misses, setMisses] = useState(null);

  useEffect(()=>{
    // Try live Google Sheet first, fall back to embedded CSV
    const LIVE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQT4IsjOToQ2VQHupKe7NLLlrD6SxkYALrnOAwvtSKgL-wWr9SPFZ8O3ru7_AhXl9wi5isLXg_Psxjg/pub?gid=1844561946&single=true&output=csv";

    // Normalize a title for fuzzy matching: lowercase, strip leading "the "/"a ", strip punctuation
    function normTitle(t){
      return t.toLowerCase()
        .replace(/^(the |a |an )/,'')
        .replace(/[^a-z0-9 ]/g,'')
        .replace(/\s+/g,' ')
        .trim();
    }

    // Build set of normalized titles already on someone's slate
    const draftedNorms=new Set(films.map(f=>normTitle(f.title)));

    function parseUniverseCSV(text){
      const rows = parseCSV(text);
      const results = [];
      for(let i=1;i<rows.length;i++){
        const r = rows[i];
        if(!r||!r[0]) continue;
        const title = r[0].trim();
        if(!title) continue;
        const boRaw = (r[4]||"").trim();
        if(!boRaw || boRaw==="Not found" || boRaw==="Not released") continue;
        const bo = parseNum(boRaw);
        if(bo<=0) continue;
        // Check "On the Slate?" column
        const onSlate = (r[5]||"").trim().toUpperCase();
        if(onSlate==="YES") continue;
        // Also cross-check against actual slate titles (handles title mismatches)
        if(draftedNorms.has(normTitle(title))) continue;
        results.push({title, bo});
      }
      results.sort((a,b)=>b.bo-a.bo);
      return results.slice(0,3);
    }

    fetch(LIVE_URL)
      .then(r=>{ if(!r.ok) throw new Error('not ok'); return r.text(); })
      .then(text=>{ if(text.trim().startsWith('<')) throw new Error('html'); return text; })
      .then(text=>setMisses(parseUniverseCSV(text)))
      .catch(()=>setMisses(parseUniverseCSV(UNIVERSE_DATA)));
  },[]);

  const displayMisses = misses || [];
  const maxBO = displayMisses.length>0 ? Math.max(...displayMisses.map(m=>m.bo)) : 1;

  return(
    <div style={{background:"#111119",border:"1px solid #222233",borderRadius:10,padding:"16px 14px"}}>
      <div style={{fontSize:12,fontWeight:700,color:"#f59e0b",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:4}}><span style={{display:"inline-flex",alignItems:"center",gap:4,marginRight:4}}><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 3l4 5 3-3 4 5" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/><path d="M10 10h3V7" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg></span> Biggest Misses</div>
      <div style={{fontSize:10,color:"#6a6a7e",marginBottom:12}}>Highest-grossing released films from the 2026 Universe that nobody drafted</div>
      {displayMisses.length===0?(
        <div style={{padding:"20px",background:"#0e0e16",borderRadius:6,textAlign:"center"}}>
          <div style={{fontSize:12,color:"#6a6a7e"}}>{misses===null?"Loading...":"No un-drafted films with box office data yet."}</div>
        </div>
      ):(
        <div>
          {displayMisses.map((m,i)=>{
            const barPct = Math.min((m.bo/maxBO)*100,100);
            return(
              <MissRow key={i} m={m} i={i} barPct={barPct}/>
            );
          })}
          <div style={{marginTop:10,fontSize:10,color:"#4a4a5e",borderTop:"1px solid #1a1a28",paddingTop:8}}>Top 3 films in the 2026 Universe with box office but not on any exec's slate.</div>
        </div>
      )}
    </div>
  );
}

function BudgetDonut({exec}){
  const films=[...exec.films].sort((a,b)=>b.bid-a.bid);
  const rem=getTeamRemainder(exec.name);const remaining=rem?rem.remaining:exec.remaining;
  const total=exec.totalSpent+remaining;const cx=56,cy=56;
  let cumAngle=0;const[hoverFilm,setHoverFilm]=useState(null);
  const[donutRef,inView]=useInView(0.3);
  const segments=films.map(f=>{const pct=f.bid/total;const seg={...f,pct,startAngle:cumAngle,endAngle:cumAngle+pct*360};cumAngle+=pct*360;return seg});
  if(remaining>0)segments.push({title:"Unspent",bid:remaining,team:exec.name,pct:remaining/total,startAngle:cumAngle,endAngle:cumAngle+(remaining/total)*360,isRemainder:true});
  function arcPath(s,e,ir,or){const tr=d=>(d-90)*Math.PI/180;const s1=tr(s),e1=tr(e);const la=e-s>180?1:0;return`M${cx+or*Math.cos(s1)},${cy+or*Math.sin(s1)} A${or},${or} 0 ${la} 1 ${cx+or*Math.cos(e1)},${cy+or*Math.sin(e1)} L${cx+ir*Math.cos(e1)},${cy+ir*Math.sin(e1)} A${ir},${ir} 0 ${la} 0 ${cx+ir*Math.cos(s1)},${cy+ir*Math.sin(s1)} Z`}
  const releasedCount=films.filter(f=>f.bo>0).length;
  return(
    <div ref={donutRef} style={{textAlign:"center",position:"relative",display:"flex",flexDirection:"column",alignItems:"center"}}>
      <svg width={112} height={112} viewBox="0 0 112 112" style={{display:"block",animation:inView?"donutFadeIn 0.6s ease-out both":undefined,opacity:inView?undefined:0}}>
        {segments.map((seg,i)=>{
          const gap=1;const start=seg.startAngle+gap/2;const end=seg.endAngle-gap/2;
          if(end<=start)return null;const isH=hoverFilm===i;
          const isReleased=!seg.isRemainder&&seg.bo>0;
          const color=seg.isRemainder?"#2a2a3a":EXEC_COLORS[seg.team];
          const opacity=seg.isRemainder?0.5:isReleased?(isH?1:0.85):(isH?0.45:0.18);
          return(<g key={i}>
            <path d={arcPath(start,end,28,isH?52:46)} fill={color} opacity={opacity} style={{cursor:"pointer",transition:"all 0.15s"}} onMouseEnter={()=>setHoverFilm(i)} onMouseLeave={()=>setHoverFilm(null)}/>
          </g>);
        })}
        <text x={cx} y={cy} textAnchor="middle" fill="#e8e8f0" fontSize={11} fontWeight={700} fontFamily="monospace">${total}M</text>
        <text x={cx} y={cy+12} textAnchor="middle" fill="#6a6a7e" fontSize={8} fontFamily="monospace">{releasedCount}/{films.length} out</text>
      </svg>
      <div style={{fontSize:12,fontWeight:700,color:EXEC_COLORS[exec.name],marginTop:2}}>{DISPLAY[exec.name]}</div>
      {hoverFilm!==null&&segments[hoverFilm]&&(
        <div style={{position:"absolute",top:-8,left:"50%",transform:"translate(-50%,-100%)",background:"#1e1e2e",border:"1px solid #3a3a50",borderRadius:6,padding:"6px 10px",fontSize:11,whiteSpace:"nowrap",zIndex:10,boxShadow:"0 4px 20px rgba(0,0,0,0.5)"}}>
          <div style={{fontWeight:700}}>{segments[hoverFilm].title}</div>
          <div style={{color:"#6a6a7e"}}>${segments[hoverFilm].bid}M ({(segments[hoverFilm].pct*100).toFixed(1)}%)</div>
          {!segments[hoverFilm].isRemainder&&(<div style={{color:segments[hoverFilm].bo>0?"#34d399":"#6a6a7e",fontSize:10,marginTop:2}}>{segments[hoverFilm].bo>0?`Released: ${fmt(segments[hoverFilm].bo)}`:"Not yet released"}</div>)}

// ─── BO SHARE DONUT — earnings + unspent budget share ──────────────────
function BOShareDonut({exec}){
  const releasedFilms=[...exec.films].filter(f=>f.bo>0).sort((a,b)=>b.bo-a.bo);
  const rem=getTeamRemainder(exec.name);
  const remaining=(rem&&rem.remaining>0)?rem.remaining:0;
  const totalBO=exec.totalBO;
  const cx=56,cy=56;
  const[hoverIdx,setHoverIdx]=useState(null);
  const[donutRef,inView]=useInView(0.3);

  const remainingDollars=remaining*1e6;
  const grandTotal=totalBO+remainingDollars;

  // Arc path that correctly handles full-circle (SVG can't draw a full 360° arc in one command)
  function arcPath(s,e,ir,or){
    const tr=d=>(d-90)*Math.PI/180;
    const span=e-s;
    // For a nearly-full circle, split into two arcs
    if(span>=359.5){
      const m=s+span/2;
      const t1=tr(s),t2=tr(m),t3=tr(e);
      return[
        `M${cx+or*Math.cos(t1)},${cy+or*Math.sin(t1)}`,
        `A${or},${or} 0 1 1 ${cx+or*Math.cos(t2)},${cy+or*Math.sin(t2)}`,
        `A${or},${or} 0 1 1 ${cx+or*Math.cos(t3)},${cy+or*Math.sin(t3)}`,
        `L${cx+ir*Math.cos(t3)},${cy+ir*Math.sin(t3)}`,
        `A${ir},${ir} 0 1 0 ${cx+ir*Math.cos(t2)},${cy+ir*Math.sin(t2)}`,
        `A${ir},${ir} 0 1 0 ${cx+ir*Math.cos(t1)},${cy+ir*Math.sin(t1)}`,
        'Z'
      ].join(' ');
    }
    const s1=tr(s),e1=tr(e);
    const la=span>180?1:0;
    return`M${cx+or*Math.cos(s1)},${cy+or*Math.sin(s1)} A${or},${or} 0 ${la} 1 ${cx+or*Math.cos(e1)},${cy+or*Math.sin(e1)} L${cx+ir*Math.cos(e1)},${cy+ir*Math.sin(e1)} A${ir},${ir} 0 ${la} 0 ${cx+ir*Math.cos(s1)},${cy+ir*Math.sin(s1)} Z`;
  }

  // Zero state — dim placeholder ring
  if(grandTotal===0){
    return(
      <div ref={donutRef} style={{textAlign:"center",display:"flex",flexDirection:"column",alignItems:"center"}}>
        <svg width={112} height={112} viewBox="0 0 112 112" style={{display:"block",animation:inView?"donutFadeIn 0.6s ease-out both":undefined,opacity:inView?undefined:0}}>
          <path d={arcPath(0,359.9,28,46)} fill={EXEC_COLORS[exec.name]} opacity={0.1}/>
          <text x={cx} y={cy+4} textAnchor="middle" fill="#4a4a5e" fontSize={9} fontFamily="monospace">$0</text>
        </svg>
        <div style={{fontSize:12,fontWeight:700,color:EXEC_COLORS[exec.name],marginTop:2}}>{DISPLAY[exec.name]}</div>
      </div>
    );
  }

  // Build segments
  const segments=[];
  let cumAngle=0;
  const isSingle=releasedFilms.length===0&&remainingDollars>0;

  releasedFilms.forEach(f=>{
    const pct=f.bo/grandTotal;
    if(pct<=0)return;
    const span=pct*360;
    segments.push({...f,pct,startAngle:cumAngle,endAngle:cumAngle+span,isRemainder:false});
    cumAngle+=span;
  });
  if(remainingDollars>0){
    const pct=remainingDollars/grandTotal;
    const span=isSingle?359.9:pct*360;
    segments.push({title:"Unspent Budget",bo:remainingDollars,pct,startAngle:isSingle?0:cumAngle,endAngle:isSingle?359.9:cumAngle+span,isRemainder:true,team:exec.name});
  }

  const brightnessLevels=[1,0.72,0.48,0.32,0.2,0.14];
  const centerLabel=fmt(grandTotal);
  const subLabel=releasedFilms.length>0?`${releasedFilms.length} film${releasedFilms.length!==1?"s":""}`:"budget only";

  return(
    <div ref={donutRef} style={{textAlign:"center",position:"relative",display:"flex",flexDirection:"column",alignItems:"center"}}>
      <svg width={112} height={112} viewBox="0 0 112 112" style={{display:"block",animation:inView?"donutFadeIn 0.6s ease-out both":undefined,opacity:inView?undefined:0}}>
        {segments.map((seg,i)=>{
          const isH=hoverIdx===i;
          const isOnly=segments.length===1;
          const gap=isOnly?0:1;
          const start=seg.startAngle+gap/2;
          const end=seg.endAngle-(isOnly?0:gap/2);
          const color=seg.isRemainder?"#2a2a3a":EXEC_COLORS[seg.team];
          const filmIdx=segments.slice(0,i).filter(s=>!s.isRemainder).length;
          const opacity=seg.isRemainder?0.65:Math.min(brightnessLevels[Math.min(filmIdx,brightnessLevels.length-1)]*(isH?1.12:1),1);
          if(!isOnly&&end<=start)return null;
          return(<g key={i}>
            <path d={arcPath(start,end,28,isH?52:46)} fill={color} opacity={opacity}
              style={{cursor:"pointer",transition:"all 0.15s"}}
              onMouseEnter={()=>setHoverIdx(i)} onMouseLeave={()=>setHoverIdx(null)}/>
          </g>);
        })}
        <text x={cx} y={cy} textAnchor="middle" fill="#e8e8f0" fontSize={9} fontWeight={700} fontFamily="monospace">{centerLabel}</text>
        <text x={cx} y={cy+11} textAnchor="middle" fill="#6a6a7e" fontSize={7} fontFamily="monospace">{subLabel}</text>
      </svg>
      <div style={{fontSize:12,fontWeight:700,color:EXEC_COLORS[exec.name],marginTop:2}}>{DISPLAY[exec.name]}</div>
      {hoverIdx!==null&&segments[hoverIdx]&&(
        <div style={{position:"absolute",top:-8,left:"50%",transform:"translate(-50%,-100%)",background:"#1e1e2e",border:"1px solid #3a3a50",borderRadius:6,padding:"6px 10px",fontSize:11,whiteSpace:"nowrap",zIndex:10,boxShadow:"0 4px 20px rgba(0,0,0,0.5)"}}>
          <div style={{fontWeight:700}}>{segments[hoverIdx].title}</div>
          {segments[hoverIdx].isRemainder?(
            <div style={{color:"#6a6a7e",fontFamily:"monospace"}}>${remaining}M unspent</div>
          ):(
            <>
              <div style={{color:"#34d399",fontFamily:"monospace"}}>{fmt(segments[hoverIdx].bo)}</div>
              <div style={{color:"#6a6a7e",fontSize:10}}>{(segments[hoverIdx].pct*100).toFixed(1)}% of total value</div>
            </>
          )}
        </div>)}
    </div>);
}
