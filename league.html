// Setup card shown inside ManageTab once draft_mode==='live': turn order
// (reorder via up/down -- no drag-and-drop lib in this project) and the
// timer/soft-close/nomination-timeout config, then Start Draft. configure_draft
// is safely re-callable any number of times while status is still 'setup'
// (it's an upsert keyed on league_id), so Save Setup can be hit repeatedly.
function DraftSetupCard({leagueContext, members, draftSession, refreshDraftSession, onGoToDraftRoom}){
  const l=leagueContext||{};
  const[turnOrder,setTurnOrder]=useState(draftSession?.turn_order?.length?draftSession.turn_order:(members||[]).map(m=>m.user_id));
  const[timerSeconds,setTimerSeconds]=useState(draftSession?.timer_seconds||60);
  const[softCloseSeconds,setSoftCloseSeconds]=useState(draftSession?.soft_close_seconds||10);
  const[nominationTimeoutSeconds,setNominationTimeoutSeconds]=useState(draftSession?.nomination_timeout_seconds||30);
  const[saving,setSaving]=useState(false);
  const[starting,setStarting]=useState(false);
  const[msg,setMsg]=useState(null);

  useEffect(()=>{
    if(draftSession){
      setTurnOrder(draftSession.turn_order?.length?draftSession.turn_order:(members||[]).map(m=>m.user_id));
      setTimerSeconds(draftSession.timer_seconds||60);
      setSoftCloseSeconds(draftSession.soft_close_seconds||10);
      setNominationTimeoutSeconds(draftSession.nomination_timeout_seconds||30);
    }
  },[draftSession?.id]);

  function nameFor(userId){
    const m=(members||[]).find(x=>x.user_id===userId);
    return m?.profile?.display_name||m?.team_name||userId;
  }

  function move(idx,dir){
    setTurnOrder(order=>{
      const j=idx+dir;
      if(j<0||j>=order.length) return order;
      const next=[...order];
      [next[idx],next[j]]=[next[j],next[idx]];
      return next;
    });
  }

  function randomize(){
    setTurnOrder(order=>{
      const next=[...order];
      for(let i=next.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [next[i],next[j]]=[next[j],next[i]];
      }
      return next;
    });
  }

  async function callRpc(fn,args){
    const session=getSession();
    const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{
      method:"POST",
      headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${session?.access_token||SUPABASE_ANON_KEY}`,"Content-Type":"application/json"},
      body:JSON.stringify(args)
    });
    const data=await res.json().catch(()=>({}));
    return {ok:res.ok,data};
  }

  async function saveSetup(){
    setSaving(true); setMsg(null);
    const {ok,data}=await callRpc("configure_draft",{
      p_league_id:LEAGUE_UUID,
      p_turn_order:turnOrder,
      p_timer_seconds:Number(timerSeconds)||60,
      p_soft_close_seconds:Number(softCloseSeconds)||10,
      p_nomination_timeout_seconds:Number(nominationTimeoutSeconds)||30,
    });
    setSaving(false);
    if(ok){ setMsg({text:"Setup saved.",error:false}); refreshDraftSession(); }
    else setMsg({text:data.message||"Failed to save setup.",error:true});
  }

  async function startDraft(){
    if(!window.confirm("Start the live draft now? Turn order and timers lock in once it begins.")) return;
    setStarting(true); setMsg(null);
    const {ok,data}=await callRpc("start_draft",{p_league_id:LEAGUE_UUID});
    setStarting(false);
    if(ok) refreshDraftSession();
    else setMsg({text:data.message||"Failed to start.",error:true});
  }

  if(l.draft_mode!=="live") return null;

  const inp={width:"100%",padding:"8px 10px",background:"#1a1a28",border:"1px solid #222233",borderRadius:6,color:"#e8e8f0",fontSize:13,boxSizing:"border-box"};
  const isSetup = !draftSession||draftSession.status==="setup";

  return(
    <div style={{background:"#111119",border:"1px solid #222233",borderRadius:10,padding:"16px 14px"}}>
      <div style={{fontSize:12,fontWeight:700,color:"#d4a843",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:14}}>Live Draft Setup</div>
      {msg&&<div style={{padding:"8px 12px",borderRadius:6,fontSize:12,marginBottom:12,background:msg.error?"rgba(239,68,68,0.08)":"rgba(52,211,153,0.08)",border:`1px solid ${msg.error?"rgba(239,68,68,0.2)":"rgba(52,211,153,0.2)"}`,color:msg.error?"#ef4444":"#34d399"}}>{msg.text}</div>}

      {isSetup?(
        <>
          <div style={{fontSize:11,fontWeight:700,color:"#6a6a7e",textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:8}}>Turn Order</div>
          {turnOrder.map((uid,i)=>(
            <div key={uid} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:"#1a1a28",borderRadius:6,marginBottom:4}}>
              <div style={{width:18,textAlign:"center",fontSize:11,color:"#6a6a7e",fontFamily:"monospace"}}>{i+1}</div>
              <div style={{flex:1,fontSize:13,color:"#e8e8f0"}}>{nameFor(uid)}</div>
              <button onClick={()=>move(i,-1)} disabled={i===0} style={{background:"none",border:"none",color:i===0?"#3a3a4e":"#6a6a7e",cursor:i===0?"default":"pointer",fontSize:13,padding:"2px 6px"}}>↑</button>
              <button onClick={()=>move(i,1)} disabled={i===turnOrder.length-1} style={{background:"none",border:"none",color:i===turnOrder.length-1?"#3a3a4e":"#6a6a7e",cursor:i===turnOrder.length-1?"default":"pointer",fontSize:13,padding:"2px 6px"}}>↓</button>
            </div>
          ))}
          <button onClick={randomize} style={{marginTop:6,marginBottom:16,padding:"6px 14px",borderRadius:7,border:"1px solid #222233",background:"transparent",color:"#6a6a7e",fontSize:11,fontWeight:700,cursor:"pointer"}}>Randomize</button>

          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
            <div>
              <div style={{fontSize:10,color:"#6a6a7e",marginBottom:4}}>Bid timer (sec)</div>
              <input type="number" value={timerSeconds} onChange={e=>setTimerSeconds(e.target.value)} style={inp}/>
            </div>
            <div>
              <div style={{fontSize:10,color:"#6a6a7e",marginBottom:4}}>Soft-close (sec)</div>
              <input type="number" value={softCloseSeconds} onChange={e=>setSoftCloseSeconds(e.target.value)} style={inp}/>
            </div>
            <div>
              <div style={{fontSize:10,color:"#6a6a7e",marginBottom:4}}>Nom. timeout (sec)</div>
              <input type="number" value={nominationTimeoutSeconds} onChange={e=>setNominationTimeoutSeconds(e.target.value)} style={inp}/>
            </div>
          </div>

          <div style={{display:"flex",gap:8}}>
            <button onClick={saveSetup} disabled={saving} style={{padding:"8px 18px",borderRadius:7,border:"1px solid rgba(212,168,67,0.3)",background:"rgba(212,168,67,0.08)",color:"#d4a843",fontSize:12,fontWeight:700,cursor:"pointer",opacity:saving?0.7:1}}>
              {saving?"Saving…":"Save Setup"}
            </button>
            <button onClick={startDraft} disabled={starting||!draftSession} title={!draftSession?"Save the setup first":undefined} style={{padding:"8px 18px",borderRadius:7,border:"none",background:"#d4a843",color:"#0d0d14",fontSize:12,fontWeight:700,cursor:"pointer",opacity:(starting||!draftSession)?0.5:1}}>
              {starting?"Starting…":"Start Draft"}
            </button>
          </div>
        </>
      ):(
        <div style={{fontSize:13,color:"#8a8a9e"}}>
          {draftSession.status==="active"?<>Draft is live. <a onClick={onGoToDraftRoom} style={{color:"#d4a843",cursor:"pointer",textDecoration:"underline"}}>Go to the Draft Room tab →</a></>:"Draft completed."}
        </div>
      )}
    </div>
  );
}

// The live room itself: whose-turn banner, nominated-film card with live
// high bid + countdown, bid input, budget strip, resolved-items history.
// Resyncs everything on any Realtime event on the three draft tables rather
// than hand-patching state from the payload -- a resolution touches
// draft_items/draft_sessions/league_picks at once, so a full resync is both
// simpler and self-healing if a message is ever missed.
function DraftRoomTab({leagueContext, members, userMembership, films, draftSession, setDraftSession}){
  const isAdmin = userMembership?.role==="admin";
  const myUserId = userMembership?.user_id;

  const[activeItem,setActiveItem]=useState(null);
  const[bids,setBids]=useState([]);
  const[history,setHistory]=useState([]);
  const[budgets,setBudgets]=useState([]);
  const[loading,setLoading]=useState(true);
  const[msg,setMsg]=useState(null);
  const[now,setNow]=useState(Date.now());

  const[universeFilms,setUniverseFilms]=useState([]);
  const[nomSearch,setNomSearch]=useState("");
  const[nomSelected,setNomSelected]=useState(null);
  const[nominating,setNominating]=useState(false);
  const[bidAmount,setBidAmount]=useState("");
  const[bidding,setBidding]=useState(false);

  const resolveInFlightRef=useRef(false);

  async function callRpc(fn,args){
    const session=getSession();
    const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`,{
      method:"POST",
      headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${session?.access_token||SUPABASE_ANON_KEY}`,"Content-Type":"application/json"},
      body:JSON.stringify(args)
    });
    const data=await res.json().catch(()=>({}));
    return {ok:res.ok,data};
  }

  async function loadAll(){
    try{
      const [sessions, items, budgetRes] = await Promise.all([
        supabaseFetch("draft_sessions", `league_id=eq.${LEAGUE_UUID}&select=*`),
        supabaseFetch("draft_items", `league_id=eq.${LEAGUE_UUID}&select=*,universe_films(title,release_date)&order=started_at.desc&limit=30`),
        callRpc("league_draft_budgets",{p_league_id:LEAGUE_UUID}),
      ]);
      if(sessions&&sessions[0]) setDraftSession(sessions[0]);
      const active=(items||[]).find(i=>i.status==="active")||null;
      setActiveItem(active);
      setHistory((items||[]).filter(i=>i.status!=="active"));
      setBudgets(budgetRes.ok?(budgetRes.data||[]):[]);
      if(active){
        const bidRows=await supabaseFetch("draft_bids", `draft_item_id=eq.${active.id}&order=submitted_at.desc&limit=20`);
        setBids(bidRows||[]);
      } else {
        setBids([]);
      }
      if(universeFilms.length===0){
        const uf=await supabaseFetch("universe_films","select=id,title,imdb_id,release_date,festival_protected_until&order=release_date.asc.nullslast");
        setUniverseFilms(uf||[]);
      }
    }catch(e){ console.error("[draft room] load failed:", e.message); }
    setLoading(false);
  }

  useEffect(()=>{ loadAll(); },[]);

  useEffect(()=>{
    const channel=supabaseClient
      .channel(`draft-room-${LEAGUE_UUID}`)
      .on("postgres_changes",{event:"*",schema:"public",table:"draft_sessions",filter:`league_id=eq.${LEAGUE_UUID}`},()=>loadAll())
      .on("postgres_changes",{event:"*",schema:"public",table:"draft_items",filter:`league_id=eq.${LEAGUE_UUID}`},()=>loadAll())
      .on("postgres_changes",{event:"*",schema:"public",table:"draft_bids",filter:`league_id=eq.${LEAGUE_UUID}`},()=>loadAll())
      .subscribe((status)=>{ if(status==="SUBSCRIBED") loadAll(); });
    return ()=>{ supabaseClient.removeChannel(channel); };
  },[]);

  // Purely a display tick -- always recomputed from whatever ends_at is
  // currently in state, never a locally-decrementing counter, so a
  // soft-close extension arriving via Realtime is picked up automatically.
  useEffect(()=>{
    const t=setInterval(()=>setNow(Date.now()),1000);
    return ()=>clearInterval(t);
  },[]);

  // Whichever connected client's countdown reaches zero first calls the
  // resolve/pass RPC -- both are idempotent server-side (draft_sessions row
  // lock + status re-check), so multiple tabs racing on this is harmless.
  // resolveInFlightRef only guards against this same tab firing twice on
  // consecutive 1s ticks before loadAll() has cleared the expired item.
  useEffect(()=>{
    if(!draftSession||draftSession.status!=="active"||resolveInFlightRef.current) return;
    if(activeItem && new Date(activeItem.ends_at).getTime()<=now){
      resolveInFlightRef.current=true;
      callRpc("resolve_draft_item",{p_league_id:LEAGUE_UUID,p_draft_item_id:activeItem.id}).finally(()=>{resolveInFlightRef.current=false; loadAll();});
    } else if(!activeItem && draftSession.nomination_ends_at && new Date(draftSession.nomination_ends_at).getTime()<=now){
      resolveInFlightRef.current=true;
      callRpc("pass_turn",{p_league_id:LEAGUE_UUID}).finally(()=>{resolveInFlightRef.current=false; loadAll();});
    }
  },[now]);

  function normTitle(t){
    return (t||"").toLowerCase().replace(/^(the |a |an )/,"").replace(/[^a-z0-9]+/g," ").trim();
  }

  function getVisibleNomCandidates(){
    const already=new Set((films||[]).map(f=>f.imdb_id).filter(Boolean));
    const window=seasonWindowFor(leagueContext?.season);
    const nowD=new Date();
    let list=universeFilms.filter(f=>{
      if(!f.imdb_id||already.has(f.imdb_id)) return false;
      if(!f.release_date) return false;
      if(new Date(f.release_date)<=nowD) return false;
      if(f.festival_protected_until&&new Date(f.festival_protected_until)>nowD) return false;
      if(window&&(f.release_date<window.start||f.release_date>window.end)) return false;
      return true;
    });
    if(nomSearch.trim()){
      const n=normTitle(nomSearch);
      list=list.filter(f=>normTitle(f.title).includes(n));
    }
    return list.slice(0,50);
  }

  function nameFor(userId){
    const m=(members||[]).find(x=>x.user_id===userId);
    return m?.profile?.display_name||m?.team_name||"—";
  }

  function fmtSecs(ms){
    if(ms==null) return "—";
    return `${Math.ceil(ms/1000)}s`;
  }

  async function doNominate(){
    if(!nomSelected) return;
    setNominating(true); setMsg(null);
    const {ok,data}=await callRpc("nominate_film",{p_league_id:LEAGUE_UUID,p_imdb_id:nomSelected.imdb_id});
    setNominating(false);
    if(ok){ setNomSelected(null); setNomSearch(""); loadAll(); }
    else setMsg({text:data.message||"Nomination failed",error:true});
  }

  async function doBid(){
    setMsg(null);
    const amt=Number(bidAmount);
    if(!bidAmount||isNaN(amt)||amt<=0){ setMsg({text:"Enter a valid bid.",error:true}); return; }
    setBidding(true);
    const {ok,data}=await callRpc("place_draft_bid",{p_league_id:LEAGUE_UUID,p_draft_item_id:activeItem.id,p_amount:amt});
    setBidding(false);
    if(ok){ setBidAmount(""); loadAll(); }
    else setMsg({text:data.message||"Bid rejected",error:true});
  }

  async function doPass(){
    setMsg(null);
    const {ok,data}=await callRpc("pass_turn",{p_league_id:LEAGUE_UUID});
    if(ok) loadAll(); else setMsg({text:data.message||"Failed to pass",error:true});
  }

  async function doCancelItem(){
    if(!activeItem) return;
    setMsg(null);
    const {ok,data}=await callRpc("admin_cancel_draft_item",{p_league_id:LEAGUE_UUID,p_draft_item_id:activeItem.id});
    if(ok) loadAll(); else setMsg({text:data.message||"Failed to cancel",error:true});
  }

  async function doEndDraft(){
    if(!window.confirm("End the live draft? This locks the league's draft the same as the manual Lock Draft button.")) return;
    setMsg(null);
    const {ok,data}=await callRpc("admin_end_draft",{p_league_id:LEAGUE_UUID});
    if(ok) loadAll(); else setMsg({text:data.message||"Failed to end draft",error:true});
  }

  if(loading) return <div style={{padding:20,textAlign:"center",color:"#6a6a7e"}}>Loading Draft Room…</div>;
  if(!draftSession) return <div style={{padding:20,textAlign:"center",color:"#6a6a7e"}}>Draft hasn't been configured yet — an admin can set it up from the Manage tab.</div>;

  const turnOrder=draftSession.turn_order||[];
  const currentUserId=turnOrder[draftSession.current_turn_idx];
  const isMyTurn=currentUserId===myUserId;
  const msLeft = activeItem ? Math.max(0,new Date(activeItem.ends_at).getTime()-now) : (draftSession.nomination_ends_at ? Math.max(0,new Date(draftSession.nomination_ends_at).getTime()-now) : null);

  return(
    <div>
      {draftSession.status==="completed"&&<div style={{padding:16,borderRadius:8,background:"rgba(52,211,153,0.06)",border:"1px solid rgba(52,211,153,0.2)",color:"#34d399",fontSize:13,marginBottom:16}}>Draft completed.</div>}
      {msg&&<div style={{padding:"10px 14px",borderRadius:7,fontSize:13,marginBottom:16,background:msg.error?"rgba(239,68,68,0.08)":"rgba(52,211,153,0.08)",border:`1px solid ${msg.error?"rgba(239,68,68,0.2)":"rgba(52,211,153,0.2)"}`,color:msg.error?"#ef4444":"#34d399"}}>{msg.text}</div>}

      {draftSession.status==="active"&&(
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",borderRadius:8,background:"#111119",border:"1px solid #222233",marginBottom:16,flexWrap:"wrap",gap:10}}>
          <div style={{fontSize:13,color:"#e8e8f0"}}>
            {activeItem?<>Bidding is open on <b>{activeItem.universe_films?.title||activeItem.imdb_id}</b></>:<>Up next to nominate: <b style={{color:isMyTurn?"#d4a843":"#e8e8f0"}}>{nameFor(currentUserId)}</b>{isMyTurn?" (you!)":""}</>}
          </div>
          <div style={{fontFamily:"monospace",fontSize:16,fontWeight:700,color:msLeft!=null&&msLeft<6000?"#ef4444":"#d4a843"}}>{fmtSecs(msLeft)}</div>
        </div>
      )}

      {draftSession.status==="active"&&!activeItem&&isMyTurn&&(
        <div style={{padding:16,borderRadius:10,background:"#111119",border:"1px solid #222233",marginBottom:16}}>
          <div style={{fontSize:11,fontWeight:700,color:"#6a6a7e",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:12}}>Your turn — nominate a film</div>
          <input value={nomSearch} onChange={e=>{setNomSearch(e.target.value);setNomSelected(null);}} placeholder="Search the Universe of Films…"
            style={{width:"100%",padding:"9px 12px",borderRadius:7,border:"1px solid #2a2a3a",background:"#0e0e16",color:"#e8e8f0",fontSize:13,marginBottom:8,boxSizing:"border-box"}}/>
          {nomSearch.trim()&&!nomSelected&&(
            <div style={{maxHeight:160,overflowY:"auto",background:"#0e0e16",border:"1px solid #2a2a3a",borderRadius:7,marginBottom:8}}>
              {getVisibleNomCandidates().map(f=>(
                <div key={f.id} onClick={()=>{setNomSelected(f);setNomSearch(f.title);}} style={{padding:"8px 12px",fontSize:13,cursor:"pointer",color:"#e8e8f0",borderBottom:"1px solid #1a1a28"}}
                  onMouseEnter={e=>e.currentTarget.style.background="#1a1a28"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  {f.title}{f.release_date?<span style={{color:"#6a6a7e",marginLeft:6,fontSize:11}}>{f.release_date}</span>:null}
                </div>
              ))}
              {getVisibleNomCandidates().length===0&&<div style={{padding:"10px 12px",fontSize:12,color:"#6a6a7e"}}>No films match.</div>}
            </div>
          )}
          {nomSelected&&<div style={{fontSize:11,color:"#34d399",marginBottom:8}}>Selected: {nomSelected.title}</div>}
          <div style={{display:"flex",gap:8}}>
            <button onClick={doNominate} disabled={nominating||!nomSelected} style={{padding:"8px 18px",borderRadius:7,border:"none",background:"#d4a843",color:"#0d0d14",fontSize:12,fontWeight:700,cursor:"pointer",opacity:(nominating||!nomSelected)?0.6:1}}>
              {nominating?"Nominating…":"Nominate"}
            </button>
            <button onClick={doPass} style={{padding:"8px 18px",borderRadius:7,border:"1px solid #222233",background:"transparent",color:"#6a6a7e",fontSize:12,fontWeight:700,cursor:"pointer"}}>Pass</button>
          </div>
        </div>
      )}

      {draftSession.status==="active"&&activeItem&&(
        <div style={{padding:16,borderRadius:10,background:"#111119",border:"1px solid #222233",marginBottom:16}}>
          <div style={{fontSize:15,fontWeight:700,color:"#e8e8f0",marginBottom:4}}>{activeItem.universe_films?.title||activeItem.imdb_id}</div>
          <div style={{fontSize:11,color:"#6a6a7e",marginBottom:12}}>Nominated by {nameFor(activeItem.nominated_by)}{activeItem.universe_films?.release_date?` · releases ${activeItem.universe_films.release_date}`:""}</div>
          <div style={{fontSize:13,color:"#8a8a9e",marginBottom:10}}>
            Current high bid: <span style={{color:"#d4a843",fontWeight:700,fontFamily:"monospace"}}>{activeItem.current_high_bid!=null?`$${activeItem.current_high_bid}M`:"No bids yet"}</span>
            {activeItem.current_high_bidder?<> — {nameFor(activeItem.current_high_bidder)}</>:null}
          </div>
          <div style={{display:"flex",gap:8,marginBottom:12}}>
            <input type="number" value={bidAmount} onChange={e=>setBidAmount(e.target.value)} placeholder={`Bid ($M, min $${activeItem.current_high_bid!=null?Number(activeItem.current_high_bid)+1:(leagueContext?.min_bid||1)}M)`}
              style={{flex:1,padding:"9px 12px",borderRadius:7,border:"1px solid #2a2a3a",background:"#0e0e16",color:"#e8e8f0",fontSize:13,boxSizing:"border-box"}}/>
            <button onClick={doBid} disabled={bidding} style={{padding:"9px 20px",borderRadius:7,border:"none",background:"#d4a843",color:"#0d0d14",fontSize:12,fontWeight:700,cursor:"pointer",opacity:bidding?0.6:1}}>
              {bidding?"Bidding…":"Bid"}
            </button>
          </div>
          {isAdmin&&<button onClick={doCancelItem} style={{padding:"6px 14px",borderRadius:7,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.06)",color:"#ef4444",fontSize:11,fontWeight:700,cursor:"pointer"}}>Cancel nomination (admin)</button>}
          <div style={{marginTop:14,paddingTop:12,borderTop:"1px solid #222233"}}>
            <div style={{fontSize:10,fontWeight:700,color:"#6a6a7e",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:8}}>Bids</div>
            {bids.length===0&&<div style={{fontSize:12,color:"#6a6a7e"}}>No bids yet.</div>}
            {bids.map(b=>(
              <div key={b.id} style={{display:"flex",justifyContent:"space-between",fontSize:12,padding:"4px 0",color:"#8a8a9e"}}>
                <span>{nameFor(b.user_id)}</span>
                <span style={{fontFamily:"monospace",color:"#d4a843"}}>${b.amount}M</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {draftSession.status==="active"&&!activeItem&&!isMyTurn&&(
        <div style={{padding:16,borderRadius:10,background:"#0e0e16",border:"1px solid #222233",marginBottom:16,textAlign:"center",color:"#6a6a7e",fontSize:13}}>
          Waiting for {nameFor(currentUserId)} to nominate a film…
          {isAdmin&&<div style={{marginTop:10}}><button onClick={doPass} style={{padding:"6px 14px",borderRadius:7,border:"1px solid #222233",background:"transparent",color:"#6a6a7e",fontSize:11,fontWeight:700,cursor:"pointer"}}>Skip their turn (admin)</button></div>}
        </div>
      )}

      {budgets.length>0&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
        {budgets.map(b=>(
          <div key={b.user_id} style={{padding:"8px 10px",borderRadius:7,background:"#111119",border:"1px solid #1a1a28",fontSize:12}}>
            <div style={{color:"#e8e8f0",fontWeight:600}}>{b.team_name}</div>
            <div style={{color:"#6a6a7e",fontFamily:"monospace"}}>${b.remaining}M left of ${b.budget}M</div>
          </div>
        ))}
      </div>}

      <div>
        <div style={{fontSize:11,fontWeight:700,color:"#6a6a7e",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>History</div>
        {history.length===0&&<div style={{fontSize:12,color:"#6a6a7e"}}>Nothing resolved yet.</div>}
        {history.map(h=>(
          <div key={h.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:"#111119",border:"1px solid #1a1a28",borderRadius:6,marginBottom:4}}>
            <div style={{flex:1,fontSize:12,color:"#e8e8f0"}}>{h.universe_films?.title||h.imdb_id}</div>
            <div style={{fontSize:11,color:h.status==="sold"?"#34d399":h.status==="unsold"?"#f59e0b":"#6a6a7e",fontFamily:"monospace"}}>{h.status==="sold"?`${nameFor(h.current_high_bidder)} — $${h.current_high_bid}M`:h.status}</div>
          </div>
        ))}
      </div>

      {isAdmin&&draftSession.status==="active"&&!activeItem&&(
        <div style={{marginTop:16,textAlign:"right"}}>
          <button onClick={doEndDraft} style={{padding:"8px 16px",borderRadius:7,border:"1px solid rgba(239,68,68,0.3)",background:"rgba(239,68,68,0.06)",color:"#ef4444",fontSize:12,fontWeight:700,cursor:"pointer"}}>End Draft (admin)</button>
        </div>
      )}
    </div>
  );
}

// ─── MANAGE TAB (Admin only) ──────────────────────────────────────────────────
function ManageTab({leagueContext, members, userMembership, draftSession, refreshDraftSession, onGoToDraftRoom}){
  const l = leagueContext || {};
  const[draftStatus,setDraftStatus]=React.useState(l.draft_status||'open');
  const[editingRules,setEditingRules]=React.useState(false);
  const[saving,setSaving]=React.useState(false);
  const[rulesMsg,setRulesMsg]=React.useState(null);
  const[rules,setRules]=React.useState({
    budget: l.budget||500,
    min_bid: l.min_bid||10,
    max_bid: l.max_bid||'',
    oscar_nom_bonus: l.oscar_nom_bonus||25,
    oscar_win_bonus: l.oscar_win_bonus||25,
    bp_bonus: l.bp_bonus||50,
    festival_picks: l.festival_picks!==false,
    num_players: l.num_players||5,
    sacko_punishment: l.sacko_punishment||'',
  });

  const[acqEnabled,setAcqEnabled]=React.useState(l.acquisitions_enabled||false);
  const[acqSettings,setAcqSettings]=React.useState({
    acq_budget_default: l.acq_budget_default||50,
    acq_min_bid: l.acq_min_bid||20,
    acq_refund_rate: l.acq_refund_rate!=null?l.acq_refund_rate:0.25,
  });
  const[acqSaving,setAcqSaving]=React.useState(false);
  const[acqMsg,setAcqMsg]=React.useState(null);

  async function toggleAcquisitions(){
    const newVal=!acqEnabled;
    setAcqSaving(true); setAcqMsg(null);
    const session=getSession();
    const res=await fetch(`${SUPABASE_URL}/rest/v1/leagues?id=eq.${LEAGUE_UUID}`,{
      method:'PATCH',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${session?.access_token||SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({acquisitions_enabled:newVal})
    });
    setAcqSaving(false);
    if(res.ok){ setAcqEnabled(newVal); setAcqMsg({text:newVal?'Acquisitions enabled — reload to see the new tab.':'Acquisitions disabled.',error:false}); }
    else setAcqMsg({text:'Failed to update',error:true});
  }

  async function saveAcqSettings(){
    setAcqSaving(true); setAcqMsg(null);
    const session=getSession();
    const res=await fetch(`${SUPABASE_URL}/rest/v1/leagues?id=eq.${LEAGUE_UUID}`,{
      method:'PATCH',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${session?.access_token||SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({
        acq_budget_default:Number(acqSettings.acq_budget_default)||50,
        acq_min_bid:Number(acqSettings.acq_min_bid)||20,
        acq_refund_rate:Number(acqSettings.acq_refund_rate)||0.25,
      })
    });
    setAcqSaving(false);
    setAcqMsg(res.ok?{text:'Acquisitions settings saved.',error:false}:{text:'Failed to save',error:true});
  }

  async function toggleDraft(){
    const newStatus = draftStatus==='open'?'locked':'open';
    const session=getSession();
    const res=await fetch(`${SUPABASE_URL}/rest/v1/leagues?id=eq.${LEAGUE_UUID}`,{
      method:'PATCH',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${session?.access_token||SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({draft_status:newStatus})
    });
    if(res.ok) setDraftStatus(newStatus);
  }

  async function saveRules(){
    setSaving(true); setRulesMsg(null);
    const session=getSession();
    const payload={
      budget:Number(rules.budget)||500,
      min_bid:Number(rules.min_bid)||10,
      max_bid:rules.max_bid?Number(rules.max_bid):null,
      oscar_nom_bonus:Number(rules.oscar_nom_bonus)||25,
      oscar_win_bonus:Number(rules.oscar_win_bonus)||25,
      bp_bonus:Number(rules.bp_bonus)||50,
      festival_picks:rules.festival_picks,
      num_players:Number(rules.num_players)||5,
      sacko_punishment:rules.sacko_punishment.trim()||null,
    };
    const res=await fetch(`${SUPABASE_URL}/rest/v1/leagues?id=eq.${LEAGUE_UUID}`,{
      method:'PATCH',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${session?.access_token||SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(payload)
    });
    setSaving(false);
    if(res.ok){
      setRulesMsg({text:'Rules saved. Reload to see updated Rules tab.',error:false});
      setEditingRules(false);
    } else {
      setRulesMsg({text:'Failed to save rules.',error:true});
    }
  }

  async function copyInviteCode(){
    const inviteUrl=`${window.location.origin}/join?code=${l.invite_code}`;
    try{await navigator.clipboard.writeText(inviteUrl);}catch(e){}
  }

  // ── Public view-only link ──────────────────────────────────────────────
  const[isPublic,setIsPublic]=React.useState(!!l.is_public);
  const[shareToken,setShareToken]=React.useState(l.share_token||null);
  const[publicSaving,setPublicSaving]=React.useState(false);
  const[publicMsg,setPublicMsg]=React.useState(null);

  function generateShareToken(){
    const bytes=new Uint8Array(9);
    crypto.getRandomValues(bytes);
    return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  async function patchLeaguePublic(payload){
    const session=getSession();
    return fetch(`${SUPABASE_URL}/rest/v1/leagues?id=eq.${LEAGUE_UUID}`,{
      method:'PATCH',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${session?.access_token||SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(payload)
    });
  }

  async function togglePublicView(){
    setPublicSaving(true); setPublicMsg(null);
    const newVal=!isPublic;
    const token=shareToken||generateShareToken();
    const res=await patchLeaguePublic({is_public:newVal, share_token:token});
    setPublicSaving(false);
    if(res.ok){
      setIsPublic(newVal);
      setShareToken(token);
      setPublicMsg({text:newVal?'Public view enabled.':'Public view disabled — the old link stops working immediately.',error:false});
    } else {
      setPublicMsg({text:"Couldn't update — has the public-view database migration been run yet?",error:true});
    }
  }

  async function regenerateShareToken(){
    setPublicSaving(true); setPublicMsg(null);
    const token=generateShareToken();
    const res=await patchLeaguePublic({share_token:token});
    setPublicSaving(false);
    if(res.ok){
      setShareToken(token);
      setPublicMsg({text:'Link regenerated — the old link no longer works.',error:false});
    } else {
      setPublicMsg({text:'Failed to regenerate the link.',error:true});
    }
  }

  async function copyPublicLink(){
    const url=`${window.location.origin}/league?id=${LEAGUE_UUID}&view=${shareToken}`;
    try{await navigator.clipboard.writeText(url); setPublicMsg({text:'Link copied.',error:false});}catch(e){}
  }

  // ── Add Picks (draft entry, sourced from the Universe list) ────────────
  const[picksOpen,setPicksOpen]=React.useState(false);
  const[picksLoading,setPicksLoading]=React.useState(false);
  const[picksLoadError,setPicksLoadError]=React.useState(null);
  const[universeFilms,setUniverseFilms]=React.useState([]);
  const[picksList,setPicksList]=React.useState([]);
  const[pickSearch,setPickSearch]=React.useState('');
  const[isPlaceholder,setIsPlaceholder]=React.useState(false);
  const[selectedFilm,setSelectedFilm]=React.useState(null);
  const[customTitle,setCustomTitle]=React.useState('');
  const[customRelease,setCustomRelease]=React.useState('');
  const[pickTeam,setPickTeam]=React.useState(members[0]?.team_name||'');
  const[pickBid,setPickBid]=React.useState('');
  const[pickSaving,setPickSaving]=React.useState(false);
  const[pickMsg,setPickMsg]=React.useState(null);
  // Resolving a blind Festival Futures placeholder (e.g. "Palme d'Or
  // Winner") into the real film once it's known -- a prerequisite for
  // Acquisitions' refund rules, which need imdb_id is not null to mean
  // "this pick has resolved to a real film."
  const[resolvingPickId,setResolvingPickId]=React.useState(null);
  const[resolveSearch,setResolveSearch]=React.useState('');
  const[resolveSelectedFilm,setResolveSelectedFilm]=React.useState(null);
  const[resolveSaving,setResolveSaving]=React.useState(false);

  // Same normalization as universe.html's normTitle() -- this repo has no
  // shared-module mechanism (every .html file is self-contained), so this
  // one small pure function is intentionally duplicated rather than adding
  // build/bundling infrastructure just to share it.
  function normTitle(t){
    return (t||'').toLowerCase()
      .replace(/^(the |a |an )/, '')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();
  }

  // Films released outside this league's own season window are still shown
  // in search (a real film can matter for other reasons -- e.g. an admin
  // fixing a mis-drafted pick), just visually flagged and requiring an
  // explicit Override click instead of a plain click-to-select. Client-side
  // only, not enforced server-side: this whole Add Picks flow is
  // admin-only already (league_picks INSERT is RLS-gated to league admins,
  // migration 012), so an admin bypassing this guardrail isn't a security
  // concern the way it would be for a player-facing draft flow.
  const seasonWindow=seasonWindowFor(leagueContext?.season);
  function isOutOfSeason(releaseDate){
    if(!seasonWindow||!releaseDate) return false;
    return releaseDate<seasonWindow.start||releaseDate>seasonWindow.end;
  }

  async function loadUniverseAndPicks(){
    setPicksLoading(true); setPicksLoadError(null);
    try{
      const [uf, lp] = await Promise.all([
        supabaseFetch("universe_films", "select=id,title,imdb_id,release_date&order=release_date.asc.nullslast"),
        supabaseFetch("league_picks", `league_id=eq.${LEAGUE_UUID}&select=*,universe_films(title)`),
      ]);
      setUniverseFilms(uf||[]);
      setPicksList(lp||[]);
    } catch(e){
      console.error("[league_picks] failed to load:", e.message);
      setPicksLoadError("Couldn't load — has the league_picks migration been run yet?");
    }
    setPicksLoading(false);
  }

  function openPicksSection(){
    setPicksOpen(true);
    if(universeFilms.length===0) loadUniverseAndPicks();
  }

  function getVisiblePickCandidates(){
    const already=new Set(picksList.filter(p=>p.imdb_id).map(p=>p.imdb_id));
    let list=universeFilms.filter(f=>!already.has(f.imdb_id));
    if(pickSearch.trim()){
      const normed=normTitle(pickSearch);
      list=list.filter(f=>normTitle(f.title).includes(normed));
    }
    return list.slice(0,50);
  }

  async function savePick(){
    setPickMsg(null);
    if(!pickTeam){ setPickMsg({text:'Pick a team.',error:true}); return; }
    const bidNum=Number(pickBid);
    if(!pickBid || isNaN(bidNum) || bidNum<=0){ setPickMsg({text:'Enter a valid bid.',error:true}); return; }

    let payload;
    if(isPlaceholder){
      if(!customTitle.trim()){ setPickMsg({text:'Placeholder picks need a title.',error:true}); return; }
      payload={ league_id:LEAGUE_UUID, imdb_id:null, team_name:pickTeam, bid:bidNum, title:customTitle.trim(), release_date:customRelease||null };
    } else {
      if(!selectedFilm){ setPickMsg({text:'Pick a film first.',error:true}); return; }
      payload={ league_id:LEAGUE_UUID, imdb_id:selectedFilm.imdb_id, team_name:pickTeam, bid:bidNum };
    }

    setPickSaving(true);
    const session=getSession();
    const res=await fetch(`${SUPABASE_URL}/rest/v1/league_picks`,{
      method:'POST',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${session?.access_token||SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(payload)
    });
    setPickSaving(false);
    if(res.ok){
      setPickMsg({text:'Pick added. Reload the page to see it reflected in Standings/Calendar.',error:false});
      setSelectedFilm(null); setPickSearch(''); setCustomTitle(''); setCustomRelease(''); setPickBid('');
      loadUniverseAndPicks();
    } else {
      setPickMsg({text:"Failed to save — has the league_picks migration been run yet?",error:true});
    }
  }

  async function deletePick(id){
    const session=getSession();
    const res=await fetch(`${SUPABASE_URL}/rest/v1/league_picks?id=eq.${id}`,{
      method:'DELETE',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${session?.access_token||SUPABASE_ANON_KEY}`}
    });
    if(res.ok) setPicksList(pl=>pl.filter(p=>p.id!==id));
  }

  function getVisibleResolveCandidates(){
    const already=new Set(picksList.filter(p=>p.imdb_id).map(p=>p.imdb_id));
    let list=universeFilms.filter(f=>!already.has(f.imdb_id));
    if(resolveSearch.trim()){
      const normed=normTitle(resolveSearch);
      list=list.filter(f=>normTitle(f.title).includes(normed));
    }
    return list.slice(0,50);
  }

  function openResolvePlaceholder(pickId){
    setResolvingPickId(pickId);
    setResolveSearch(''); setResolveSelectedFilm(null);
  }

  // Turns a blind placeholder pick (imdb_id is null, e.g. "Palme d'Or
  // Winner") into the real film once it's known. Clears title/release_date
  // since those only exist to display a placeholder -- once imdb_id is set,
  // the join to universe_films is the source of truth for both.
  async function resolvePlaceholder(pickId){
    if(!resolveSelectedFilm) return;
    setResolveSaving(true);
    const session=getSession();
    const res=await fetch(`${SUPABASE_URL}/rest/v1/league_picks?id=eq.${pickId}`,{
      method:'PATCH',
      headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':`Bearer ${session?.access_token||SUPABASE_ANON_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({imdb_id:resolveSelectedFilm.imdb_id, title:null, release_date:null})
    });
    setResolveSaving(false);
    if(res.ok){
      setResolvingPickId(null); setResolveSelectedFilm(null); setResolveSearch('');
      loadUniverseAndPicks();
    } else {
      setPickMsg({text:'Failed to resolve placeholder — try again.',error:true});
    }
  }

  const inp={width:'100%',padding:'8px 10px',background:'#1a1a28',border:'1px solid #222233',borderRadius:6,color:'#e8e8f0',fontSize:13,fontFamily:"'Helvetica Neue',sans-serif",outline:'none',boxSizing:'border-box'};

  return(
    <div style={{display:'flex',flexDirection:'column',gap:12}}>

      {/* Draft Control */}
      <div style={{background:'#111119',border:'1px solid #222233',borderRadius:10,padding:'16px 14px'}}>
        <div style={{fontSize:12,fontWeight:700,color:'#d4a843',letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:14}}>Draft Control</div>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
          <div>
            <div style={{fontSize:13,fontWeight:600,color:'#e8e8f0',marginBottom:4}}>Draft Status</div>
            <div style={{fontSize:12,color:'#6a6a7e'}}>
              Currently: <span style={{color:draftStatus==='open'?'#34d399':'#f59e0b',fontWeight:700}}>{draftStatus==='open'?'Open':'Locked'}</span>
            </div>
          </div>
          <button onClick={toggleDraft} style={{padding:'8px 18px',borderRadius:7,border:`1px solid ${draftStatus==='open'?'rgba(239,68,68,0.3)':'rgba(52,211,153,0.3)'}`,background:draftStatus==='open'?'rgba(239,68,68,0.1)':'rgba(52,211,153,0.1)',color:draftStatus==='open'?'#ef4444':'#34d399',fontSize:12,fontWeight:700,cursor:'pointer'}}>
            {draftStatus==='open'?'Lock Draft':'Reopen Draft'}
          </button>
        </div>
      </div>

      <DraftSetupCard leagueContext={leagueContext} members={members} draftSession={draftSession} refreshDraftSession={refreshDraftSession} onGoToDraftRoom={onGoToDraftRoom}/>

      {/* Acquisitions */}
      <div style={{background:'#111119',border:'1px solid #222233',borderRadius:10,padding:'16px 14px'}}>
        <div style={{fontSize:12,fontWeight:700,color:'#d4a843',letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:14}}>Acquisitions</div>
        {acqMsg&&<div style={{padding:'8px 12px',borderRadius:6,fontSize:12,marginBottom:12,background:acqMsg.error?'rgba(239,68,68,0.08)':'rgba(52,211,153,0.08)',border:`1px solid ${acqMsg.error?'rgba(239,68,68,0.2)':'rgba(52,211,153,0.2)'}`,color:acqMsg.error?'#ef4444':'#34d399'}}>{acqMsg.text}</div>}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,marginBottom:acqEnabled?16:0}}>
          <div>
            <div style={{fontSize:13,fontWeight:600,color:'#e8e8f0',marginBottom:4}}>Enable Acquisitions</div>
            <div style={{fontSize:12,color:'#6a6a7e'}}>Weekly waiver-wire market — declare Fri-Tue, bid Wednesday. Off by default; safe to turn on for a duplicated/test league without affecting anyone else.</div>
          </div>
          <label style={{width:40,height:22,borderRadius:11,border:'none',background:acqEnabled?'#34d399':'#3a3a50',cursor:'pointer',position:'relative',transition:'background 0.2s',flexShrink:0}} onClick={toggleAcquisitions}>
            <div style={{width:16,height:16,borderRadius:'50%',background:'#fff',position:'absolute',top:3,left:acqEnabled?20:3,transition:'left 0.2s'}}/>
          </label>
        </div>
        {acqEnabled&&<>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10,marginBottom:12}}>
            <div>
              <label style={{fontSize:10,color:'#6a6a7e',textTransform:'uppercase',letterSpacing:'0.06em',display:'block',marginBottom:5}}>Starting Budget ($M)</label>
              <input type="number" value={acqSettings.acq_budget_default} onChange={e=>setAcqSettings(s=>({...s,acq_budget_default:e.target.value}))}
                style={{width:'100%',padding:'8px 10px',borderRadius:6,border:'1px solid #2a2a3a',background:'#0e0e16',color:'#e8e8f0',fontSize:13,boxSizing:'border-box'}}/>
            </div>
            <div>
              <label style={{fontSize:10,color:'#6a6a7e',textTransform:'uppercase',letterSpacing:'0.06em',display:'block',marginBottom:5}}>Min Bid ($M)</label>
              <input type="number" value={acqSettings.acq_min_bid} onChange={e=>setAcqSettings(s=>({...s,acq_min_bid:e.target.value}))}
                style={{width:'100%',padding:'8px 10px',borderRadius:6,border:'1px solid #2a2a3a',background:'#0e0e16',color:'#e8e8f0',fontSize:13,boxSizing:'border-box'}}/>
            </div>
            <div>
              <label style={{fontSize:10,color:'#6a6a7e',textTransform:'uppercase',letterSpacing:'0.06em',display:'block',marginBottom:5}}>Refund Rate (0-1)</label>
              <input type="number" step="0.05" value={acqSettings.acq_refund_rate} onChange={e=>setAcqSettings(s=>({...s,acq_refund_rate:e.target.value}))}
                style={{width:'100%',padding:'8px 10px',borderRadius:6,border:'1px solid #2a2a3a',background:'#0e0e16',color:'#e8e8f0',fontSize:13,boxSizing:'border-box'}}/>
            </div>
          </div>
          <button onClick={saveAcqSettings} disabled={acqSaving} style={{padding:'7px 16px',borderRadius:7,border:'none',background:'#d4a843',color:'#0d0d14',fontSize:12,fontWeight:700,cursor:'pointer',opacity:acqSaving?0.7:1}}>
            {acqSaving?'Saving...':'Save Acquisitions Settings'}
          </button>
        </>}
      </div>

      {/* Add Picks */}
      <div style={{background:'#111119',border:'1px solid #222233',borderRadius:10,padding:'16px 14px'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:picksOpen?14:0}}>
          <div style={{fontSize:12,fontWeight:700,color:'#d4a843',letterSpacing:'0.08em',textTransform:'uppercase'}}>Add Picks</div>
          {!picksOpen&&<button onClick={openPicksSection} style={{padding:'5px 14px',borderRadius:6,border:'1px solid #222233',background:'transparent',color:'#6a6a7e',fontSize:11,fontWeight:600,cursor:'pointer'}}>Manage Picks</button>}
        </div>
        {picksOpen&&<>
          <div style={{fontSize:12,color:'#6a6a7e',marginBottom:14}}>Draft films from the Universe list, or add a Festival Futures placeholder for a not-yet-announced winner.</div>
          {picksLoading?(
            <div style={{fontSize:12,color:'#6a6a7e'}}>Loading…</div>
          ):picksLoadError?(
            <div style={{padding:'8px 12px',borderRadius:6,fontSize:12,background:'rgba(239,68,68,0.08)',border:'1px solid rgba(239,68,68,0.2)',color:'#ef4444'}}>{picksLoadError}</div>
          ):(<>
            <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',marginBottom:10}}>
              <label style={{fontSize:13,color:'#e8e8f0',flex:1}}>{isPlaceholder?'Festival Futures Placeholder':'Real Film'}</label>
              <button onClick={()=>{setIsPlaceholder(p=>!p);setSelectedFilm(null);setPickSearch('');}}
                style={{width:40,height:22,borderRadius:11,border:'none',background:isPlaceholder?'#34d399':'#3a3a50',cursor:'pointer',position:'relative',transition:'background 0.2s',flexShrink:0}}>
                <div style={{width:16,height:16,borderRadius:'50%',background:'#fff',position:'absolute',top:3,left:isPlaceholder?20:3,transition:'left 0.2s'}}/>
              </button>
            </div>

            {!isPlaceholder?(
              <div style={{marginBottom:10}}>
                <input style={inp} placeholder="Search Universe films…" value={pickSearch} onChange={e=>{setPickSearch(e.target.value);setSelectedFilm(null);}}/>
                {pickSearch.trim()&&!selectedFilm&&(
                  <div style={{maxHeight:160,overflowY:'auto',marginTop:6,background:'#1a1a28',borderRadius:6,border:'1px solid #222233'}}>
                    {getVisiblePickCandidates().map(f=>{
                      const oos=isOutOfSeason(f.release_date);
                      return (
                        <div key={f.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',fontSize:13,borderBottom:'1px solid #222233',opacity:oos?0.5:1}}
                          onMouseEnter={e=>{if(!oos)e.currentTarget.style.background='#222233';}}
                          onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                          <div onClick={()=>{if(!oos){setSelectedFilm(f);setPickSearch(f.title);}}}
                            style={{flex:1,minWidth:0,color:'#e8e8f0',cursor:oos?'default':'pointer'}}>
                            {f.title} <span style={{color:'#6a6a7e',fontSize:11}}>{f.release_date||'no date yet'}</span>
                            {oos&&<span style={{marginLeft:6,fontSize:9,color:'#f59e0b',border:'1px solid rgba(245,158,11,0.35)',borderRadius:4,padding:'1px 5px',whiteSpace:'nowrap'}}>Out of season</span>}
                          </div>
                          {oos&&<button onClick={()=>{setSelectedFilm(f);setPickSearch(f.title);}}
                            style={{fontSize:10,padding:'3px 8px',borderRadius:5,border:'1px solid rgba(245,158,11,0.4)',background:'rgba(245,158,11,0.1)',color:'#f59e0b',cursor:'pointer',flexShrink:0}}>
                            Override
                          </button>}
                        </div>
                      );
                    })}
                    {getVisiblePickCandidates().length===0&&<div style={{padding:'8px 12px',fontSize:12,color:'#6a6a7e'}}>No matches (or already drafted in this league).</div>}
                  </div>
                )}
                {selectedFilm&&<div style={{fontSize:11,color:'#34d399',marginTop:4}}>Selected: {selectedFilm.title}</div>}
              </div>
            ):(
              <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:10,marginBottom:10}}>
                <input style={inp} placeholder="e.g. Palme d'Or Winner" value={customTitle} onChange={e=>setCustomTitle(e.target.value)}/>
                <input style={inp} type="date" value={customRelease} onChange={e=>setCustomRelease(e.target.value)}/>
              </div>
            )}

            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:10}}>
              <select style={{...inp,cursor:'pointer'}} value={pickTeam} onChange={e=>setPickTeam(e.target.value)}>
                {members.map(m=><option key={m.id} value={m.team_name}>{m.team_name}</option>)}
              </select>
              <input style={inp} type="number" placeholder="Bid ($M)" value={pickBid} onChange={e=>setPickBid(e.target.value)} min="0"/>
            </div>

            {pickMsg&&<div style={{padding:'8px 12px',borderRadius:6,fontSize:12,marginBottom:10,background:pickMsg.error?'rgba(239,68,68,0.08)':'rgba(52,211,153,0.08)',border:`1px solid ${pickMsg.error?'rgba(239,68,68,0.2)':'rgba(52,211,153,0.2)'}`,color:pickMsg.error?'#ef4444':'#34d399'}}>{pickMsg.text}</div>}

            <button onClick={savePick} disabled={pickSaving} style={{padding:'8px 16px',borderRadius:7,border:'none',background:'#d4a843',color:'#0d0d14',fontSize:12,fontWeight:700,cursor:'pointer',opacity:pickSaving?0.7:1,marginBottom:16}}>
              {pickSaving?'Saving...':'Add Pick'}
            </button>

            <div style={{fontSize:10,color:'#6a6a7e',textTransform:'uppercase',letterSpacing:'0.1em',marginBottom:8,borderTop:'1px solid #222233',paddingTop:14}}>Current Picks ({picksList.length})</div>
            <div style={{display:'flex',flexDirection:'column',gap:4,maxHeight:220,overflowY:'auto'}}>
              {picksList.map(p=>(
                <div key={p.id} style={{display:'flex',flexDirection:'column',gap:6,padding:'8px 10px',background:'#1a1a28',borderRadius:6}}>
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <div style={{flex:1,fontSize:12,color:'#e8e8f0'}}>{p.universe_films?.title||p.title||'—'}</div>
                    <div style={{fontSize:11,color:'#6a6a7e',fontFamily:'monospace'}}>{p.team_name}</div>
                    <div style={{fontSize:11,color:'#d4a843',fontFamily:'monospace'}}>${p.bid}M</div>
                    {!p.imdb_id&&(
                      <button onClick={()=>resolvingPickId===p.id?setResolvingPickId(null):openResolvePlaceholder(p.id)}
                        style={{background:'none',border:'1px solid #3a3a4e',borderRadius:5,color:'#6a6a7e',cursor:'pointer',padding:'3px 8px',fontSize:10}}>
                        {resolvingPickId===p.id?'Cancel':'Resolve'}
                      </button>
                    )}
                    <button onClick={()=>deletePick(p.id)} style={{background:'none',border:'none',color:'#6a6a7e',cursor:'pointer',padding:4}}>
                      <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M2.5 3.5h9M5.5 3.5V2a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v1.5M11 3.5l-.6 8.1a1 1 0 0 1-1 .9H4.6a1 1 0 0 1-1-.9L3 3.5" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                    </button>
                  </div>
                  {resolvingPickId===p.id&&(
                    <div style={{paddingTop:6,borderTop:'1px solid #222233'}}>
                      <div style={{fontSize:10,color:'#6a6a7e',marginBottom:6}}>Turn this placeholder into the real film once it's known.</div>
                      <input value={resolveSearch} onChange={e=>{setResolveSearch(e.target.value);setResolveSelectedFilm(null);}}
                        placeholder="Search Universe films…" style={{width:'100%',padding:'6px 10px',borderRadius:5,border:'1px solid #2a2a3a',background:'#0e0e16',color:'#e8e8f0',fontSize:12,marginBottom:6,boxSizing:'border-box'}}/>
                      {resolveSearch.trim()&&!resolveSelectedFilm&&(
                        <div style={{maxHeight:120,overflowY:'auto',background:'#0e0e16',border:'1px solid #2a2a3a',borderRadius:5,marginBottom:6}}>
                          {getVisibleResolveCandidates().map(f=>{
                            const oos=isOutOfSeason(f.release_date);
                            return (
                              <div key={f.id} style={{display:'flex',alignItems:'center',gap:6,padding:'6px 10px',fontSize:12,borderBottom:'1px solid #1a1a28',opacity:oos?0.5:1}}
                                onMouseEnter={e=>{if(!oos)e.currentTarget.style.background='#1a1a28';}}
                                onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                                <div onClick={()=>{if(!oos)setResolveSelectedFilm(f);}} style={{flex:1,minWidth:0,color:'#e8e8f0',cursor:oos?'default':'pointer'}}>
                                  {f.title}
                                  {oos&&<span style={{marginLeft:6,fontSize:9,color:'#f59e0b',border:'1px solid rgba(245,158,11,0.35)',borderRadius:4,padding:'1px 5px',whiteSpace:'nowrap'}}>Out of season</span>}
                                </div>
                                {oos&&<button onClick={()=>setResolveSelectedFilm(f)}
                                  style={{fontSize:9,padding:'2px 6px',borderRadius:4,border:'1px solid rgba(245,158,11,0.4)',background:'rgba(245,158,11,0.1)',color:'#f59e0b',cursor:'pointer',flexShrink:0}}>
                                  Override
                                </button>}
                              </div>
                            );
                          })}
                          {getVisibleResolveCandidates().length===0&&<div style={{padding:'8px 10px',fontSize:11,color:'#6a6a7e'}}>No matches (or already drafted in this league).</div>}
                        </div>
                      )}
                      {resolveSelectedFilm&&<div style={{fontSize:11,color:'#34d399',marginBottom:6}}>Selected: {resolveSelectedFilm.title}</div>}
                      <button onClick={()=>resolvePlaceholder(p.id)} disabled={!resolveSelectedFilm||resolveSaving}
                        style={{padding:'6px 14px',borderRadius:5,border:'none',background:'#d4a843',color:'#0d0d14',fontSize:11,fontWeight:700,cursor:'pointer',opacity:(!resolveSelectedFilm||resolveSaving)?0.6:1}}>
                        {resolveSaving?'Saving...':'Confirm Resolve'}
                      </button>
                    </div>
                  )}
                </div>
              ))}
              {picksList.length===0&&<div style={{fontSize:12,color:'#6a6a7e'}}>No picks yet.</div>}
            </div>
          </>)}
        </>}
      </div>

      {/* League Rules */}
      <div style={{background:'#111119',border:'1px solid #222233',borderRadius:10,padding:'16px 14px'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
          <div style={{fontSize:12,fontWeight:700,color:'#d4a843',letterSpacing:'0.08em',textTransform:'uppercase'}}>League Rules</div>
          {!editingRules
            ?<button onClick={()=>setEditingRules(true)} style={{padding:'5px 14px',borderRadius:6,border:'1px solid #222233',background:'transparent',color:'#6a6a7e',fontSize:11,fontWeight:600,cursor:'pointer',display:'flex',alignItems:'center',gap:5}}><svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M8 2l2 2-6 6H2V8l6-6z" stroke="currentColor" strokeWidth="1.2" strokeLinejoin="round"/></svg> Edit Rules</button>
            :<div style={{display:'flex',gap:6}}>
              <button onClick={()=>{setEditingRules(false);setRulesMsg(null);}} style={{padding:'5px 12px',borderRadius:6,border:'1px solid #222233',background:'transparent',color:'#6a6a7e',fontSize:11,cursor:'pointer'}}>Cancel</button>
              <button onClick={saveRules} disabled={saving} style={{padding:'5px 14px',borderRadius:6,border:'none',background:'#d4a843',color:'#0d0d14',fontSize:11,fontWeight:700,cursor:'pointer',opacity:saving?0.7:1}}>{saving?'Saving...':'Save Rules'}</button>
            </div>
          }
        </div>
        {rulesMsg&&<div style={{padding:'8px 12px',borderRadius:6,fontSize:12,marginBottom:12,background:rulesMsg.error?'rgba(239,68,68,0.08)':'rgba(52,211,153,0.08)',border:`1px solid ${rulesMsg.error?'rgba(239,68,68,0.2)':'rgba(52,211,153,0.2)'}`,color:rulesMsg.error?'#ef4444':'#34d399'}}>{rulesMsg.text}</div>}
        {!editingRules?(
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))',gap:10}}>
            {[
              ['Budget',`$${rules.budget}M`],
              ['Players',rules.num_players],
              ['Min Bid',`$${rules.min_bid}M`],
              ['Max Bid',rules.max_bid?`$${rules.max_bid}M`:'Uncapped'],
              ['Nom Bonus',`$${rules.oscar_nom_bonus}M`],
              ['Win Bonus',`$${rules.oscar_win_bonus}M`],
              ['Best Picture',`$${rules.bp_bonus}M`],
              ['Festivals',rules.festival_picks?'On':'Off'],
            ].map(([label,val])=>(
              <div key={label} style={{background:'#1a1a28',borderRadius:7,padding:'10px 12px'}}>
                <div style={{fontFamily:'monospace',fontSize:14,fontWeight:700,color:'#d4a843'}}>{val}</div>
                <div style={{fontSize:9,color:'#6a6a7e',textTransform:'uppercase',letterSpacing:'0.1em',marginTop:2}}>{label}</div>
              </div>
            ))}
            <div style={{background:'#1a1a28',borderRadius:7,padding:'10px 12px',gridColumn:'1/-1'}}>
              <div style={{fontSize:13,color:rules.sacko_punishment?'#e8e8f0':'#6a6a7e',fontStyle:rules.sacko_punishment?'normal':'italic'}}>{rules.sacko_punishment||'No sacko punishment set yet.'}</div>
              <div style={{fontSize:9,color:'#6a6a7e',textTransform:'uppercase',letterSpacing:'0.1em',marginTop:4}}>Sacko Punishment</div>
            </div>
          </div>
        ):(
          <div>
            <div style={{fontSize:10,color:'#f59e0b',padding:'8px 12px',background:'rgba(245,158,11,0.06)',border:'1px solid rgba(245,158,11,0.2)',borderRadius:6,marginBottom:12}}>
               Changing rules mid-season affects all players. Make sure everyone is aware before saving.
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
              {[
                ['Budget ($M)','budget'],['Min Bid ($M)','min_bid'],
                ['Max Bid ($M, blank=uncapped)','max_bid'],['Nom Bonus ($M)','oscar_nom_bonus'],
                ['Win Bonus ($M)','oscar_win_bonus'],['Best Picture Bonus ($M)','bp_bonus'],
                ['Number of Players','num_players'],
              ].map(([label,key])=>(
                <div key={key}>
                  <label style={{display:'block',fontSize:9,color:'#6a6a7e',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:5}}>{label}</label>
                  <input type="number" style={inp} value={rules[key]} onChange={e=>setRules(r=>({...r,[key]:e.target.value}))} min="0"/>
                </div>
              ))}
              <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0'}}>
                <label style={{fontSize:13,color:'#e8e8f0',flex:1}}>Festival Futures</label>
                <button onClick={()=>setRules(r=>({...r,festival_picks:!r.festival_picks}))}
                  style={{width:40,height:22,borderRadius:11,border:'none',background:rules.festival_picks?'#34d399':'#3a3a50',cursor:'pointer',position:'relative',transition:'background 0.2s',flexShrink:0}}>
                  <div style={{width:16,height:16,borderRadius:'50%',background:'#fff',position:'absolute',top:3,left:rules.festival_picks?20:3,transition:'left 0.2s'}}/>
                </button>
              </div>
              <div style={{gridColumn:'1/-1'}}>
                <label style={{display:'block',fontSize:9,color:'#6a6a7e',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:5}}>Sacko Punishment <span style={{textTransform:'none',letterSpacing:'normal'}}>(what last place has to do)</span></label>
                <textarea style={{...inp,minHeight:64,resize:'vertical',fontFamily:"'Helvetica Neue',sans-serif"}} value={rules.sacko_punishment} onChange={e=>setRules(r=>({...r,sacko_punishment:e.target.value}))} placeholder="e.g. Wear the Sacko hat to the next draft night"/>
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Members */}
      <div style={{background:'#111119',border:'1px solid #222233',borderRadius:10,padding:'16px 14px'}}>
        <div style={{fontSize:12,fontWeight:700,color:'#d4a843',letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:14}}>Members ({members.length})</div>
        <div style={{display:'flex',flexDirection:'column',gap:4}}>
          {members.map((m,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 12px',background:'#1a1a28',borderRadius:6}}>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600,color:'#e8e8f0'}}>{m.profile?.display_name||m.profile?.email||'—'}</div>
                <div style={{fontSize:11,color:'#6a6a7e',fontFamily:'monospace'}}>{m.team_name||'—'}</div>
              </div>
              <div style={{padding:'2px 8px',borderRadius:4,fontSize:10,fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase',
                background:m.role==='admin'?'rgba(212,168,67,0.1)':'rgba(52,211,153,0.1)',
                color:m.role==='admin'?'#d4a843':'#34d399',
                border:`1px solid ${m.role==='admin'?'rgba(212,168,67,0.25)':'rgba(52,211,153,0.25)'}`
              }}>{m.role}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Invite */}
      <div style={{background:'#111119',border:'1px solid #222233',borderRadius:10,padding:'16px 14px'}}>
        <div style={{fontSize:12,fontWeight:700,color:'#d4a843',letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:10}}>Invite Link</div>
        <div style={{display:'flex',alignItems:'center',gap:12,background:'#1a1a28',borderRadius:7,padding:'14px 16px'}}>
          <div style={{fontFamily:'monospace',fontSize:13,color:'#d4a843',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{window.location.origin}/join?code={l.invite_code||'—'}</div>
          <button onClick={copyInviteCode} style={{padding:'6px 12px',borderRadius:5,border:'1px solid #222233',background:'transparent',color:'#6a6a7e',fontSize:11,cursor:'pointer',fontFamily:'monospace',flexShrink:0}}>Copy</button>
        </div>
      </div>

      {/* Public View Link */}
      <div style={{background:'#111119',border:'1px solid #222233',borderRadius:10,padding:'16px 14px'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>
          <div style={{fontSize:12,fontWeight:700,color:'#d4a843',letterSpacing:'0.08em',textTransform:'uppercase'}}>Public View Link</div>
          <button onClick={togglePublicView} disabled={publicSaving}
            style={{width:40,height:22,borderRadius:11,border:'none',background:isPublic?'#34d399':'#3a3a50',cursor:'pointer',position:'relative',transition:'background 0.2s',flexShrink:0,opacity:publicSaving?0.6:1}}>
            <div style={{width:16,height:16,borderRadius:'50%',background:'#fff',position:'absolute',top:3,left:isPublic?20:3,transition:'left 0.2s'}}/>
          </button>
        </div>
        <div style={{fontSize:12,color:'#6a6a7e',marginBottom:12}}>
          Anyone with this link can view standings, calendar, and rules — no account needed. They can't join, submit picks, or see Manage/Settings.
        </div>
        {publicMsg&&<div style={{padding:'8px 12px',borderRadius:6,fontSize:12,marginBottom:12,background:publicMsg.error?'rgba(239,68,68,0.08)':'rgba(52,211,153,0.08)',border:`1px solid ${publicMsg.error?'rgba(239,68,68,0.2)':'rgba(52,211,153,0.2)'}`,color:publicMsg.error?'#ef4444':'#34d399'}}>{publicMsg.text}</div>}
        {isPublic&&shareToken&&<div style={{display:'flex',alignItems:'center',gap:12,background:'#1a1a28',borderRadius:7,padding:'14px 16px'}}>
          <div style={{fontFamily:'monospace',fontSize:13,color:'#d4a843',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{window.location.origin}/league?id={LEAGUE_UUID}&view={shareToken}</div>
          <button onClick={copyPublicLink} style={{padding:'6px 12px',borderRadius:5,border:'1px solid #222233',background:'transparent',color:'#6a6a7e',fontSize:11,cursor:'pointer',fontFamily:'monospace',flexShrink:0}}>Copy</button>
          <button onClick={regenerateShareToken} disabled={publicSaving} style={{padding:'6px 12px',borderRadius:5,border:'1px solid #222233',background:'transparent',color:'#6a6a7e',fontSize:11,cursor:'pointer',fontFamily:'monospace',flexShrink:0}}>Regenerate</button>
        </div>}
      </div>

    </div>
  );
}


function SettingsPanel({membership, leagueCtx, onClose}){
  const session = getSession();
  const[tab,setTab]=useState("league");
  const[studioName,setStudioName]=useState(membership?.team_name||"");
  const[teamColor,setTeamColor]=useState(membership?.color||"");
  const[saving,setSaving]=useState(false);
  const[msg,setMsg]=useState(null); // {text, error}
  const[notifPrefs,setNotifPrefs]=useState(null);
  const[notifLoading,setNotifLoading]=useState(false);

  useEffect(()=>{
    if(tab!=="notifications"||notifPrefs||!session?.user?.id) return;
    setNotifLoading(true);
    supabaseFetch("notification_preferences",`user_id=eq.${session.user.id}`)
      .then(rows=>{
        setNotifPrefs(rows&&rows[0]?rows[0]:{notify_declarations:true,notify_new_leader:true,notify_new_film:true,notify_release_day:true});
      })
      .catch(()=>setNotifPrefs({notify_declarations:true,notify_new_leader:true,notify_new_film:true,notify_release_day:true}))
      .finally(()=>setNotifLoading(false));
  },[tab]);

  async function toggleNotifPref(key){
    const next={...notifPrefs,[key]:!notifPrefs[key]};
    setNotifPrefs(next);
    const res=await fetch(`${SUPABASE_URL}/rest/v1/notification_preferences`,{
      method:"POST",
      headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${session?.access_token||SUPABASE_ANON_KEY}`,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify({user_id:session.user.id,...next})
    });
    if(!res.ok) setMsg({text:"Failed to save notification preference",error:true});
  }

  async function saveStudioName(){
    setSaving(true); setMsg(null);
    if(!session||!membership) return;
    const newName = studioName.trim();
    if(!newName){ setMsg({text:"Studio name can't be empty",error:true}); setSaving(false); return; }
    // Goes through the rename_my_team() RPC (migration 016) rather than a
    // plain PATCH -- league_picks.team_name is a plain string match, not a
    // foreign key to league_members, so a rename needs to cascade into this
    // member's existing picks too or their already-drafted films silently
    // fall out of standings under the old name. A plain member can't do
    // that cascade with a direct PATCH since league_picks writes are
    // admin-only by RLS -- the RPC is scoped narrowly to "rename myself".
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/rename_my_team`, {
      method:"POST",
      headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${session.access_token}`,"Content-Type":"application/json"},
      body:JSON.stringify({p_league_id:leagueCtx?.id, p_new_name:newName})
    });
    if(res.ok){
      setMsg({text:"Studio name updated — reload to see changes",error:false});
    } else {
      const data = await res.json().catch(()=>({}));
      setMsg({text:data.message||"Failed to update studio name",error:true});
    }
    setSaving(false);
  }

  async function saveTeamColor(c){
    setSaving(true); setMsg(null);
    if(!session||!membership){ setSaving(false); return; }
    // Goes through set_my_team_color() (migration 032) rather than a plain
    // PATCH -- same reason as the studio-name rename above: a bare PATCH
    // can't enforce "no two members of this league share a color" without
    // a race-prone client-side check, so that rule lives server-side in the
    // RPC instead.
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/set_my_team_color`, {
      method:"POST",
      headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${session.access_token}`,"Content-Type":"application/json"},
      body:JSON.stringify({p_league_id:leagueCtx?.id, p_color:c})
    });
    if(res.ok){
      setTeamColor(c);
      setMsg({text:"Color updated — reload to see changes",error:false});
    } else {
      const data = await res.json().catch(()=>({}));
      setMsg({text:data.message||"Failed to update color",error:true});
    }
    setSaving(false);
  }

  const inputStyle={width:"100%",padding:"10px 13px",background:"#1a1a28",border:"1px solid #222233",borderRadius:7,color:"#e8e8f0",fontSize:13,fontFamily:"'Helvetica Neue',sans-serif",outline:"none",boxSizing:"border-box"};
  const labelStyle={display:"block",fontSize:10,fontWeight:600,color:"#6a6a7e",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:6};
  const sectionStyle={marginBottom:20};
  const btnStyle={padding:"9px 18px",borderRadius:7,fontSize:13,fontWeight:600,cursor:"pointer",border:"none",fontFamily:"inherit"};

  return(
    <div style={{position:"fixed",inset:0,zIndex:200,display:"flex"}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div style={{marginLeft:"auto",width:"100%",maxWidth:380,height:"100%",background:"#12121c",borderLeft:"1px solid #222233",display:"flex",flexDirection:"column",animation:"slideInRight 0.25s ease-out"}}>
        {/* Header */}
        <div style={{padding:"16px 20px",borderBottom:"1px solid #222233",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:22,letterSpacing:"0.06em",color:"#d4a843"}}>SETTINGS</div>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#6a6a7e",fontSize:20,cursor:"pointer",padding:"4px 8px",lineHeight:1,borderRadius:4}}
            onMouseEnter={e=>e.currentTarget.style.color="#e8e8f0"}
            onMouseLeave={e=>e.currentTarget.style.color="#6a6a7e"}>✕</button>
        </div>
        {/* Tabs */}
        <div style={{display:"flex",borderBottom:"1px solid #222233",flexShrink:0}}>
          {["league","notifications"].map(t=>(
            <button key={t} onClick={()=>{setTab(t);setMsg(null);}} style={{flex:1,padding:"10px 6px",background:"none",border:"none",borderBottom:`2px solid ${tab===t?"#d4a843":"transparent"}`,color:tab===t?"#d4a843":"#6a6a7e",fontSize:11,fontWeight:600,cursor:"pointer",textTransform:"uppercase",letterSpacing:"0.06em",fontFamily:"inherit",transition:"all 0.15s"}}>
              {t==="league"?"League":t.charAt(0).toUpperCase()+t.slice(1)}
            </button>
          ))}
        </div>
        {/* Content */}
        <div style={{flex:1,overflowY:"auto",padding:"20px"}}>
          {msg&&<div style={{padding:"10px 14px",borderRadius:7,fontSize:13,marginBottom:16,background:msg.error?"rgba(239,68,68,0.08)":"rgba(52,211,153,0.08)",border:`1px solid ${msg.error?"rgba(239,68,68,0.2)":"rgba(52,211,153,0.2)"}`,color:msg.error?"#ef4444":"#34d399"}}>{msg.text}</div>}

          {tab==="league"&&(
            <div>
              <div style={{fontSize:12,color:"#6a6a7e",marginBottom:20,lineHeight:1.6}}>Your studio name is how you appear in <strong style={{color:"#e8e8f0"}}>{leagueCtx?.name||"this league"}</strong>. Each league can have a different studio name. Your player name, email, and password are account-wide — manage those from your dashboard settings instead.</div>
              <div style={sectionStyle}>
                <label style={labelStyle}>Studio Name</label>
                <input style={inputStyle} value={studioName} onChange={e=>setStudioName(e.target.value)} placeholder="e.g. Sunset Pictures"/>
                <div style={{fontSize:10,color:"#6a6a7e",marginTop:5}}>This updates how you appear in standings and on your slate.</div>
              </div>
              <button onClick={saveStudioName} disabled={saving} style={{...btnStyle,background:"#d4a843",color:"#0d0d14",width:"100%",opacity:saving?0.7:1,marginBottom:24}}>
                {saving?"Saving...":"Save Studio Name"}
              </button>
              <div style={{...sectionStyle,paddingTop:20,borderTop:"1px solid #222233"}}>
                <label style={labelStyle}>Your Color</label>
                <div style={{display:"flex",flexWrap:"wrap",gap:10,marginTop:6}}>
                  {TEAM_COLOR_PALETTE.map(c=>{
                    const takenBy=LEAGUE_MEMBERS.find(m=>m.color===c&&m.user_id!==session?.user?.id);
                    const isMine=teamColor===c;
                    return (
                      <button key={c} onClick={()=>!takenBy&&saveTeamColor(c)} disabled={saving||!!takenBy}
                        title={takenBy?`Taken by ${takenBy.team_name}`:c}
                        style={{width:30,height:30,borderRadius:"50%",background:c,cursor:takenBy?"not-allowed":"pointer",
                          border:isMine?"2px solid #e8e8f0":"2px solid transparent",
                          boxShadow:isMine?`0 0 0 2px ${c}`:"none",opacity:takenBy?0.25:(saving?0.6:1),
                          position:"relative"}}>
                        {takenBy&&<span style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:"#fff",textShadow:"0 1px 2px rgba(0,0,0,0.7)"}}>✕</span>}
                      </button>
                    );
                  })}
                </div>
                <div style={{fontSize:10,color:"#6a6a7e",marginTop:8}}>How your card and slate are colored in standings. Saves as soon as you pick one. Grayed-out colors are already taken by another team in this league.</div>
              </div>
              <div style={{paddingTop:20,borderTop:"1px solid #222233",marginBottom:20}}>
                <label style={labelStyle}>Default Tab</label>
                <select style={{...inputStyle,cursor:"pointer"}} value={localStorage.getItem('sef_default_tab')||'standings'} onChange={e=>{localStorage.setItem('sef_default_tab',e.target.value);setMsg({text:"Default tab saved",error:false});}}>
                  {["standings","timeline","purchase","trends","awards","rules"].map(t=>(
                    <option key={t} value={t}>{t.charAt(0).toUpperCase()+t.slice(1)}</option>
                  ))}
                </select>
                <div style={{fontSize:10,color:"#6a6a7e",marginTop:5}}>Which tab you land on when opening a league.</div>
              </div>
            </div>
          )}

          {tab==="notifications"&&(
            <div>
              <div style={{fontSize:12,color:"#6a6a7e",marginBottom:20,lineHeight:1.6}}>Choose which events notify you. These apply across every league you're in.</div>
              {notifLoading&&<div style={{fontSize:12,color:"#6a6a7e"}}>Loading…</div>}
              {notifPrefs&&[
                ["notify_declarations","Acquisitions Declarations","Someone declares intent to bid in the weekly Acquisitions market"],
                ["notify_new_leader","New Leaderboard Leader","The standings leader changes in one of your leagues"],
                ["notify_new_film","New Film Added","A new film is added to the Universe list"],
                ["notify_release_day","Release Day","A film on your slate releases today, or its release date changes"],
              ].map(([key,label,desc])=>(
                <div key={key} className="form-toggle-row" style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 0",borderBottom:"1px solid rgba(34,34,51,0.5)"}}>
                  <div style={{paddingRight:14}}>
                    <div style={{fontSize:13,fontWeight:600,color:"#e8e8f0"}}>{label}</div>
                    <div style={{fontSize:11,color:"#6a6a7e",marginTop:2}}>{desc}</div>
                  </div>
                  <label style={{width:40,height:22,borderRadius:11,border:"none",background:notifPrefs[key]?"#34d399":"#3a3a50",cursor:"pointer",position:"relative",transition:"background 0.2s",flexShrink:0}} onClick={()=>toggleNotifPref(key)}>
                    <div style={{width:16,height:16,borderRadius:"50%",background:"#fff",position:"absolute",top:3,left:notifPrefs[key]?20:3,transition:"left 0.2s"}}/>
                  </label>
                </div>
              ))}
              <div style={{fontSize:10,color:"#6a6a7e",marginTop:14}}>More notification types (and email/push delivery) are on the way — only Acquisitions Declarations is fully wired up right now.</div>
            </div>
          )}
        </div>
        {/* Footer */}
        <div style={{padding:"14px 20px",borderTop:"1px solid #222233",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
          <a href="/about" style={{fontSize:12,color:"#6a6a7e",textDecoration:"none"}}
            onMouseEnter={e=>e.currentTarget.style.color="#e8e8f0"}
            onMouseLeave={e=>e.currentTarget.style.color="#6a6a7e"}>Help & About</a>
          <span style={{fontSize:11,color:"#3a3a50",fontFamily:"monospace"}}>SEF 2026</span>
        </div>
      </div>
      <style>{`@keyframes slideInRight{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}`}</style>
    </div>
  );
}

(async function boot(){
  if (!IS_LEGACY) {
    const valid = await ensureValidSession();
    if (valid) {
      syncRealtimeAuth(valid);
      // Keep the access token fresh in the background for as long as this tab
      // stays open, so a long-idle tab doesn't start silently failing requests.
      setInterval(ensureValidSession, 4 * 60 * 1000);
    } else {
      PUBLIC_VIEW_MODE = await verifyPublicView();
      if (!PUBLIC_VIEW_MODE) { window.location.href = '/'; return; }
    }
  }
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
})();
</script>
</body>
</html>
