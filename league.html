const { useState, useMemo, useEffect, useLayoutEffect, useRef, useCallback } = React;

// ── Supabase config ───────────────────────────────────────────────────────────
const SUPABASE_URL = "https://fymkwkbatklfynnhxrsf.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5bWt3a2JhdGtsZnlubmh4cnNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3OTIzOTksImV4cCI6MjA5NjM2ODM5OX0.XjO1xIS2WLF8JNIwIAKqjCL65ISkSu2u7VaeG8gzaew";

// supabase-js is used ONLY for Realtime (Postgres Changes, first use of this
// SDK in the app -- every other request is still a hand-rolled fetch()
// against PostgREST). persistSession/autoRefreshToken are off because this
// app already hand-rolls its own session into localStorage['sef_session']
// (see getSession()/refreshSession() below) -- letting the SDK's own auth
// client run in parallel would just be a second, driftable copy of the same
// state. Realtime's RLS filtering runs off whatever JWT the socket
// authenticated with, so syncRealtimeAuth() below must be called both once
// at boot and every time refreshSession() rotates the access token, or an
// open tab silently goes deaf (or drops to anon-scoped) once the token it
// connected with expires (~1hr).
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false }
});
function syncRealtimeAuth(session) {
  if (session && session.access_token) supabaseClient.realtime.setAuth(session.access_token);
}

// ── Auth + League context ─────────────────────────────────────────────────────
function getSession() {
  try {
    const raw = localStorage.getItem('sef_session');
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s.access_token) return null;
    // Expired access tokens are left in place here — refreshing (via the
    // refresh_token) is handled separately by ensureValidSession(), which runs
    // before the app renders. Deleting the session on mere access-token expiry
    // would throw away a still-valid refresh_token and force an unnecessary re-login.
    if (s.expires_at && new Date(s.expires_at * 1000) < new Date()) {
      return null;
    }
    return s;
  } catch(e) { return null; }
}

// Every open tab polls independently against the one session stored in
// localStorage, and Supabase rotates refresh_token on every use -- without
// coordination, two tabs refreshing near-simultaneously would both send the
// same single-use refresh_token, only one would succeed, and the loser used
// to get treated as a real logout, wiping the session for every tab sharing
// this storage. navigator.locks serializes the actual refresh across tabs;
// re-checking localStorage once inside the lock picks up another tab's
// already-completed refresh instead of racing Supabase again with a token
// that's likely already been rotated out.
async function refreshSession(s) {
  const doRefresh = async () => {
    try {
      const raw = localStorage.getItem('sef_session');
      const current = raw ? JSON.parse(raw) : null;
      if (current && current.refresh_token && current.refresh_token !== s.refresh_token) {
        const expiresAt = current.expires_at ? new Date(current.expires_at * 1000) : null;
        if (!expiresAt || expiresAt > new Date(Date.now() + 60 * 1000)) return current;
      }
      if (!s.refresh_token) return null;
      const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh_token: s.refresh_token })
      });
      if (!res.ok) return null;
      const data = await res.json();
      if (!data.access_token) return null;
      const newSession = {
        access_token: data.access_token,
        refresh_token: data.refresh_token || s.refresh_token,
        expires_at: data.expires_at || Math.floor(Date.now()/1000) + 3600,
        user: data.user || s.user
      };
      localStorage.setItem('sef_session', JSON.stringify(newSession));
      syncRealtimeAuth(newSession);
      return newSession;
    } catch(e) { return null; }
  };
  return navigator.locks ? navigator.locks.request('sef_session_refresh', doRefresh) : doRefresh();
}

// Ensures the stored session has a live access token, refreshing it via the
// refresh_token when it's missing/expired/expiring soon. Only clears the
// stored session (real logout) when a refresh is actually attempted and fails —
// never just because the short-lived access token aged out.
async function ensureValidSession() {
  try {
    const raw = localStorage.getItem('sef_session');
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s.access_token) return null;
    const expiresAt = s.expires_at ? new Date(s.expires_at * 1000) : null;
    const soonExpired = !expiresAt || expiresAt < new Date(Date.now() + 5 * 60 * 1000);
    if (soonExpired) {
      const refreshed = await refreshSession(s);
      if (refreshed) return refreshed;
      localStorage.removeItem('sef_session');
      return null;
    }
    return s;
  } catch(e) { return null; }
}

const URL_PARAMS = new URLSearchParams(window.location.search);
const LEAGUE_UUID = URL_PARAMS.get('id') || null;
const PUBLIC_VIEW_TOKEN = URL_PARAMS.get('view') || null;

// Maps league UUIDs to their legacy text-based league_id, still used ONLY by
// weekly_bo_snapshots/weekly_poi_snapshots/daily_bo (those are unaffected by

// separate, not-yet-done follow-up). The actual film slate now comes from
// league_picks, keyed by LEAGUE_UUID directly -- see the IS_LEGACY branch
// in the data-loading useEffect below.
const LEGACY_ID_MAP = {
  'c388b799-6240-46c4-ba75-da8a0d2e8db5': 'sef-2026',
};

// If this UUID has a legacy mapping, use that for weekly/daily snapshot
// queries. Otherwise use the UUID itself.
const LEAGUE_ID = LEAGUE_UUID ? (LEGACY_ID_MAP[LEAGUE_UUID] || LEAGUE_UUID) : 'sef-2026';
const IS_LEGACY = !LEAGUE_UUID;

// Auth gate is async (see boot() near the bottom, which awaits ensureValidSession()
// before deciding to redirect) so an expired-but-refreshable access token gets a
// chance to refresh instead of bouncing the user to login.

// True once boot() confirms ?view=<share_token> matches a league with
// is_public=true. Lets an unauthenticated visitor render the app read-only
// without ever holding a session — see verifyPublicView() and boot().
let PUBLIC_VIEW_MODE = false;

let LEAGUE_CONTEXT = null;
let USER_MEMBERSHIP = null;
let LEAGUE_MEMBERS = [];

async function verifyPublicView() {
  if (!PUBLIC_VIEW_TOKEN || !LEAGUE_UUID) return false;
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/leagues?id=eq.${LEAGUE_UUID}&share_token=eq.${encodeURIComponent(PUBLIC_VIEW_TOKEN)}&is_public=eq.true&select=id`,
      { headers: { apikey: SUPABASE_ANON_KEY } }
    );
    if (!res.ok) return false;
    const rows = await res.json();
    return rows.length > 0;
  } catch(e) { return false; }
}

async function supabaseFetch(table, params="") {
  const session = getSession();
  const headers = {
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": session ? `Bearer ${session.access_token}` : `Bearer ${SUPABASE_ANON_KEY}`,
  };
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${params}`, { headers });
  if (!res.ok) throw new Error(`Supabase ${table} fetch failed: ${res.status}`);
  return res.json();
}

async function loadLeagueContext() {
  if (IS_LEGACY) return;
  try {
    // Public viewers never need (and must never receive) invite_code or
    // created_by, so their leagues lookup asks for a narrower column set —
    // this is app-level hygiene, not the security boundary (RLS is).
    const leagueSelect = PUBLIC_VIEW_MODE
      ? "id,name,season,season_number,budget,draft_status,num_players,min_bid,max_bid,oscar_nom_bonus,oscar_win_bonus,bp_bonus,festival_picks,draft_open_date,draft_close_date,season_end_date,is_public,sacko_punishment"
      : "*";
    const leagues = await supabaseFetch("leagues", `id=eq.${LEAGUE_UUID}&select=${leagueSelect}`);
    if (leagues.length) LEAGUE_CONTEXT = leagues[0];

    const session = getSession();
    if (session?.user?.id) {
      // Embedding profile:profiles(...) here used to silently return null
      // for every member except the signed-in viewer -- profiles has always
      // been SELECT-restricted to your own row, so the embed only ever
      // resolved for yourself, no matter what another member's
      // display_name was set to. league_member_names (migration 036) is
      // the authenticated equivalent of public_member_names: exposes only
      // display_name (never email), scoped to leagues you're also a
      // member of.
      const [members, names] = await Promise.all([
        supabaseFetch("league_members", `league_id=eq.${LEAGUE_UUID}&select=*&order=joined_at.asc`),
        supabaseFetch("league_member_names", `league_id=eq.${LEAGUE_UUID}`)
      ]);
      const nameByUserId = {};
      (names || []).forEach(n => { nameByUserId[n.user_id] = n.display_name; });
      LEAGUE_MEMBERS = (members || []).map(m => ({ ...m, profile: { display_name: nameByUserId[m.user_id] || null } }));
      USER_MEMBERSHIP = LEAGUE_MEMBERS.find(m => m.user_id === session.user.id) || null;
    } else if (PUBLIC_VIEW_MODE) {
      // Anonymous public viewer — read display names from the narrow
      // public_member_names view (never the profiles table directly), so
      // email can't leak even via a direct API call.
      const members = await supabaseFetch("public_member_names", `league_id=eq.${LEAGUE_UUID}&order=joined_at.asc`);
      LEAGUE_MEMBERS = (members || []).map(m => ({
        id: m.member_id, league_id: m.league_id, user_id: m.user_id,
        team_name: m.team_name, role: m.role, joined_at: m.joined_at,
        profile: { display_name: m.display_name }
      }));
    }
    if (LEAGUE_CONTEXT) document.title = `${LEAGUE_CONTEXT.name} — Studio Exec Fantasy`;
  } catch(e) {
    console.warn("[league context] failed to load:", e.message);
  }
}

// ── Endgame detection ─────────────────────────────────────────────────────────
// Endgame activates when EITHER:
//   1. Current date >= Jan 1 of awards year (ENDGAME_START_DATE)
//   2. ≤5 films are still unreleased (most of the season is done)
function isEndgameActive(films){
  const now=new Date();
  if(now>=ENDGAME_START_DATE) return true;
  if(films&&films.length>0){
    const unreleased=films.filter(f=>f.status!=='released').length;
    if(unreleased<=ENDGAME_FILMS_LEFT_THRESHOLD) return true;
  }
  return false;
}

function daysUntil(date){
  return Math.ceil((date-new Date())/864e5);
}

// Fallback studio names — will be overridden by sheet data if available
const DEFAULT_STUDIOS = { BRANDON: "Continental Studios", RAFA: "Dwayne the Rock's Wig", KAI: "Ginza Films", PATRICK: "Brock Heimer", BB: "No Wot Studios" };
// Mutable for the same reason as EXEC_COLORS above — rebuilt per real league.
let DISPLAY = { BRANDON: "Brandon", RAFA: "Rafa", KAI: "Kai", PATRICK: "Patrick", BB: "BB" };

// Populated per-league (see loadData's league_picks branch) when

// Parses a simple weekly snapshot tab.
// Expects: row 0 = headers (Week | exec names...), rows 1+ = data
// Works for both BO (large dollar numbers) and POI (percentage numbers).
function parseWeeklyTab(text){
  if(!text||text.trim().startsWith('<')) return null;
  const rows=parseCSV(text);
  if(!rows||rows.length<2) return null;

  // Flexible name matching — handles "Brandon", "BRANDON", "bb", "BB" etc.
  const nameMap={
    brandon:"BRANDON",rafa:"RAFA",kai:"KAI",patrick:"PATRICK",bb:"BB",
    "b.b":"BB","b.bennett":"BRANDON","brendan":"BRANDON",
  };

  const hRow=rows[0].map(c=>(c||"").trim().toLowerCase());
  // Find the week column — first column labelled "week", "date", or "w/e"
  const weekCol=hRow.findIndex(c=>c==="week"||c==="date"||c==="w/e"||c.startsWith("week"));
  if(weekCol<0) return null;

  // Map exec columns by matching header to exec names
  const execCols={};
  hRow.forEach((c,j)=>{
    if(j===weekCol) return;
    // Strip trailing decorations like "_bo", "_poi", "%", parenthetical etc.
    const base=c.replace(/[\s_]*(bo|poi|roi|cumul.*|total|%|\(.*\))$/,"").trim();
    if(nameMap[base]) execCols[nameMap[base]]=j;
  });

  if(Object.keys(execCols).length<2) return null;

  const result=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    if(!r||!r[weekCol]) continue;
    const label=(r[weekCol]||"").trim();
    if(!label||label.toLowerCase()==="week"||label.toLowerCase()==="total") continue;
    const row={week:label};
    Object.entries(execCols).forEach(([team,col])=>{
      const raw=(r[col]||"").replace(/[$,%\s]/g,"").trim();
      row[team]=parseFloat(raw)||0;
    });
    result.push(row);
  }
  return result.length>0?result:null;
}

// Parse weekly BO + POI from the sheet
// Looks for a section with "Week" as the first column header and exec names in subsequent columns
function parseWeeklyData(rows){
  const teams=["BRANDON","RAFA","KAI","PATRICK","BB"];
  const nameMap={"brandon":"BRANDON","rafa":"RAFA","kai":"KAI","patrick":"PATRICK","bb":"BB"};

  let headerRow=-1;
  let weekCol=-1;
  const boCol={};
  const poiCol={};

  // Scan every row for a header that has "week" and at least one exec name
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    if(!r) continue;
    const cells=r.map(c=>(c||"").trim().toLowerCase());
    const wIdx=cells.findIndex(c=>c==="week"||c==="date"||c.startsWith("week"));
    if(wIdx<0) continue;
    // Check if this row also has exec names
    let found=0;
    cells.forEach((c,j)=>{
      const base=c.replace(/[_\s]*(bo|poi|cumulative|total|%|roi)$/i,"").trim();
      if(nameMap[base]){found++;}
    });
    if(found>=2){headerRow=i;weekCol=wIdx;break;}
  }

  if(headerRow<0) return null;

  const hRow=rows[headerRow].map(c=>(c||"").trim().toLowerCase());

  // Map exec BO columns and POI columns
  hRow.forEach((c,j)=>{
    if(j===weekCol) return;
    const isPOI=c.includes("poi")||c.includes("%")||c.includes("roi");
    const base=c.replace(/[_\s]*(bo|poi|cumulative|total|%|roi|earned)$/i,"").trim();
    const team=nameMap[base];
    if(!team) return;
    if(isPOI) poiCol[team]=j;
    else boCol[team]=j;
  });

  // If we only found BO columns (no POI), that's fine — POI will fall back
  const hasBO=Object.keys(boCol).length>=2;
  if(!hasBO) return null;

  const weeklyBO=[];
  const weeklyPOI=[];

  for(let i=headerRow+1;i<rows.length;i++){
    const r=rows[i];
    if(!r||!r[weekCol]) continue;
    const label=(r[weekCol]||"").trim();
    if(!label||label.toLowerCase()==="week"||label.toLowerCase()==="total") continue;

    const boRow={week:label};
    const poiRow={week:label};
    teams.forEach(t=>{
      boRow[t]=boCol[t]!==undefined?parseNum(r[boCol[t]]):0;
      poiRow[t]=poiCol[t]!==undefined?parseFloat((r[poiCol[t]]||"0").replace(/[$,%]/g,""))||0:0;
    });
    weeklyBO.push(boRow);
    if(Object.keys(poiCol).length>=2) weeklyPOI.push(poiRow);
  }

  if(weeklyBO.length===0) return null;
  return{weeklyBO, weeklyPOI:weeklyPOI.length>0?weeklyPOI:null};
}

function fmt(n){if(Math.abs(n)>=1e9)return"$"+(n/1e9).toFixed(2)+"B";if(Math.abs(n)>=1e6)return"$"+(n/1e6).toFixed(1)+"M";if(Math.abs(n)>=1e3)return"$"+(n/1e3).toFixed(0)+"K";return"$"+n.toLocaleString()}
function daysLeft(){return Math.ceil((OSCAR_DATE-new Date())/864e5)}
function parseCSV(t){const l=t.split("\n"),r=[];for(const line of l){const row=[];let f="",q=false;for(let j=0;j<line.length;j++){const c=line[j];if(q){if(c==='"'&&line[j+1]==='"'){f+='"';j++}else if(c==='"')q=false;else f+=c}else{if(c==='"')q=true;else if(c===','){row.push(f.trim());f=""}else f+=c}}row.push(f.trim());r.push(row)}return r}
function parseNum(v){if(!v)return 0;const n=parseInt(String(v).replace(/[$,]/g,""),10);return isNaN(n)?0:n}

function processCSV(rows){
  const films=[];
  const studioNames={...DEFAULT_STUDIOS};
  if(!rows||rows.length<2) return{films,studioNames};

  // ── Detect column positions from header row ───────────────────────────────
  // Use partial matching so "Domestic Box Office", "Dom BO", "BOX OFFICE" etc. all work
  const hRow=rows[0].map(c=>(c||"").trim().toUpperCase());

  let titleCol=-1,bidCol=-1,boCol=-1,teamCol=-1,releaseCol=-1,openCol=-1,lockedCol=-1,voidCol=-1;

  for(let j=0;j<hRow.length;j++){
    const h=hRow[j];
    if(titleCol<0 && (h.includes("FILM")||h.includes("TITLE")||h.includes("MOVIE"))) titleCol=j;
    if(bidCol<0   && (h.includes("BID")||h.includes("PURCHASE")||h.includes("PRICE")||h.includes("AMOUNT"))) bidCol=j;
    if(openCol<0  && (h.includes("OPENING")||h.includes("OPEN WEEKEND"))) openCol=j;
    // BO must NOT match the opening column — require "DOMESTIC"/"BOX OFFICE"/"GROSS" and not "OPENING"
    if(boCol<0    && !h.includes("OPENING") && (h.includes("DOMESTIC")||h.includes("BOX OFFICE")||(h==="BO")||(h==="DOM BO")||h.includes("GROSS"))) boCol=j;
    if(teamCol<0  && (h.includes("EXEC")||h.includes("TEAM")||h.includes("OWNER")||(h==="NAME"))) teamCol=j;
    if(releaseCol<0&&(h.includes("RELEASE")||h.includes("DATE"))) releaseCol=j;
    if(lockedCol<0&&(h==="LOCKED"||h==="LOCK"||h.includes("LOCK"))) lockedCol=j;
    if(voidCol<0&&(h==="VOID"||h==="FORFEIT"||h==="VOIDED")) voidCol=j;
  }

  // Log what we detected so mismatches are easy to spot in the browser console
  console.log("[processCSV] Detected columns →",
    `title:${titleCol}(${hRow[titleCol]||"?"})`,
    `bid:${bidCol}(${hRow[bidCol]||"?"})`,
    `open:${openCol}(${hRow[openCol]||"?"})`,
    `bo:${boCol}(${hRow[boCol]||"?"})`,
    `team:${teamCol}(${hRow[teamCol]||"?"})`,
    `release:${releaseCol}(${hRow[releaseCol]||"?"})`,
    `locked:${lockedCol}(${lockedCol>=0?hRow[lockedCol]:"not found"})`
  );

  // If header detection failed, warn loudly and use known positional fallback
  const fallback=(titleCol<0||bidCol<0||boCol<0||teamCol<0);
  if(fallback){
    console.warn("[processCSV] Header detection failed — falling back to fixed column positions. Sheet headers found:", hRow.slice(0,9).join(" | "));
    titleCol=0; bidCol=2; openCol=3; boCol=4; teamCol=5; releaseCol=6; lockedCol=8;
  }
  // lockedCol gets its own fallback even when other headers are found —
  // Column I (index 8) may have no header row entry if the script added it silently
  if(lockedCol<0) lockedCol=8;

  // ── Extract studio names from summary block (columns 7 + 11 historically) ─
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r||r.length<12)continue;
    const studio=r[7]||"";const owner=(r[11]||"").trim();
    if(studio&&owner&&EXEC_COLORS[owner.toUpperCase()]){studioNames[owner.toUpperCase()]=studio;}
    const ownerMap={"Brandon":"BRANDON","Rafa":"RAFA","Kai":"KAI","Patrick":"PATRICK","BB":"BB"};
    if(ownerMap[owner]&&studio){studioNames[ownerMap[owner]]=studio;}
  }

  // ── Parse film rows ───────────────────────────────────────────────────────
  for(let i=1;i<rows.length;i++){
    const r=rows[i];if(!r||r.length<3)continue;
    const title=(r[titleCol]||"").trim();
    const team=(r[teamCol]||"").trim().toUpperCase();
    if(!title||!team||!EXEC_COLORS[team])continue;
    if(title.toLowerCase().includes("remainder"))continue;
    if(title.toLowerCase().includes("godzilla x kong"))continue;
    const bid=parseNum(r[bidCol]);
    const boRaw=(r[boCol]||"").trim();
    const boNum=parseNum(boRaw);
    let status="upcoming",bo=0;

    // Normalize release date to YYYY-MM-DD regardless of sheet format
    const releaseRaw=(r[releaseCol]||"").trim();
    let release=null;
    if(releaseRaw&&releaseRaw!=="TBA"&&releaseRaw!=="No release date"&&releaseRaw!==""){
      if(/^\d{4}-\d{2}-\d{2}/.test(releaseRaw)){
        // Already ISO: 2026-05-22 — use as-is, no Date parsing needed (avoids UTC shift)
        release=releaseRaw.slice(0,10);
      } else {
        // Parse other formats: 5/22/2026, May 22 2026, etc.
        // Use UTC methods to avoid timezone-shifting the date
        const d=new Date(releaseRaw);
        if(!isNaN(d)) release=d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");
      }
    }

    // Determine status from BO first, then from release date
    if(boNum>0){status="released";bo=boNum;}
    else if(!release){status="tba";}
    else{
      const releaseDate=parseReleaseDate(release);
      const today=new Date();today.setHours(0,0,0,0);
      if(releaseDate&&releaseDate<=today){status="released";}
      else{status="upcoming";}
    }
    // Opening weekend — "Film not released" / blank / non-numeric → 0
    const openRaw=openCol>=0?(r[openCol]||"").trim():"";
    const openNum=parseNum(openRaw);
    const opening=openNum>0?openNum:0;
    const locked=lockedCol>=0&&(r[lockedCol]||"").toString().trim().toUpperCase()==="LOCKED";
    const voided=voidCol>=0&&(r[voidCol]||"").toString().trim().toUpperCase()==="VOID";
    if(bid>0) films.push({title,bid,bo,opening,locked,voided,team,release,status});
  }

  // ── Sanity check: log per-exec BO totals so mismatches are obvious ────────
  const totals={};
  films.forEach(f=>{totals[f.team]=(totals[f.team]||0)+(f.bo||0);});
  console.log("[processCSV] BO totals per exec →", Object.entries(totals).map(([t,v])=>`${t}:${(v/1e6).toFixed(1)}M`).join("  "));
  const todayFilms=films.filter(f=>isReleaseDay(f.release));
  if(todayFilms.length>0) console.log("[processCSV] Today's releases →", todayFilms.map(f=>`${f.title}(release:${f.release})`).join("  "));
  else console.log("[processCSV] No films releasing today. TODAY="+TODAY);
  const releasedFilms=films.filter(f=>f.bo>0);
  console.log("[processCSV]", films.length, "films parsed. Released:", releasedFilms.length);
  console.log("[processCSV] Released films →", releasedFilms.map(f=>`${f.title}(${f.team}):${(f.bo/1e6).toFixed(1)}M`).join("  "));

  return{films,studioNames};
}

// ─── INTERACTIVE LINE CHART — persistent data panel ──────────────────
// ─── USE IN VIEW — triggers when element scrolls into viewport ──────────────────
function useInView(threshold=0.25){
  const ref=useRef(null);
  const[inView,setInView]=useState(false);
  useEffect(()=>{
    const el=ref.current;
    if(!el)return;
    const obs=new IntersectionObserver(([entry])=>{
      if(entry.isIntersecting){setInView(true);obs.disconnect();}
    },{threshold});
    obs.observe(el);
    return()=>obs.disconnect();
  },[threshold]);
  return[ref,inView];
}


function LineChart({data,teams,valueFormatter,title}){
  const svgRef=useRef(null);
  const pathRefs=useRef({});
  const[lengths,setLengths]=useState({});
  const[hoverIdx,setHoverIdx]=useState(data.length-1);
  const[containerRef,inView]=useInView(0.2);
  const maxVal=Math.max(0.1,...data.flatMap(w=>teams.map(t=>w[t]||0)));
  const W=700,H=280,pL=70,pR=30,pT=20,pB=45;
  const pW=W-pL-pR,pH=H-pT-pB;
  const xStep=data.length>1?pW/(data.length-1):0;
  const getP=(i,t)=>({x:pL+i*xStep,y:pT+pH-((data[i][t]||0)/maxVal)*pH});
  const activeIdx=hoverIdx!==null?hoverIdx:data.length-1;
  const activeWeek=data[activeIdx];

  useEffect(()=>{
    const nl={};
    teams.forEach(team=>{const el=pathRefs.current[team];if(el)nl[team]=el.getTotalLength();});
    setLengths(nl);
  },[data,teams]);

  const handleInteraction=useCallback((clientX)=>{
    if(!svgRef.current)return;
    const rect=svgRef.current.getBoundingClientRect();
    const mx=((clientX-rect.left)/rect.width)*W;
    const idx=Math.round((mx-pL)/xStep);
    if(idx>=0&&idx<data.length)setHoverIdx(idx);
  },[data.length,xStep]);

  return(
    <div ref={containerRef}>
      <div style={{background:"#1a1a28",borderRadius:8,padding:"10px 14px",marginBottom:10}}>
        <div style={{fontWeight:700,color:"#d4a843",marginBottom:6,fontSize:12,display:"flex",justifyContent:"space-between"}}>
          <span>{activeWeek.week}</span>
          <span style={{color:"#4a4a5e",fontWeight:400,fontSize:10}}>hover chart to explore</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(115px, 1fr))",gap:"6px 14px"}}>
          {teams.map(t=>(
            <div key={t} style={{display:"flex",alignItems:"center",gap:6,fontSize:12,paddingRight:6}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:EXEC_COLORS[t],flexShrink:0}}/>
              <span style={{color:"#8a8a9e"}}>{DISPLAY[t]}</span>
              <span style={{fontFamily:"monospace",color:EXEC_COLORS[t],fontWeight:600}}>{valueFormatter(activeWeek[t]||0)}</span>
            </div>
          ))}
        </div>
      </div>
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",cursor:"crosshair",display:"block"}}
        onMouseMove={e=>handleInteraction(e.clientX)} onMouseLeave={()=>setHoverIdx(data.length-1)}
        onTouchMove={e=>{e.preventDefault();handleInteraction(e.touches[0].clientX)}} onTouchEnd={()=>setHoverIdx(data.length-1)}>
        {[0,.25,.5,.75,1].map(p=>{const y=pT+pH*(1-p);return(<g key={p}><line x1={pL} y1={y} x2={W-pR} y2={y} stroke="#1a1a28"/><text x={pL-6} y={y+4} fill="#4a4a5e" fontSize={9} textAnchor="end" fontFamily="monospace">{valueFormatter(maxVal*p)}</text></g>)})}
        {data.map((w,i)=>(<text key={i} x={pL+i*xStep} y={H-8} fill={i===activeIdx?"#d4a843":"#4a4a5e"} fontSize={9} textAnchor="middle" fontFamily="monospace" fontWeight={i===activeIdx?700:400}>{w.week}</text>))}
        <line x1={pL+activeIdx*xStep} y1={pT} x2={pL+activeIdx*xStep} y2={pT+pH} stroke="#d4a843" strokeWidth={1} strokeDasharray="4 3" opacity={0.4}/>
        {teams.map((team,ti)=>{
          const path=data.map((_,i)=>{const p=getP(i,team);return`${i===0?"M":"L"}${p.x},${p.y}`}).join(" ");
          const len=lengths[team]||0;
          const delay=ti*120;
          const animated=inView&&len>0;
          return(<path key={team} ref={el=>pathRefs.current[team]=el} d={path} fill="none"
            stroke={EXEC_COLORS[team]} strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round" opacity={0.8}
            strokeDasharray={len>0?len:undefined}
            strokeDashoffset={animated?undefined:len>0?len:undefined}
            style={animated?{animation:`drawLine 1.2s ease-out ${delay}ms both`,['--line-len']:len}:undefined}
          />);
        })}
        {teams.map(team=>data.map((_,i)=>{const p=getP(i,team);return<circle key={`${team}-${i}`} cx={p.x} cy={p.y} r={i===activeIdx?5:3} fill={EXEC_COLORS[team]} opacity={i===activeIdx?1:0.5}/>}))}
      </svg>
      <div style={{display:"flex",gap:14,justifyContent:"center",marginTop:8,flexWrap:"wrap"}}>
        {teams.map(t=>(<div key={t} style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:"#8a8a9e"}}><div style={{width:12,height:3,background:EXEC_COLORS[t],borderRadius:2}}/>{DISPLAY[t]}</div>))}
      </div>
    </div>
  );
}

// ─── BAR CHART for total weekly BO ──────────────────
// ── Daily Box Office Chart ────────────────────────────────────────────────────
// Renders a bar-per-day chart for a single film, grouped by week.
// Weekend bars (Fri/Sat/Sun) are brighter; weekdays are muted.
// Data comes from the DAILY BO Google Sheet tab.
function DailyBOChart({dailyBO,anim}){
  const[containerRef,inView]=useInView(0.15);
  const[hoverIdx,setHoverIdx]=useState(null);
  const[animKey,setAnimKey]=useState(0);
  const sidebarRef=useRef(null);
  const[canScrollDown,setCanScrollDown]=useState(false);
  const lineRef=useRef(null);
  const[lineLen,setLineLen]=useState(0);
  const[isMobile,setIsMobile]=useState(()=>typeof window!=="undefined"&&window.innerWidth<600);

  useEffect(()=>{
    const check=()=>setIsMobile(window.innerWidth<600);
    window.addEventListener("resize",check);
    return()=>window.removeEventListener("resize",check);
  },[]);

  const allFilms=[...new Set(dailyBO.map(d=>d.film))];
  const[selectedFilm,setSelectedFilm]=useState(allFilms[0]||"");
  useEffect(()=>{if(allFilms.length&&!allFilms.includes(selectedFilm))setSelectedFilm(allFilms[0]);},[allFilms.join(",")]);

  useEffect(()=>{
    const el=sidebarRef.current;
    if(!el||isMobile) return;
    const check=()=>setCanScrollDown(el.scrollHeight>el.clientHeight&&el.scrollTop+el.clientHeight<el.scrollHeight-4);
    check();
    el.addEventListener("scroll",check);
    return()=>el.removeEventListener("scroll",check);
  },[allFilms.length,isMobile]);

  function selectFilm(film){setSelectedFilm(film);setHoverIdx(null);setAnimKey(k=>k+1);}

  const rows=dailyBO.filter(d=>d.film===selectedFilm);
  if(!rows.length) return null;

  const WEEKEND=new Set(["Friday","Saturday","Sunday"]);
  const isWeekend=d=>WEEKEND.has(d.dow);

  const W=620,H=200,pL=58,pR=12,pT=14,pB=40;
  const pW=W-pL-pR,pH=H-pT-pB;
  const maxDaily=Math.max(...rows.map(r=>r.daily),1);
  const px=i=>pL+i*(pW/(rows.length-1||1));
  const py=v=>pT+pH*(1-(v/maxDaily));
  const linePath=`M ${px(0).toFixed(1)},${py(rows[0].daily).toFixed(1)} `+rows.slice(1).map((r,i)=>`L ${px(i+1).toFixed(1)},${py(r.daily).toFixed(1)}`).join(" ");
  const areaPath=linePath+` L ${px(rows.length-1).toFixed(1)},${pT+pH} L ${px(0).toFixed(1)},${pT+pH} Z`;

  useEffect(()=>{
    if(lineRef.current){try{setLineLen(lineRef.current.getTotalLength());}catch(e){}}
  },[selectedFilm,rows.length,inView]);

  const shouldAnimate=inView&&lineLen>0;

  const xLabels=rows.map((r,i)=>{
    if(i===0||r.date.slice(5,7)!==rows[i-1].date.slice(5,7)){
      const p=r.date.split("-");
      return{x:px(i),label:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][parseInt(p[1])-1]+" "+parseInt(p[2])};
    }
    return null;
  }).filter(Boolean);

  const hovered=hoverIdx!==null?rows[hoverIdx]:null;
  const filmSummary=allFilms.map(film=>{
    const fr=dailyBO.filter(d=>d.film===film);
    const total=fr.length?fr[fr.length-1].cumulative||fr.reduce((s,r)=>s+r.daily,0):0;
    return{film,total,days:fr.length};
  });
  const tooltipCols=[
    {label:"Date",     width:90, value:hovered?`${hovered.dow.slice(0,3)} ${hovered.date.slice(5).replace("-","/")}`:null, color:hovered&&isWeekend(hovered)?"#c084fc":"#9a9ab0"},
    {label:"Day",      width:38, value:hovered?`#${hovered.dayNum}`:null, color:"#9a9ab0"},
    {label:"Daily",    width:80, value:hovered?fmt(hovered.daily):null, color:"#e8e8f0"},
    {label:"Total",    width:84, value:hovered?fmt(hovered.cumulative):null, color:"#a855f7"},
    {label:"Theaters", width:60, value:hovered&&hovered.theaters>0?hovered.theaters.toLocaleString():null, color:"#4a4a5e"},
  ];

  const svgEl=(
    <div ref={containerRef}>
      <svg key={animKey} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",display:"block",overflow:"visible"}}>
        <defs>
          <linearGradient id="dailyAreaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#a855f7" stopOpacity="0.35"/>
            <stop offset="100%" stopColor="#a855f7" stopOpacity="0.02"/>
          </linearGradient>
          <clipPath id="dailyClip"><rect x={pL} y={pT} width={pW} height={pH}/></clipPath>
        </defs>
        {[0,0.25,0.5,0.75,1].map((f,i)=>{const y=pT+pH*(1-f);return(<g key={i}><line x1={pL} y1={y} x2={W-pR} y2={y} stroke="#1a1a28" strokeWidth={1}/><text x={pL-5} y={y+3} fill="#4a4a5e" fontSize={7} textAnchor="end" fontFamily="monospace">{f===0?"$0":fmt(Math.round(maxDaily*f))}</text></g>);})}
        {rows.map((r,i)=>{if(!isWeekend(r)||r.dow!=="Friday")return null;const x2=i+2<rows.length?px(i+2):px(rows.length-1);return<rect key={i} x={px(i)} y={pT} width={x2-px(i)} height={pH} fill="#a855f7" opacity={0.04}/>;})}
        <path d={areaPath} fill="url(#dailyAreaGrad)" clipPath="url(#dailyClip)" style={shouldAnimate?{animation:"clipGrow 1.1s ease-out both"}:{opacity:0}}/>
        <path ref={lineRef} d={linePath} fill="none" stroke="#a855f7" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round" clipPath="url(#dailyClip)"
          strokeDasharray={lineLen>0?lineLen:undefined} strokeDashoffset={shouldAnimate?undefined:lineLen>0?lineLen:undefined}
          style={shouldAnimate?{animation:"drawLine 1.1s ease-out both",["--line-len"]:lineLen}:{}}/>
        {hoverIdx!==null&&<circle cx={px(hoverIdx)} cy={py(rows[hoverIdx].daily)} r={3.5} fill="#a855f7" stroke="#111119" strokeWidth={2}/>}
        {rows.map((r,i)=><rect key={i} x={i===0?pL:px(i)-(px(1)-px(0))/2} y={pT} width={pW/rows.length} height={pH} fill="transparent" style={{cursor:"crosshair"}} onMouseEnter={()=>setHoverIdx(i)} onMouseLeave={()=>setHoverIdx(null)}/>)}
        <line x1={pL} y1={pT+pH} x2={W-pR} y2={pT+pH} stroke="#2a2a3a" strokeWidth={1}/>
        {xLabels.map((l,i)=><text key={i} x={l.x} y={H-pB+12} fill="#4a4a5e" fontSize={7} textAnchor="middle" fontFamily="monospace">{l.label}</text>)}
      </svg>
    </div>
  );

  const tooltipEl=(
    <div style={{background:"#1a1a28",borderRadius:5,padding:"6px 10px",marginBottom:8,fontFamily:"monospace",fontSize:10}}>
      <div style={{display:"flex",marginBottom:2}}>{tooltipCols.map(c=><div key={c.label} style={{width:c.width,flexShrink:0,fontSize:8,color:"#4a4a5e",textTransform:"uppercase",letterSpacing:"0.08em"}}>{c.label}</div>)}</div>
      <div style={{display:"flex"}}>{tooltipCols.map(c=><div key={c.label} style={{width:c.width,flexShrink:0,color:c.color,fontWeight:c.label==="Daily"?700:400,whiteSpace:"nowrap",overflow:"hidden"}}>{hovered?c.value||"—":"—"}</div>)}</div>
    </div>
  );

  const footerEl=(
    <div style={{display:"flex",gap:12,marginTop:6,fontSize:9,color:"#4a4a5e",alignItems:"center"}}>
      <span><span style={{display:"inline-block",width:24,height:7,background:"#a855f7",opacity:0.2,borderRadius:1,marginRight:4,verticalAlign:"middle"}}/>Weekend</span>
      <span style={{marginLeft:"auto"}}>Peak: {fmt(Math.max(...rows.map(r=>r.daily)))} · Total: {fmt(rows[rows.length-1]?.cumulative||0)}</span>
    </div>
  );

  const filmBtn=(film,total,days,isSel,mobile)=>mobile?(
    <button key={film} onClick={()=>selectFilm(film)} style={{flexShrink:0,padding:"6px 10px",borderRadius:16,cursor:"pointer",background:isSel?"rgba(168,85,247,0.15)":"#1a1a28",border:`1px solid ${isSel?"rgba(168,85,247,0.6)":"#222233"}`,transition:"all 0.15s",whiteSpace:"nowrap"}}>
      <div style={{fontSize:11,fontWeight:isSel?700:500,color:isSel?"#c084fc":"#9a9ab0"}}>{film.length>22?film.slice(0,21)+"...":film}</div>
      <div style={{fontSize:9,fontFamily:"monospace",color:isSel?"#a855f7":"#4a4a5e",marginTop:1}}>{fmt(total)} · {days}d</div>
    </button>
  ):(
    <button key={film} onClick={()=>selectFilm(film)} style={{display:"block",width:"100%",textAlign:"left",padding:"7px 9px",borderRadius:6,cursor:"pointer",background:isSel?"rgba(168,85,247,0.12)":"transparent",border:`1px solid ${isSel?"rgba(168,85,247,0.5)":"#1a1a28"}`,transition:"all 0.15s"}}>
      <div style={{fontSize:11,fontWeight:isSel?700:500,color:isSel?"#c084fc":"#9a9ab0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",lineHeight:1.3}}>{film}</div>
      <div style={{fontSize:9,fontFamily:"monospace",color:isSel?"#a855f7":"#4a4a5e",marginTop:2}}>{fmt(total)} · {days}d</div>
    </button>
  );

  return(
    <div style={{background:"#111119",border:"1px solid #222233",borderRadius:10,padding:"16px 14px",...anim}}>
      <div style={{fontSize:12,fontWeight:700,color:"#a855f7",letterSpacing:"0.08em",textTransform:"uppercase",marginBottom:4}}>&#x1F4CA; Daily Box Office</div>
      <div style={{fontSize:10,color:"#6a6a7e",marginBottom:10}}>Day-by-day domestic gross for each released film</div>
      {isMobile?(
        <>
          <div style={{overflowX:"auto",marginBottom:10,paddingBottom:4,WebkitOverflowScrolling:"touch"}}>
            <div style={{display:"flex",gap:6,width:"max-content"}}>
              {filmSummary.map(({film,total,days})=>filmBtn(film,total,days,film===selectedFilm,true))}
            </div>
          </div>
          {tooltipEl}{svgEl}{footerEl}
        </>
      ):(
        <div style={{display:"flex",gap:12}}>
          <div style={{width:148,flexShrink:0,position:"relative"}}>
            <div ref={sidebarRef} style={{display:"flex",flexDirection:"column",gap:3,maxHeight:280,overflowY:"auto",paddingRight:4,paddingBottom:canScrollDown?20:0}}>
              {filmSummary.map(({film,total,days})=>filmBtn(film,total,days,film===selectedFilm,false))}
            </div>
            {canScrollDown&&<div style={{position:"absolute",bottom:0,left:0,right:4,height:36,background:"linear-gradient(transparent,#111119)",borderRadius:"0 0 6px 6px",display:"flex",alignItems:"flex-end",justifyContent:"center",paddingBottom:4,pointerEvents:"none"}}><span style={{fontSize:9,color:"#a855f7",opacity:0.7}}>&#x25BC; more</span></div>}
          </div>
          <div style={{flex:1,minWidth:0}}>{tooltipEl}{svgEl}{footerEl}</div>
        </div>
      )}
    </div>
  );
}


function WeeklyTotalBarChart({data,teams}){
  const svgRef=useRef(null);
  const[hoverIdx,setHoverIdx]=useState(data.length-1);
  const[containerRef,inView]=useInView(0.2);
  const totals=data.map(w=>{let s=0;teams.forEach(t=>s+=(w[t]||0));return s});
  const maxT=Math.max(1,...totals);
  const W=700,H=250,pL=70,pR=30,pT=20,pB=45;
  const pW=W-pL-pR,pH=H-pT-pB;
  const barW=Math.min(pW/data.length*0.7,60);
  const gap=(pW-barW*data.length)/(data.length+1);
  const activeIdx=hoverIdx!==null?hoverIdx:data.length-1;

  const handleInteraction=useCallback((clientX)=>{
    if(!svgRef.current)return;
    const rect=svgRef.current.getBoundingClientRect();
    const mx=((clientX-rect.left)/rect.width)*W;
    const idx=Math.round((mx-pL-gap)/(barW+gap));
    if(idx>=0&&idx<data.length)setHoverIdx(idx);
  },[data.length,barW,gap]);

  return(
    <div ref={containerRef}>
      <div style={{background:"#1a1a28",borderRadius:8,padding:"10px 14px",marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <span style={{fontWeight:700,color:"#d4a843",fontSize:12}}>{data[activeIdx].week}</span>
            <span style={{fontFamily:"monospace",color:"#e8e8f0",fontWeight:700,fontSize:14,marginLeft:12}}>{fmt(totals[activeIdx])}</span>
          </div>
          {activeIdx>0&&<span style={{fontSize:11,fontFamily:"monospace",color:totals[activeIdx]>totals[activeIdx-1]?"#34d399":"#f87171"}}>
            {totals[activeIdx]>totals[activeIdx-1]?"+":""}{ fmt(totals[activeIdx]-totals[activeIdx-1]) } vs prev week
          </span>}
        </div>
      </div>
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",cursor:"crosshair",display:"block",overflow:"visible"}}
        onMouseMove={e=>handleInteraction(e.clientX)} onMouseLeave={()=>setHoverIdx(data.length-1)}
        onTouchMove={e=>{e.preventDefault();handleInteraction(e.touches[0].clientX)}} onTouchEnd={()=>setHoverIdx(data.length-1)}>
        {[0,.25,.5,.75,1].map(p=>{const y=pT+pH*(1-p);return(<g key={p}><line x1={pL} y1={y} x2={W-pR} y2={y} stroke="#1a1a28"/><text x={pL-6} y={y+4} fill="#4a4a5e" fontSize={9} textAnchor="end" fontFamily="monospace">{fmt(maxT*p)}</text></g>)})}
        {/* Clipping rect so bars grow upward from baseline */}
        <defs>
          <clipPath id="barClip">
            <rect x={0} y={pT} width={W} height={pH}
              style={inView?{animation:'clipGrow 0.9s ease-out both'}:undefined}/>
          </clipPath>
        </defs>
        <g clipPath="url(#barClip)">
          {data.map((_,i)=>{
            const x=pL+gap+(barW+gap)*i;
            const isActive=i===activeIdx;
            let cumH=0;
            return(<g key={i}>
              {teams.map(t=>{const tH=(data[i][t]||0)/maxT*pH;const tY=pT+pH-cumH-tH;cumH+=tH;return<rect key={t} x={x} y={tY} width={barW} height={Math.max(tH,0)} rx={2} fill={EXEC_COLORS[t]} opacity={isActive?0.8:0.4}/>})}
            </g>);
          })}
        </g>
        {data.map((_,i)=>{
          const x=pL+gap+(barW+gap)*i;
          const isActive=i===activeIdx;
          return(<text key={i} x={x+barW/2} y={H-8} fill={isActive?"#d4a843":"#4a4a5e"} fontSize={9} textAnchor="middle" fontFamily="monospace" fontWeight={isActive?700:400}>{data[i].week}</text>);
        })}
      </svg>
    </div>
  );
}

// ─── BY PURCHASE PRICE TAB ──────────────────
function PurchasePriceTab({films,data,studioNames}){
  const[sortCol,setSortCol]=useState("bid");
  const[sortDir,setSortDir]=useState("desc");
  const[filterTeam,setFilterTeam]=useState("ALL");

  const allFilms=[...films].filter(f=>filterTeam==="ALL"||f.team===filterTeam);
  allFilms.sort((a,b)=>{
    let va,vb;
    if(sortCol==="bid"){va=a.bid;vb=b.bid;}
    else if(sortCol==="bo"){va=a.bo;vb=b.bo;}
    else if(sortCol==="opening"){va=a.opening||0;vb=b.opening||0;}
    else if(sortCol==="legs"){va=(a.opening>0&&a.bo>0)?a.bo/a.opening:0;vb=(b.opening>0&&b.bo>0)?b.bo/b.opening:0;}
    else if(sortCol==="roi"){va=a.bo>0?(a.bo/(a.bid*1e6))*100:0;vb=b.bo>0?(b.bo/(b.bid*1e6))*100:0;}
    else if(sortCol==="poi"){
      const pa=a.bo>0?a.bo/(a.bid*1e6):0;const pb=b.bo>0?b.bo/(b.bid*1e6):0;
      va=pa;vb=pb;
    }
    else if(sortCol==="date"){
      const da=a.release||"9999";const db=b.release||"9999";
      return sortDir==="asc"?da.localeCompare(db):db.localeCompare(da);
    }
    else if(sortCol==="title"){return sortDir==="asc"?a.title.localeCompare(b.title):b.title.localeCompare(a.title);}
    else{va=0;vb=0;}
    return sortDir==="asc"?va-vb:vb-va;
  });

  function toggleSort(col){
    if(sortCol===col)setSortDir(d=>d==="asc"?"desc":"asc");
    else{setSortCol(col);setSortDir("desc");}
  }
  function SortArrow({col}){if(sortCol!==col)return<span style={{color:"#2a2a3a",marginLeft:3}}>⇅</span>;return<span style={{color:"#d4a843",marginLeft:3}}>{sortDir==="desc"?"↓":"↑"}</span>;}

  const totalBid=allFilms.reduce((s,f)=>s+f.bid,0);
  const totalBO=allFilms.reduce((s,f)=>s+f.bo,0);
  const releasedCount=allFilms.filter(f=>f.bo>0).length;

  return(
    <div>
      {/* Summary bar */}
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
        <div style={{flex:1,background:"#111119",border:"1px solid #222233",borderRadius:8,padding:"10px 14px",minWidth:100}}>
          <div style={{fontFamily:"monospace",fontSize:15,fontWeight:700,color:"#d4a843"}}>${totalBid}M</div>
          <div style={{fontSize:9,color:"#6a6a7e",textTransform:"uppercase",letterSpacing:"0.08em",marginTop:2}}>Total Spent</div>
        </div>
        <div style={{flex:1,background:"#111119",border:"1px solid #222233",borderRadius:8,padding:"10px 14px",minWidth:100}}>
          <div style={{fontFamily:"monospace",fontSize:15,fontWeight:700,color:"#34d399"}}>{fmt(totalBO)}</div>
          <div style={{fontSize:9,color:"#6a6a7e",textTransform:"uppercase",letterSpacing:"0.08em",marginTop:2}}>Total BO</div>
        </div>
        <div style={{flex:1,background:"#111119",border:"1px solid #222233",borderRadius:8,padding:"10px 14px",minWidth:100}}>
          <div style={{fontFamily:"monospace",fontSize:15,fontWeight:700,color:"#60a5fa"}}>{releasedCount}/{allFilms.length}</div>
          <div style={{fontSize:9,color:"#6a6a7e",textTransform:"uppercase",letterSpacing:"0.08em",marginTop:2}}>Released</div>
        </div>
      </div>

      {/* Filters */}
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:10,color:"#6a6a7e",textTransform:"uppercase",letterSpacing:"0.08em"}}>Filter:</span>
        {["ALL",...Object.keys(EXEC_COLORS)].map(t=>(
          <button key={t} onClick={()=>setFilterTeam(t)} style={{fontSize:10,padding:"4px 10px",borderRadius:5,border:`1px solid ${filterTeam===t?(t==="ALL"?"#d4a843":EXEC_COLORS[t]):"#2a2a3a"}`,background:filterTeam===t?(t==="ALL"?"#d4a84320":EXEC_COLORS[t]+"20"):"transparent",color:filterTeam===t?(t==="ALL"?"#d4a843":EXEC_COLORS[t]):"#6a6a7e",cursor:"pointer",fontWeight:700}}>
            {t==="ALL"?"All":DISPLAY[t]}
          </button>
        ))}
      </div>

      {/* Table */}
      <div style={{background:"#111119",border:"1px solid #222233",borderRadius:10,overflow:"hidden"}}>
        <div style={{background:"#0e0e16",borderBottom:"1px solid #222233",fontSize:9,color:"#6a6a7e",textTransform:"uppercase",letterSpacing:"0.08em"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 42px 22px 52px 65px 65px 42px",gap:0,padding:"9px 14px"}}>
            <button onClick={()=>toggleSort("title")} style={{background:"none",border:"none",color:"#6a6a7e",fontSize:9,textTransform:"uppercase",letterSpacing:"0.08em",cursor:"pointer",textAlign:"left",padding:0}}>Film<SortArrow col="title"/></button>
            <button onClick={()=>toggleSort("bid")} style={{background:"none",border:"none",color:"#6a6a7e",fontSize:9,textTransform:"uppercase",letterSpacing:"0.08em",cursor:"pointer",textAlign:"right",padding:0}}>$$<SortArrow col="bid"/></button>
            <div/>
            <button onClick={()=>toggleSort("date")} style={{background:"none",border:"none",color:"#6a6a7e",fontSize:9,textTransform:"uppercase",letterSpacing:"0.08em",cursor:"pointer",textAlign:"right",padding:0}}>Date<SortArrow col="date"/></button>
            <button onClick={()=>toggleSort("bo")} style={{background:"none",border:"none",color:"#6a6a7e",fontSize:9,textTransform:"uppercase",letterSpacing:"0.08em",cursor:"pointer",textAlign:"right",padding:0}}>Dom.BO<SortArrow col="bo"/></button>
            <button onClick={()=>toggleSort("poi")} style={{background:"none",border:"none",color:"#6a6a7e",fontSize:9,textTransform:"uppercase",letterSpacing:"0.08em",cursor:"pointer",textAlign:"right",padding:0}}>POI%<SortArrow col="poi"/></button>
            <button onClick={()=>toggleSort("legs")} style={{background:"none",border:"none",color:"#6a6a7e",fontSize:9,textTransform:"uppercase",letterSpacing:"0.08em",cursor:"pointer",textAlign:"right",padding:0}}>Legs<SortArrow col="legs"/></button>
          </div>
        </div>

        {/* Rows */}
        {allFilms.map((f,i)=>{
          const legs=(f.opening>0&&f.bo>0)?(f.bo/f.opening):null;
          const legsColor=legs===null?"#3a3a4e":legs>=3?"#34d399":legs>=2?"#86efac":legs>=1.5?"#fbbf24":"#f87171";
          const poi=f.bo>0?((f.bo/(f.bid*1e6))*100):null;
          const poiColor=poi===null?"#3a3a4e":poi>=200?"#34d399":poi>=100?"#86efac":poi>=50?"#fbbf24":"#f87171";
          const relLabel=f.release?(()=>{const p=f.release.split("-");return["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][parseInt(p[1])-1]+" "+parseInt(p[2]);})():"—";
          return(
            <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 42px 22px 52px 65px 65px 42px",gap:0,padding:"9px 14px",borderBottom:"1px solid #0e0e16",alignItems:"center",opacity:f.locked?0.65:f.voided?0.7:1,background:f.voided?"rgba(239,68,68,0.04)":isReleaseDay(f.release)?"rgba(212,168,67,0.05)":i%2===0?"transparent":"#0a0a11"}}>
              {/* Title */}
              <div style={{minWidth:0,paddingRight:6}}>
                <ReleaseDayBadge releaseDate={f.release}>
                  {bomUrl(f.title)
                    ? <a href={bomUrl(f.title)} target="_blank" rel="noopener noreferrer" style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",display:"block",color:f.voided?"#ef4444":f.locked?"#6a6a7e":"#e8e8f0",textDecoration:f.voided?"line-through":"none"}}
                        onMouseEnter={e=>e.currentTarget.style.color="#d4a843"}
                        onMouseLeave={e=>e.currentTarget.style.color=f.voided?"#ef4444":f.locked?"#6a6a7e":"#e8e8f0"}>
                        {f.locked&&<span style={{marginRight:4,display:"inline-flex",alignItems:"center"}}><svg width="10" height="10" viewBox="0 0 12 12" fill="none"><rect x="2" y="5.5" width="8" height="5.5" rx="1" stroke="#6a6a7e" strokeWidth="1.2"/><path d="M4 5.5V4a2 2 0 0 1 4 0v1.5" stroke="#6a6a7e" strokeWidth="1.2" strokeLinecap="round"/></svg></span>}{f.title} <span style={{fontSize:9,opacity:0.4}}>↗</span>
                      </a>
                    : <div style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:f.voided?"#ef4444":f.locked?"#6a6a7e":"#e8e8f0",textDecoration:f.voided?"line-through":"none"}}>{f.locked&&<span style={{marginRight:4,display:'inline-flex',alignItems:'center'}}><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="2" y="5.5" width="8" height="5.5" rx="1" stroke="currentColor" strokeWidth="1.2"/><path d="M4 5.5V4a2 2 0 0 1 4 0v1.5" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg></span>}{f.title}</div>
                  }
                </ReleaseDayBadge>
                <div style={{marginTop:2,display:"flex",gap:4}}>
                  {f.voided
                    ? <span style={{fontSize:8,background:"rgba(239,68,68,0.12)",color:"#ef4444",padding:"1px 5px",borderRadius:3}}>0% ROI</span>
                    : f.locked
                      ? <span style={{fontSize:8,background:"rgba(100,100,120,0.15)",color:"#6a6a7e",padding:"1px 5px",borderRadius:3}}>Final</span>
                      : f.status==="released"&&<span style={{fontSize:8,background:"rgba(52,211,153,0.12)",color:"#34d399",padding:"1px 5px",borderRadius:3}}>✓ Released</span>
                  }
                  <CountdownBadge release={f.release} status={f.status}/>
                  {f.status==="tba"&&!f.voided&&<span style={{fontSize:8,background:"rgba(100,100,120,0.12)",color:"#6a6a7e",padding:"1px 5px",borderRadius:3}}>TBA</span>}
                </div>
              </div>
              {/* Price */}
              <div style={{fontFamily:"monospace",fontSize:11,fontWeight:700,color:"#d4a843",textAlign:"right"}}>${f.bid}M</div>
              {/* Owner dot */}
              <div style={{display:"flex",justifyContent:"center"}}>
                <span title={DISPLAY[f.team]} style={{display:"inline-block",width:9,height:9,borderRadius:"50%",background:EXEC_COLORS[f.team],flexShrink:0,boxShadow:`0 0 4px ${EXEC_COLORS[f.team]}80`}}/>
              </div>
              {/* Release date */}
              <div style={{fontFamily:"monospace",fontSize:10,color:isReleaseDay(f.release)?"#d4a843":"#6a6a7e",textAlign:"right"}}>{relLabel}</div>
              {/* Dom BO */}
              <div style={{fontFamily:"monospace",fontSize:11,color:f.bo>0?"#e8e8f0":"#3a3a4e",textAlign:"right"}}>{f.bo>0?fmt(f.bo):"—"}</div>
              {/* POI % */}
              <div style={{fontFamily:"monospace",fontSize:11,fontWeight:700,color:f.voided?"#ef4444":poiColor,textAlign:"right"}}>{f.voided?"0%":poi!==null?poi.toFixed(0)+"%":"—"}</div>
              {/* Legs */}
              <div style={{fontFamily:"monospace",fontSize:12,fontWeight:700,color:legsColor,textAlign:"right"}}>{legs!==null?legs.toFixed(1)+"x":"—"}</div>
            </div>
          );
        })}
      </div>
      <div style={{fontSize:10,color:"#4a4a5e",marginTop:8,textAlign:"center"}}>Click column headers to sort · {allFilms.length} films shown</div>
    </div>
  );
}

// ── ENDGAME COUNTDOWN BANNER — shows days until Oscar noms and Oscar Sunday ────

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,margin:"16px 0 14px"}}>
      <div style={{background:"rgba(212,168,67,0.08)",border:"1px solid rgba(160,19,31,0.5)",borderRadius:8,padding:"10px 12px",textAlign:"center",boxShadow:"inset 0 0 0 1px rgba(212,168,67,0.15)"}}>
        <div style={{fontFamily:"monospace",fontSize:22,fontWeight:700,color:theme.gold,lineHeight:1}}>{nomsLabel}</div>
        <div style={{fontSize:9,color:theme.textMuted,letterSpacing:"0.15em",marginTop:4}}>DAYS TO NOMINATIONS</div>
      </div>
      <div style={{background:"rgba(212,168,67,0.08)",border:"1px solid rgba(160,19,31,0.5)",borderRadius:8,padding:"10px 12px",textAlign:"center",boxShadow:"inset 0 0 0 1px rgba(212,168,67,0.15)"}}>
        <div style={{fontFamily:"monospace",fontSize:22,fontWeight:700,color:theme.gold,lineHeight:1}}>{oscarsLabel}</div>
        <div style={{fontSize:9,color:theme.textMuted,letterSpacing:"0.15em",marginTop:4}}>DAYS TO OSCAR SUNDAY</div>

  );

// ─── MAIN ──────────────────
function App(){
  const[tab,setTab]=useState(localStorage.getItem('sef_default_tab')||"standings");
  const[films,setFilms]=useState(IS_LEGACY?FALLBACK_FILMS:[]);
  const[studioNames,setStudioNames]=useState(IS_LEGACY?DEFAULT_STUDIOS:{});
  const[liveStatus,setLiveStatus]=useState("loading");
  const[expandedExecs,setExpandedExecs]=useState(new Set());
  const[weeklyBO,setWeeklyBO]=useState(FALLBACK_WEEKLY_BO);
  const[weeklyPOI,setWeeklyPOI]=useState(FALLBACK_WEEKLY_POI);
  const[dailyBO,setDailyBO]=useState([]);
  const[membership,setMembership]=useState(null);
  const[leagueCtx,setLeagueCtx]=useState(null);
  const[leagueMembers,setLeagueMembers]=useState([]);
  const[showSettings,setShowSettings]=useState(false);
  const[showProfileMenu,setShowProfileMenu]=useState(false);
  const[draftSession,setDraftSession]=useState(null);
  const isAdmin = membership?.role === 'admin';
  // The current user's team name in this league (e.g. "BB", "BRANDON")
  // Used to highlight and scroll to their card in standings
  const myTeam = membership?.team_name || null;

  // Draft Room session state, fetched separately from the main slate load
  // since it only exists once an admin opts a brand-new league into
  // draft_mode='live' (migration 044). Passed down to ManageTab (setup
  // screen) and DraftRoomTab (live room), both of which also call this
  // directly after an RPC changes it, since Realtime only pushes changes to
  // components that are actually subscribed (DraftRoomTab), not this level.
  async function refreshDraftSession(){
    if(IS_LEGACY) return;
    try{
      const rows=await supabaseFetch("draft_sessions", `league_id=eq.${LEAGUE_UUID}&select=*`);
      setDraftSession((rows&&rows[0])||null);
    }catch(e){ /* draft_sessions migration not run yet, or no session -- fine either way */ }
  }
  useEffect(()=>{
    if(leagueCtx?.id) refreshDraftSession();
  },[leagueCtx?.id, leagueCtx?.draft_mode]);

  useEffect(()=>{
    async function loadData(){
      // Load league context first (no-op for legacy mode)
      await loadLeagueContext();
      // Sync module-level context into React state so components re-render
      if(LEAGUE_CONTEXT) setLeagueCtx(LEAGUE_CONTEXT);
      if(USER_MEMBERSHIP) setMembership(USER_MEMBERSHIP);
      if(LEAGUE_MEMBERS.length) setLeagueMembers(LEAGUE_MEMBERS);

      // ── 1. Main slate ─────────────────────────────────────────────────────
      let slateLoaded=false;
      if(IS_LEGACY){
        // Bare /league.html with no ?id= at all -- deliberately untouched by
        // the league_picks/universe_films migration. Still reads picks
        // directly, same CSV fallback as always.
        try{
          const rows = await supabaseFetch("picks", `league_id=eq.${LEAGUE_ID}&order=release_date.asc.nullslast`);
          console.log("[supabase] picks rows:", rows.length);
          if(rows.length>0){
            const films = rows.map(r=>({
              title:    r.title,
              bid:      Number(r.bid),
              bo:       Number(r.bo),
              team:     r.team,
              release:  r.release_date || null,
              status:   r.status || (r.release_date ? "upcoming" : "tba"),
              locked:   !!r.locked,
              voided:   !!r.voided,
              opening:  Number(r.opening_weekend||0),
              bom_id:   r.bom_release_id||null,
              imdb_id:  r.imdb_id||null,
            }));
            setFilms(films);
            setLiveStatus("live");
            slateLoaded=true;
            console.log("[supabase] slate loaded successfully");
          }
        } catch(e){
          console.error("[supabase] picks fetch error:", e.message);
          for(let attempt=0;attempt<2;attempt++){
            try{
              const res=await fetch(SHEET_CSV_URL);
              const text=await res.text();
              const rows=parseCSV(text);
              const result=processCSV(rows);
              if(result.films.length>0){
                setFilms(result.films);
                setStudioNames(result.studioNames);
                setLiveStatus("live");
                slateLoaded=true;
                break;
              }
            }catch(e2){
              if(attempt===0) await new Promise(r=>setTimeout(r,1500));
            }
          }
        }
      } else {
        // Every real league (including sef-2026's own ?id=c388b799... URL) --
        // film slate + box office now come from league_picks joined against
        // universe_films, so 20 leagues drafting the same film share one
        // scraped bo value instead of 20 independent copies.
        try{
          const rows = await supabaseFetch("league_picks",
            `league_id=eq.${LEAGUE_UUID}&select=*,universe_films(title,release_date,bo,opening_weekend,locked,imdb_id)`
          );
          console.log("[supabase] league_picks rows:", rows.length);
          {
            // Note: no rows.length>0 guard here on purpose. Zero rows is a
            // real, valid state for a brand-new league (no picks drafted
            // yet), not a failure -- it should render an empty slate, not
            // silently fall through to FALLBACK_FILMS's sample data.
            const films = rows.map(r=>{
              const uf = r.universe_films || null; // null for a Festival Futures placeholder pick
              const release = uf?.release_date || r.release_date || null;
              return {
                id:       r.id, // the league_picks row id -- needed for refund_my_film()
                title:    uf?.title || r.title,
                bid:      Number(r.bid),
                bo:       Number(uf?.bo || 0),
                team:     r.team_name,
                release:  release,
                status:   !release ? "tba" : (new Date(release) <= new Date() ? "released" : "upcoming"),
                locked:   !!uf?.locked,
                voided:   !!r.voided,
                opening:  Number(uf?.opening_weekend || 0),
                bom_id:   uf?.bom_release_id || null,
                imdb_id:  r.imdb_id || null,
              };
            }).sort((a,b)=>{
              // PostgREST can't order by an embedded column, so sort client-side
              if(!a.release && !b.release) return 0;
              if(!a.release) return 1;
              if(!b.release) return -1;
              return new Date(a.release) - new Date(b.release);
            });
            // Rebuild the exec roster (colors + display names) from the teams
            // that actually appear in this league's picks -- NOT from
            // league_members.team_name. Those two can legitimately differ: a
            // migrated league's league_picks.team_name may still hold old
            // team codes (e.g. "BRANDON") while league_members.team_name
            // holds real account display names. Building the roster from
            // league_members previously caused execs[f.team] to come back
            // undefined for every film in such a league, crashing the render
            // (blank page). A brand-new league naturally yields zero teams
            // here since films is empty, which is the desired empty state.
            // A member can pick their own color (see league_members.color,
            // migration 016) -- prefer that over the auto-assigned palette
            // rotation when one's been set.
            const memberColorByTeam = {};
            const memberPlayerNameByTeam = {};
            LEAGUE_MEMBERS.forEach(m=>{
              if(m.team_name && m.color) memberColorByTeam[m.team_name]=m.color;
              if(m.team_name && m.profile?.display_name) memberPlayerNameByTeam[m.team_name]=m.profile.display_name;
            });
            const newColors = {}, newDisplay = {}, newPlayerNames = {};
            let colorIdx = 0;
            films.forEach(f=>{
              if(!f.team || newColors[f.team]) return;
              newColors[f.team] = memberColorByTeam[f.team] || TEAM_COLOR_PALETTE[colorIdx % TEAM_COLOR_PALETTE.length];
              newDisplay[f.team] = f.team;
              // Falls back to the studio name itself when no member row/profile
              // matches (e.g. a stale team_name left over from before a rename).
              newPlayerNames[f.team] = memberPlayerNameByTeam[f.team] || f.team;
              colorIdx++;
            });
            EXEC_COLORS = newColors;
            DISPLAY = newDisplay;
            PLAYER_NAMES = newPlayerNames;

            // Real per-team Acquisitions budget breakdown, replacing the
            // legacy hardcoded REMAINDERS for any league that's opted in
            // (see getTeamRemainder() above).
            if(LEAGUE_CONTEXT?.acquisitions_enabled){
              try{
                const session2=getSession();
                const budgetRes=await fetch(`${SUPABASE_URL}/rest/v1/rpc/league_acquisitions_budgets`,{
                  method:"POST",
                  headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${session2?.access_token||SUPABASE_ANON_KEY}`,"Content-Type":"application/json"},
                  body:JSON.stringify({p_league_id:LEAGUE_UUID})
                });
                if(budgetRes.ok){
                  const budgetRows=await budgetRes.json();
                  const newAcqBudgets={};
                  (budgetRows||[]).forEach(r=>{
                    newAcqBudgets[r.team_name]={
                      remaining: Number(r.remaining),
                      budgetDefault: Number(r.budget_default),
                      remainderCredit: Number(r.remainder_credit),
                      refundCredits: Number(r.refund_credits),
                      spent: Number(r.spent),
                    };
                  });
                  ACQ_BUDGETS=newAcqBudgets;
                }
              }catch(e){ console.warn("[acquisitions] budgets fetch failed:", e.message); }
            }

            setFilms(films);
            setLiveStatus("live");
            slateLoaded=true;
            console.log("[supabase] slate loaded successfully");
          }
        } catch(e){
          console.error("[supabase] league_picks fetch error:", e.message);
        }
      }
      if(!slateLoaded) setLiveStatus("fallback");

      // ── 2. Weekly BO snapshots — from Supabase ──────────────────────────
      try{
        const rows = await supabaseFetch("weekly_bo_snapshots", `league_id=eq.${LEAGUE_ID}&order=snapshot_date.asc`);
        if(rows.length>0){
          const byWeek={};
          rows.forEach(r=>{
            if(!byWeek[r.week_label]) byWeek[r.week_label]={week:r.week_label};
            byWeek[r.week_label][r.team]=Number(r.bo);
          });
          const parsed=Object.values(byWeek);
          if(parsed.length>0) setWeeklyBO(parsed);
        }
      }catch(e){ console.warn("[supabase] weekly_bo error:", e.message); }

      // ── 3. Weekly POI snapshots — from Supabase ──────────────────────────
      try{
        const rows = await supabaseFetch("weekly_poi_snapshots", `league_id=eq.${LEAGUE_ID}&order=snapshot_date.asc`);
        if(rows.length>0){
          const byWeek={};
          rows.forEach(r=>{
            if(!byWeek[r.week_label]) byWeek[r.week_label]={week:r.week_label};
            byWeek[r.week_label][r.team]=Number(r.poi)*100;
          });
          const parsed=Object.values(byWeek);
          if(parsed.length>0) setWeeklyPOI(parsed);
        }
      }catch(e){ console.warn("[supabase] weekly_poi error:", e.message); }

      // ── 4. Daily BO — from Supabase ──────────────────────────────────────
      try{
        const rows = await supabaseFetch("daily_bo", `league_id=eq.${LEAGUE_ID}&order=bo_date.asc`);
        if(rows.length>0){
          const byFilm={};
          rows.forEach(r=>{
            if(!byFilm[r.film_title]) byFilm[r.film_title]=[];
            byFilm[r.film_title].push(r);
          });
          const parsed=[];
          Object.entries(byFilm).forEach(([film,days])=>{
            let cum=0;
            days.forEach((r,i)=>{
              cum+=Number(r.daily_gross);
              parsed.push({film,date:r.bo_date,dow:"",dayNum:i+1,daily:Number(r.daily_gross),cumulative:cum,theaters:0});
            });
          });
          if(parsed.length>0) setDailyBO(parsed);
        }
      }catch(e){ console.warn("[supabase] daily_bo error:", e.message); }
    }
    loadData();
  },[]);

  const data=useMemo(()=>{
    const execs={};
    Object.keys(EXEC_COLORS).forEach(t=>{execs[t]={name:t,films:[],totalSpent:0,totalBO:0,filmCount:0}});
    films.forEach(f=>{const e=execs[f.team];if(!e)return;e.films.push(f);e.totalSpent+=f.bid;e.totalBO+=f.bo;e.filmCount++});
    Object.values(execs).forEach(e=>{
      const eRem=getTeamRemainder(e.name);
      e.remaining=eRem?eRem.remaining:0;
      e.grandTotal=e.totalBO+e.remaining*1e6;
      // POI: BO earned / money committed (released + voided)
      // Voided films add to the spend denominator (dead money) but contribute $0 BO
      const releasedFilms=e.films.filter(f=>f.bo>0);
      const voidedFilms=e.films.filter(f=>f.voided);
      let poiBO=releasedFilms.reduce((s,f)=>s+f.bo,0);
      let poiSpend=releasedFilms.reduce((s,f)=>s+f.bid,0);
      // Add voided bids to denominator only — they earned nothing
      poiSpend+=voidedFilms.reduce((s,f)=>s+f.bid,0);
      // Add remainder to both (matches sheet behavior)
      const rem=getTeamRemainder(e.name);
      if(rem&&rem.remaining>0){
        poiBO+=rem.remaining*1e6;
        poiSpend+=rem.remaining;
      }
      e.poi=poiSpend>0?(poiBO/(poiSpend*1e6))*100:0;
      // Display stats
      e.releasedSpend=releasedFilms.reduce((s,f)=>s+f.bid,0);
      e.releasedBO=releasedFilms.reduce((s,f)=>s+f.bo,0);
      e.releasedCount=releasedFilms.length;
    });
    const ranked=Object.values(execs).sort((a,b)=>b.grandTotal-a.grandTotal);
    ranked.forEach((e,i)=>e.rank=i+1);
    const poiRanked=[...Object.values(execs)].sort((a,b)=>b.poi-a.poi);
    poiRanked.forEach((e,i)=>e.poiRank=i+1);
    return{execs,ranked,poiRanked};
  },[films]);

// ─── RELEASE DAY SYSTEM ──────────────────────────────────────────────────────
function todayStr(){
  const d=new Date();
  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const TODAY=todayStr();

function isReleaseDay(releaseDate){
  if(!releaseDate) return false;
  return releaseDate.split('T')[0]===TODAY;
}

// Parse a YYYY-MM-DD string into a Date at local noon (avoids UTC midnight timezone shift)
// Use this everywhere we need a Date object from a release string
function parseReleaseDate(str){
  if(!str) return null;
  const s=str.split('T')[0];
  const parts=s.split('-');
  if(parts.length!==3) return null;
  // noon local time — safe from any timezone's UTC offset
  return new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]),12,0,0);
}

// ── Reusable countdown badge — shows "Today", "Tomorrow", "In Xd" when <7 days away ──
function CountdownBadge({release,status}){
  if(!release||status==="released"||status==="tba") return null;
  const releaseD=parseReleaseDate(release);
  if(!releaseD) return null;
  const days=Math.ceil((releaseD-new Date())/864e5);
  if(days<0||days>7) return null;
  const label=days===0?"Today":days===1?"Tomorrow":`In ${days}d`;
  return(
    <span style={{fontSize:8,background:"rgba(251,191,36,0.12)",color:"#fbbf24",padding:"1px 5px",borderRadius:3,fontWeight:700}}>
      {label}
    </span>
  );
}
// In-app notifications bell. Polls rather than using Supabase Realtime
// (not set up anywhere in this project yet) -- a 60s poll is plenty for
// notification freshness and needs no new infrastructure.
function NotificationBell(){
  const[open,setOpen]=useState(false);
  const[items,setItems]=useState([]);
  const[loaded,setLoaded]=useState(false);
  const session=getSession();
  const uid=session?.user?.id;
  const wrapRef=useRef(null);

  // Close on any click outside this component. The bell button and the
  // whole dropdown (including the delete/Clear all buttons) all live
  // inside wrapRef, so clicking any of those is an "inside" click and
  // won't close it -- only clicking elsewhere on the page does.
  useEffect(()=>{
    if(!open) return;
    function onDocMouseDown(e){
      if(wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
    }
    document.addEventListener("mousedown", onDocMouseDown);
    return()=>document.removeEventListener("mousedown", onDocMouseDown);
  },[open]);

  async function load(){
    if(!uid) return;
    try{
      const rows=await supabaseFetch("notifications",`user_id=eq.${uid}&order=created_at.desc&limit=20`);
      setItems(rows||[]);
    }catch(e){ console.warn("[notifications] load failed:", e.message); }
    setLoaded(true);
  }

  useEffect(()=>{
    load();
    const t=setInterval(load,60000);
    return()=>clearInterval(t);
  },[]);

  const unread=items.filter(n=>!n.read);

  async function markRead(ids){
    if(!ids.length) return;
    try{
      await fetch(`${SUPABASE_URL}/rest/v1/rpc/mark_notifications_read`,{
        method:"POST",
        headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":`Bearer ${session?.access_token||SUPABASE_ANON_KEY}`,"Content-Type":"application/json"},
        body:JSON.stringify({p_ids:ids})
      });
      setItems(prev=>prev.map(n=>ids.includes(n.id)?{...n,read:true}:n));
    }catch(e){ console.warn("[notifications] mark-read failed:", e.message); }
  }

  async function deleteOne(id){
    setItems(prev=>prev.filter(n=>n.id!==id));
    try{

function Sparkler({width=120,height=40,intervalMs=2800,particleCount=18}){
  const canvasRef=useRef(null);
  const particlesRef=useRef([]);
  const rafRef=useRef(null);
  const COLORS=['#d4a843','#fbbf24','#ffffff','#f59e0b','#fde68a','#fcd34d','#fffbeb'];

  function spawnBurst(canvas){
    const w=canvas.width,h=canvas.height;
    // Pick a random edge point as the launch origin
    const edge=Math.floor(Math.random()*4);
    let ox,oy,angleMin,angleMax;
    if(edge===0){ox=Math.random()*w;oy=0;angleMin=10;angleMax=170;}         // top
    else if(edge===1){ox=w;oy=Math.random()*h;angleMin=100;angleMax=260;}   // right
    else if(edge===2){ox=Math.random()*w;oy=h;angleMin=190;angleMax=350;}   // bottom
    else{ox=0;oy=Math.random()*h;angleMin=280;angleMax=440;}                // left (wraps)

    for(let i=0;i<particleCount;i++){
      const angle=((angleMin+Math.random()*(angleMax-angleMin))%360)*Math.PI/180;
      const speed=1.5+Math.random()*3.5;
      particlesRef.current.push({
        x:ox,y:oy,
        vx:Math.cos(angle)*speed,
        vy:Math.sin(angle)*speed,
        alpha:1,
        life:1,
        decay:0.012+Math.random()*0.018,
        size:1.5+Math.random()*2.5,
        color:COLORS[Math.floor(Math.random()*COLORS.length)],
        gravity:0.06+Math.random()*0.04,
        trail:[],
      });
    }
  }

  useEffect(()=>{
    const canvas=canvasRef.current;
    if(!canvas) return;
    const ctx=canvas.getContext('2d');
    canvas.width=canvas.offsetWidth||120;
    canvas.height=canvas.offsetHeight||40;

    // Initial burst immediately
    spawnBurst(canvas);

    // Recurring bursts
    const interval=setInterval(()=>spawnBurst(canvas),intervalMs);

    function draw(){
      const w=canvas.width,h=canvas.height;
      ctx.clearRect(0,0,w,h);
      particlesRef.current=particlesRef.current.filter(p=>p.life>0);
      for(const p of particlesRef.current){
        // Draw trail
        if(p.trail.length>1){
          ctx.beginPath();
          ctx.moveTo(p.trail[0].x,p.trail[0].y);
          for(let i=1;i<p.trail.length;i++) ctx.lineTo(p.trail[i].x,p.trail[i].y);
          ctx.strokeStyle=p.color;
          ctx.globalAlpha=p.alpha*0.3;
          ctx.lineWidth=p.size*0.5;
          ctx.stroke();
          ctx.globalAlpha=1;
        }
        // Draw particle head
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fillStyle=p.color;
        ctx.globalAlpha=p.alpha;
        ctx.fill();
        // Glow
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size*1.8,0,Math.PI*2);
        ctx.fillStyle=p.color;
        ctx.globalAlpha=p.alpha*0.25;
        ctx.fill();
        ctx.globalAlpha=1;
        // Update
        p.trail.push({x:p.x,y:p.y});
        if(p.trail.length>5) p.trail.shift();
        p.x+=p.vx;
        p.y+=p.vy;
        p.vy+=p.gravity;
        p.vx*=0.97;
        p.life-=p.decay;
        p.alpha=Math.max(0,p.life);
      }
      rafRef.current=requestAnimationFrame(draw);
    }
    draw();

    return()=>{
      clearInterval(interval);
      cancelAnimationFrame(rafRef.current);
    };
  },[]);

  return(
    <canvas ref={canvasRef} style={{
      position:'absolute',inset:0,width:'100%',height:'100%',
      pointerEvents:'none',borderRadius:'inherit',
    }}/>
  );
}
